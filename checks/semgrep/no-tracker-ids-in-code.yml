# This rule scans its own directory. Source and comments describe pending work
# in words so they remain useful without access to a separate tracking system.

rules:
  - id: no-tracker-ids-in-code
    message: >-
      Issue identifiers do not belong in source. They rot when the tracker
      changes and mean nothing to a reader without access. Describe the
      pending work in words.
    severity: ERROR
    languages: [generic]
    pattern-regex: '\bOF-\d+\b|\bOPENPIT-\d+\b|\bSDK-\d+\b'
    paths:
      exclude:
        - /web/node_modules
        - /web/dist
        - /web/lib
        - .venv
        - .ruff_cache
        - __pycache__
        - .tmp
        - .git
        - CHANGELOG.md
