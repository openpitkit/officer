# This rule scans its own directory. Source and comments describe pending work
# in words so they remain useful without access to a separate tracking system.
#
# Prefixes are listed explicitly: a generic [A-Z]+-<digits> pattern would match
# UTF-8, SHA-256, ISO-8601 and every similar spelling. Links into a hosted
# tracker are matched by host, whatever issue they point at.

rules:
  - id: no-tracker-ids-in-code
    message: >-
      Issue identifiers and links into an issue tracker do not belong in
      source. They rot when the tracker changes and mean nothing to a reader
      without access. Describe the pending work in words.
    severity: ERROR
    languages: [generic]
    pattern-regex: >-
      \b(OPENPIT|PIT|SDK|OF|OFS|CLD|CLW|JMW)-\d+\b|TODO\([^)]*-\d+\)|\b[a-z0-9-]+\.atlassian\.net\b|\bapp\.plane\.so\b|\blinear\.app/
    paths:
      exclude:
        - /web/node_modules
        - /web/dist
        - /web/lib
        - .venv
        - .ruff_cache
        - __pycache__
        - .tmp
        - .git
        - CHANGELOG.md
