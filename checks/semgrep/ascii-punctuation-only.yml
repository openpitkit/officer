# ASCII punctuation keeps source, comments, and documentation portable across
# terminals, diffs, and documentation pipelines.

rules:
  - id: ascii-punctuation-only
    message: >-
      Use ASCII punctuation: replace an em dash or en dash with a hyphen.
      Non-ASCII dashes render inconsistently across terminals, diffs, and
      documentation pipelines.
    severity: ERROR
    languages: [generic]
    pattern-regex: '[\x{2013}\x{2014}]'
    paths:
      exclude:
        - /web/node_modules
        - /web/dist
        - /web/lib
        - .venv
        - .ruff_cache
        - __pycache__
        - .tmp
        - .wt
        - .serena
        - .git
