# Profit and loss is written P&L in every panel string.
#
# The panel writes the abbreviation one way in every locale: P&L, with the
# ampersand. It never writes PnL, PNL or Pnl, their plurals, or a one-letter
# prefix such as uPnL or rPnL: an unrealized, realized or total P&L is named
# in words. Where the operator picks a policy, the label spells out profit and
# loss.
#
# What is not read: a key, a `{{placeholder}}`, and a value word that is part
# of a longer identifier, such as `realized_pnl` in a CSV header. The match is
# case-sensitive on the capital P, so a lowercase machine identifier `pnl`
# passes.
#
# It is a text rule over prettier-formatted JSON: a key and its string value
# sit on one line, which the regex reads from the line start.

rules:
  - id: locale-pnl-spelling
    message: >-
      Write profit and loss as P&L in a panel string, never PnL, PNL, uPnL or
      rPnL; name an unrealized, realized or total P&L in words.
    severity: ERROR
    languages: [generic]
    pattern-regex: |-
      (?mx)
      ^[ \t]*"[^"\\\n]*"[ ]*:[ ]*"
      (?: \{\{[^}\n]*\}\} | \\. | \{(?!\{) | [^"\\{\n] )*?
      \K
      (?<![A-Za-z0-9_])[A-Za-z]?P(?:nL|NL|nl)s?(?![A-Za-z0-9_])
    paths:
      include:
        - "/web/src/i18n/locales/*/*.json"
