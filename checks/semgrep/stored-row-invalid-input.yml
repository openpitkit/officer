# Classify corrupt stored values as internal without reclassifying input
# lookups or shared archive consistency checks. Bind parsers to scanned columns.
rules:
  - id: stored-row-invalid-input
    message: >-
      A stored-row scan or decode exposes a validation error as client input.
      Internal failures must not wrap domain.ErrInvalid; drop the wrap or use
      domain.Internal for a stored-value parser's cause.
    severity: ERROR
    languages: [go]
    patterns:
      - pattern-not-inside: domain.Internal(...)
      - pattern-not-inside: |
          func ($RESTORE *restoreTx) $METHOD(...) $RESULT { ... }
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      func $FUNC(...) $RET { ... }
                  - pattern-inside: |
                      func ($RECV $TYPE) $FUNC(...) $RET { ... }
              - metavariable-regex:
                  metavariable: $FUNC
                  regex: '^(?:scan|decode)'
              - pattern-either: &invalid
                  - pattern: errors.Join(..., domain.ErrInvalid, ...)
                  - pattern: fmt.Errorf(..., domain.ErrInvalid, ...)
                  - pattern: return domain.ErrInvalid
                  - pattern: return ..., domain.ErrInvalid
          - patterns:
              - pattern-either: &scanned-column
                  - pattern-inside: |
                      func $FUNC(...) $RET {
                        ...
                        $ROW.Scan(..., &$RAW, ...)
                        ...
                      }
                  - pattern-inside: |
                      func ($RECV $TYPE) $FUNC(...) $RET {
                        ...
                        $ROW.Scan(..., &$RAW, ...)
                        ...
                      }
              - pattern-either:
                  - pattern-inside: |
                      if $ERR := json.Unmarshal([]byte($RAW), ...); $ERR != nil { ... }
                  - pattern-inside: |
                      if $ERR := json.Unmarshal($RAW, ...); $ERR != nil { ... }
                  - pattern-inside: |
                      if !json.Valid([]byte($RAW)) { ... }
                  - pattern-inside: |
                      if !json.Valid($RAW) { ... }
              - pattern-either: *invalid
          - patterns:
              - pattern-either: *scanned-column
              - pattern-either:
                  - pattern-inside: |
                      $ID, $ERR := domain.ExternalIDFromBytes($RAW)
                      if $ERR != nil { ... }
                  - pattern-inside: |
                      $ID, $ERR = domain.ExternalIDFromBytes($RAW)
                      if $ERR != nil { ... }
                  - pattern-inside: |
                      if $ID, $ERR := domain.ExternalIDFromBytes($RAW); $ERR != nil { ... }
                  - pattern-inside: |
                      if $ID, $ERR = domain.ExternalIDFromBytes($RAW); $ERR != nil { ... }
              - pattern: fmt.Errorf($FMT, ..., $ERR)
              - metavariable-regex:
                  metavariable: $FMT
                  regex: '.*%w[^%]*"$'
    paths:
      include:
        - "/internal/store/sqlite/**"
      exclude:
        - "**/*_test.go"
        - "/checks/semgrep/testdata/**"
