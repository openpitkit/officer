# No sleep inside a test HTTP handler (Go).
#
# A test server that sleeps to answer "late" races its sleep against the
# client's deadline. Both are timers in one loaded process: when the runner
# is busy, the deadline fires after the sleep has ended, the late answer
# arrives in time, and the test fails without a defect. Under `-race` and
# several parallel gates that happens often enough to redden the gate.
#
# The handler holds its answer on an event instead: the request context,
# which the server cancels when the client hangs up (an empty-body request
# only - the server notices the hang-up once the body is read), or a channel
# the test closes after the client call returns.
#
# Scope is test code: a production handler that sleeps is a different
# question and is not this rule's business.

rules:
  - id: handler-sleep-in-tests
    message: >-
      A test HTTP handler sleeps, racing a timer against the client's
      deadline; on a loaded runner the sleep can end first. Hold the answer
      on an event: the request context or a channel the test closes.
    severity: ERROR
    languages: [go]
    patterns:
      - pattern-inside: |
          func($W http.ResponseWriter, $R *http.Request) {
            ...
          }
      - pattern: time.Sleep(...)
    paths:
      include:
        - "**/*_test.go"
