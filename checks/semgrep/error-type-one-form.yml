# Check type-switch cases and pairs of errors.As targets in production Go.
# The switch check compares type spellings within one case. The errors.As
# check follows addressed local variables with explicit types in one function
# body. Known misses include type aliases, parenthesised types, the two forms
# in separate cases of one switch, a switch or type assertion in one form with
# errors.As in the other, inferred or inline errors.As targets, targets that are
# parameters, fields or package variables, and a case list whose earlier item
# contains braces.
# This rule has no approval marker or baseline.
rules:
  - id: error-type-one-form
    message: Probe an error type in its value or its pointer form only.
    severity: ERROR
    languages: [go]
    patterns:
      - pattern-either:
          # The switch patterns establish the Go syntax and the regex checks
          # the type spelling. In a case list *$T parses as a dereference,
          # metavariable-pattern cannot bind a type, and metavariable-comparison
          # cannot concatenate strings.
          - patterns:
              - pattern-either:
                  - pattern: |
                      switch $ERR.(type) {
                      case ...
                      case ..., $FIRST, ..., $SECOND, ...:
                        ...
                      case ...
                      }
                  - pattern: |
                      switch $NAME := $ERR.(type) {
                      case ...
                      case ..., $FIRST, ..., $SECOND, ...:
                        ...
                      case ...
                      }
              - pattern-regex: |-
                  (?x)
                  (?(DEFINE)
                    (?<trivia> (?: \s | /\* .*? \*/ | // [^\r\n]* )* )
                    (?<brackets> \[ (?: [^\[\]] | (?&brackets) )* \] )
                    (?<type> [\p{L}_][\p{L}\p{Nd}_]*
                      (?: \. [\p{L}_][\p{L}\p{Nd}_]* )? (?&brackets)? )
                    (?<item> (?: (?&brackets) | [^\[\],:{}] )+ , (?&trivia) )
                  )
                  \bcase\b (?&trivia) (?&item)*
                  (?:
                    (?<value_first>(?&type)) (?&trivia) , (?&trivia)
                    (?&item)* \* (?&trivia) \k<value_first>
                  |
                    \* (?&trivia) (?<pointer_first>(?&type)) (?&trivia) ,
                    (?&trivia) (?&item)* \k<pointer_first>
                  )
                  (?= (?&trivia) [,:] )
              - focus-metavariable: $FIRST
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      func $FUNC(...) {
                        $...BODY
                      }
                  - pattern-inside: |
                      func(...) {
                        $...BODY
                      }
              - pattern-either:
                  - pattern: |
                      var $VALUE $T
                      ...
                      var $POINTER *$T
                  - pattern: |
                      var $POINTER *$T
                      ...
                      var $VALUE $T
              - metavariable-pattern:
                  metavariable: $...BODY
                  pattern: errors.As($FIRST_ERR, &$VALUE)
              - metavariable-pattern:
                  metavariable: $...BODY
                  pattern: errors.As($SECOND_ERR, &$POINTER)
    paths:
      include:
        - "**/*.go"
      exclude:
        - "**/*_test.go"
        - "/checks/semgrep/testdata/**"
