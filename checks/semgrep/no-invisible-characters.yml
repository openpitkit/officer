# Invisible/zero-width characters across the whole codebase.
#
# No paths.include: a generic rule without one scans every text file Semgrep
# can read, which is what "the whole codebase" means.

rules:
  - id: no-invisible-characters
    message: >-
      Invisible or zero-width characters are not allowed. They are unreadable
      in review, survive copy-paste, and are a known vector for hidden text and
      homoglyph confusion.
    severity: ERROR
    languages: [generic]
    pattern-regex: '[\x{200B}-\x{200F}\x{202A}-\x{202E}\x{2060}-\x{2064}\x{2066}-\x{206F}]'
    paths:
      exclude:
        - /web/node_modules
        - /web/dist
        - /web/lib
        - .venv
        - .ruff_cache
        - __pycache__
        - .tmp
        - .git
