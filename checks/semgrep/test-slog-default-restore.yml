# Semgrep resolves named import aliases for slog.SetDefault. Dot imports need
# an import-anchored pattern for the unqualified SetDefault call.

rules:
  - id: test-slog-default-restore
    message: >-
      Use internal/logtest.SetDefault: slog.SetDefault also redirects the
      standard log writer and clears its flags; restoring only the slog
      logger leaves later tests logging into the finished test's buffer.
    severity: ERROR
    languages: [go]
    pattern-either:
      - pattern: slog.SetDefault(...)
      - patterns:
          - pattern-inside: |
              import . "log/slog"
              ...
          - pattern: SetDefault(...)
    paths:
      include:
        - "**/*_test.go"
      exclude:
        - "/checks/semgrep/testdata/**"
