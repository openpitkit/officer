# A discarded Close error is a silent fallback in every package: Close on a
# written file, SQLite handle, or rows iterator can report a real failure.
# Tests are excluded because pure teardown has no dependent operation; tests
# that rely on the closed resource must check Close errors explicitly.
# Bare `$X.Close()` statements and `defer $X.Close()` with an error result
# belong to golangci-lint's errcheck, not this rule.

rules:
  - id: discarded-close-error
    message: >-
      The Close error is discarded; join it into the returned error or report it.
    severity: ERROR
    languages: [go]
    pattern: _ = $X.Close(...)
    paths:
      exclude:
        - "**/*_test.go"
        - "/checks/semgrep/testdata/**"
