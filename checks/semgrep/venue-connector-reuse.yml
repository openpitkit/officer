# Five excluded market-data files are public feeds without credentials;
# finnhub.go carries its token in the URL and is excluded as existing debt.
# A new feed must use vendorhttp.DialStream or be added to these exclusions.
rules:
  - id: shared-vendor-stream-dial
    message: Use vendorhttp.DialStream and vendorhttp.StreamWriter for vendor streams.
    severity: ERROR
    languages: [go]
    options:
      implicit_ellipsis: false
    pattern-either:
      - pattern: websocket.Dial(...)
      - pattern: |
          type $TYPE interface {
            Write(context.Context, websocket.MessageType, []byte) error
          }
      - pattern: |
          type $TYPE interface {
            Write($CTX context.Context, $TYP websocket.MessageType, $PAYLOAD []byte) error
          }
    paths:
      include:
        - "/internal/**"
      exclude:
        - "/internal/vendorhttp/**"
        - "/internal/marketdata/binance.go"
        - "/internal/marketdata/bybit.go"
        - "/internal/marketdata/okx.go"
        - "/internal/marketdata/kraken.go"
        - "/internal/marketdata/coinbase.go"
        - "/internal/marketdata/finnhub.go"
        - "**/*_test.go"
        - "/checks/semgrep/testdata/**"

  - id: shared-venue-stream-lifecycle
    message: Run the stream through streamLifecycle in stream_lifecycle.go for reconnects.
    severity: ERROR
    languages: [go]
    pattern: backoff.$F
    paths:
      include:
        - "/internal/trading/**"
      exclude:
        - "/internal/trading/stream_lifecycle.go"
        - "**/*_test.go"
        - "/checks/semgrep/testdata/**"

  - id: shared-vendor-http-redirect
    message: Use internal/vendorhttp redirect refusal for vendor HTTP clients and streams.
    severity: ERROR
    languages: [go]
    pattern-either:
      - pattern: http.ErrUseLastResponse
      - pattern: $CLIENT.CheckRedirect = $POLICY
      - patterns:
          - pattern: "$TYPE{..., CheckRedirect: $POLICY, ...}"
          - pattern-not: "$TYPE{..., CheckRedirect: vendorhttp.RefuseRedirect, ...}"
    paths:
      include:
        - "/internal/**"
      exclude:
        - "/internal/vendorhttp/**"
        - "**/*_test.go"
        - "/checks/semgrep/testdata/**"

  - id: shared-vendor-http-wrap
    message: Use vendorhttp.Wrap for a redacted request message with its raw cause.
    severity: ERROR
    languages: [go]
    pattern-either:
      - pattern: "$TYPE{$R.Replace($PREFIX + $ERR.Error()), $ERR}"
      - pattern: "$TYPE{..., $MESSAGE: $R.Replace($PREFIX + $ERR.Error()), $CAUSE: $ERR, ...}"
      - pattern: vendorhttp.NewRequestError($R.Replace($PREFIX + $ERR.Error()), $ERR)
    paths:
      include:
        - "/internal/**"
      exclude:
        - "/internal/vendorhttp/**"
        - "**/*_test.go"
        - "/checks/semgrep/testdata/**"

  - id: shared-vendor-http-error
    message: Use vendorhttp.NewRequestError instead of a private message-and-cause error.
    severity: ERROR
    languages: [go]
    patterns:
      - pattern-either:
          - pattern: |
              type $TYPE struct {
                $MESSAGE string
                $CAUSE error
              }
          - pattern: |
              type $TYPE struct {
                $CAUSE error
                $MESSAGE string
              }
      - metavariable-regex:
          metavariable: $TYPE
          regex: '^[a-z]'
      - pattern-not: |
          type $TYPE struct {
            $F1 $T1
            $F2 $T2
            $F3 $T3
            ...
          }
      - pattern-not-inside: |
          func $F(...) { ... }
      - pattern-not-inside: |
          func(...) { ... }
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  type $TYPE struct {...}
                  ...
                  func ($E *$ERROR_TYPE) Error() string { return $E.$ERROR_MESSAGE }
              - pattern-inside: |
                  func ($E *$ERROR_TYPE) Error() string { return $E.$ERROR_MESSAGE }
                  ...
                  type $TYPE struct {...}
              - pattern-inside: |
                  type $TYPE struct {...}
                  ...
                  func ($E $ERROR_TYPE) Error() string { return $E.$ERROR_MESSAGE }
              - pattern-inside: |
                  func ($E $ERROR_TYPE) Error() string { return $E.$ERROR_MESSAGE }
                  ...
                  type $TYPE struct {...}
          - metavariable-comparison:
              comparison: str($TYPE) == str($ERROR_TYPE)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  type $TYPE struct {...}
                  ...
                  func ($U *$UNWRAP_TYPE) Unwrap() error { return $U.$UNWRAP_CAUSE }
              - pattern-inside: |
                  func ($U *$UNWRAP_TYPE) Unwrap() error { return $U.$UNWRAP_CAUSE }
                  ...
                  type $TYPE struct {...}
              - pattern-inside: |
                  type $TYPE struct {...}
                  ...
                  func ($U $UNWRAP_TYPE) Unwrap() error { return $U.$UNWRAP_CAUSE }
              - pattern-inside: |
                  func ($U $UNWRAP_TYPE) Unwrap() error { return $U.$UNWRAP_CAUSE }
                  ...
                  type $TYPE struct {...}
          - metavariable-comparison:
              comparison: str($TYPE) == str($UNWRAP_TYPE)
    paths:
      include:
        - "/internal/**"
      exclude:
        - "/internal/vendorhttp/**"
        - "**/*_test.go"
        - "/checks/semgrep/testdata/**"

  - id: shared-vendor-credentials
    message: Delegate credential parsing to internal/apikey.
    severity: ERROR
    languages: [go]
    pattern-either:
      - pattern: '$M["apiKey"]'
      - pattern: '$X == "apiKey"'
      - pattern: '$X != "apiKey"'
      - pattern: '$M["apiSecret"]'
      - pattern: '$X == "apiSecret"'
      - pattern: '$X != "apiSecret"'
      - pattern: '$M["passphrase"]'
      - pattern: '$X == "passphrase"'
      - pattern: '$X != "passphrase"'
      - pattern: '$M["keyName"]'
      - pattern: '$X == "keyName"'
      - pattern: '$X != "keyName"'
      - pattern: '$M["privateKey"]'
      - pattern: '$X == "privateKey"'
      - pattern: '$X != "privateKey"'
      - patterns:
          - pattern: |
              switch $X {
                case $KEY:
                  ...
              }
          - metavariable-regex:
              metavariable: $KEY
              regex: '^"(apiKey|apiSecret|passphrase|keyName|privateKey)"$'
          - focus-metavariable: $KEY
      - patterns:
          - pattern-inside: |
              func ParseCredentials(...) {
                ...
              }
          - pattern-either:
              - pattern: json.Unmarshal(...)
              - pattern: json.NewDecoder(...)
    paths:
      include:
        - "/internal/**"
      exclude:
        - "/internal/apikey/**"
        - "**/*_test.go"
        - "/checks/semgrep/testdata/**"
