rules:
  - id: shared-venue-stream-lifecycle
    message: Run the stream through streamLifecycle in stream_lifecycle.go for reconnects.
    severity: ERROR
    languages: [go]
    pattern: backoff.$F
    paths:
      include:
        - "/internal/trading/**"
      exclude:
        - "/internal/trading/stream_lifecycle.go"
        - "**/*_test.go"
        - "/checks/semgrep/testdata/**"

  - id: shared-vendor-credentials
    message: Delegate credential parsing to internal/apikey.
    severity: ERROR
    languages: [go]
    pattern-either:
      - pattern: '$M["apiKey"]'
      - pattern: '$M["apiSecret"]'
      - pattern: '$X == "apiKey"'
      - pattern: '$X != "apiKey"'
      - pattern: '$X == "apiSecret"'
      - pattern: '$X != "apiSecret"'
      - patterns:
          - pattern: |
              switch $X {
                case $KEY:
                  ...
              }
          - metavariable-regex:
              metavariable: $KEY
              regex: '^"(apiKey|apiSecret)"$'
          - focus-metavariable: $KEY
      - patterns:
          - pattern-inside: |
              func ParseCredentials(...) {
                ...
              }
          - pattern-either:
              - pattern: json.Unmarshal(...)
              - pattern: json.NewDecoder(...)
    paths:
      include:
        - "/internal/**"
      exclude:
        - "/internal/apikey/**"
        - "**/*_test.go"
        - "/checks/semgrep/testdata/**"
