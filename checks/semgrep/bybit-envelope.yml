rules:
  - id: bybit-retcode-required
    message: >-
      Decode retCode as *int and refuse its absence.
      A field whose JSON key comes from its Go name (no json tag, or a json
      tag with an empty name) cannot be checked by this rule and remains with
      review.
    severity: ERROR
    languages: [go]
    paths:
      include: ["/internal/**"]
      exclude: ["**/*_test.go"]
    pattern-regex: '\b[A-Za-z_][A-Za-z0-9_]*[ \t]+(?:u?int(?:8|16|32|64)?|uintptr|byte|rune)[ \t]+`[^`\r\n]*\bjson:"(?i:retcode)[",][^`\r\n]*`'
