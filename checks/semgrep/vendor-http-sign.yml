rules:
  - id: shared-vendor-http-sign
    message: Use vendorhttp.SignHex for a hex HMAC-SHA256 vendor signature.
    severity: ERROR
    languages: [go]
    options:
      symbolic_propagation: true
    patterns:
      - pattern-either:
          - pattern-inside: |
              $MAC := hmac.New(sha256.New, ...)
              ...
          - pattern-inside: |
              var $MAC = hmac.New(sha256.New, ...)
              ...
      - pattern-either:
          - pattern: hex.EncodeToString($MAC.Sum(nil))
          - pattern: fmt.Sprintf("%x", $MAC.Sum(nil))
    paths:
      include:
        - "/internal/**"
      exclude:
        - "/internal/vendorhttp/**"
        - "**/*_test.go"
        - "/checks/semgrep/testdata/**"
