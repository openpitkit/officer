# Service.marketDataMu guards barrier and mode writes through their read-back.
rules:
  - id: barrier-write-lock
    message: >-
      Hold marketDataMu in every Service method that writes, removes or re-keys
      a limit barrier or the Spot Funds limit mode, through its read-back.
    severity: ERROR
    languages: [go]
    patterns:
      - pattern-inside: |
          func ($S *Service) $METHOD(...) { ... }
      - pattern-either:
          - pattern: $S.node.$WRITE(...)
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $NODE := $S.node
                      ...
                  - pattern-inside: |
                      $NODE = $S.node
                      ...
              - pattern: $NODE.$WRITE(...)
      - metavariable-regex:
          metavariable: $WRITE
          regex: >-
            ^(PutRateLimit|PutOrderSizeLimit|PutPositionLimit|PutSpotFundsPnlBoundsLimit|SetSpotFundsLimitMode|DeleteLimit|RestoreBackup|ResetDatabase|UpdateAccount|DeleteAccount|UpdateGroup|DeleteGroup|UpdateAsset|DeleteAsset)$
      - pattern-not-inside: |
          $S.marketDataMu.Lock()
          ...
    paths:
      include:
        - "/framework/backend/**"
      exclude:
        - "**/*_test.go"
        - "/checks/semgrep/testdata/**"
