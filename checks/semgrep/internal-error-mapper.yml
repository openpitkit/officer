# A single-error mapper must preserve non-domain failures as internal errors.
# Translate parsing and input errors at their validation call site, never
# in a general single-error mapper, even for a parsing package sentinel.
rules:
  - id: internal-error-mapper
    message: >-
      A general error mapper translates another package's failure to invalid
      input. Internal failures must not wrap domain.ErrInvalid; preserve the
      error or use domain.Internal at the internal caller.
    severity: ERROR
    languages: [go]
    patterns:
      - pattern-not-inside: domain.Internal(...)
      - pattern-inside: |
          func $FUNC($ERR error) error { ... }
      - pattern-either:
          - pattern-inside: |
              switch {
              case ...
              case ..., errors.Is($ERR, $PKG.$SENTINEL), ...:
                ...
              case ...
              }
          - patterns:
              - pattern-inside: |
                  if $COND { ... }
              - metavariable-pattern:
                  metavariable: $COND
                  pattern: errors.Is($ERR, $PKG.$SENTINEL)
      - metavariable-regex:
          metavariable: $PKG
          regex: '^(?!domain$).+'
      - metavariable-regex:
          metavariable: $SENTINEL
          regex: '^Err'
      - pattern-either:
          - pattern: errors.Join(..., domain.ErrInvalid, ...)
          - pattern: fmt.Errorf(..., domain.ErrInvalid, ...)
          - pattern: return domain.ErrInvalid
    paths:
      include:
        - "**/*.go"
      exclude:
        - "**/*_test.go"
        - "/checks/semgrep/testdata/**"
