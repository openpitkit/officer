rules:
  - id: no-legacy-database-probe
    message: >-
      Classify database versions from migration bookkeeping at startup.
      Do not add per-column shape probes or earlier-build handling.
    severity: ERROR
    languages: [go]
    patterns:
      - pattern: '"$STRING"'
      - metavariable-regex:
          metavariable: $STRING
          regex: '(?is).*(pragma[_\s]+table_x?info|earlier (officer )?build).*'
    paths:
      include:
        - "/internal/store/**"
      exclude:
        - "**/*_test.go"
        - "/checks/semgrep/testdata/**"
