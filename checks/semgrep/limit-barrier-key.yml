# Guard hand-built limit identities with exclude-only paths so new production directories are covered.
# Exclude tests/oracle and the domain constructor/panel helper that own key construction.
# New sites use domain.NewLimitKey/Key, limitKeyWhere or the panel limitTarget helpers.
# Error-return shapes stay explicit: unchecked errors may be nil; constructors and guards permit placeholders.
# Type lists stay explicit: a type metavariable inside a typed metavariable broke target parsing in Semgrep 1.175.0 (checks/semgrep/requirements.txt).

# symmetric_eq covers both == and != orientations in the reversed member/scalar oracle.

rules:
  - id: limit-key-literal
    message: Construct barrier keys through domain.NewLimitKey or Key; zero error results need a non-nil error shape.
    severity: ERROR
    languages: [go]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: "LimitKey{...}"
              - pattern: "domain.LimitKey{...}"
          - pattern-not: "LimitKey{}"
          - pattern-not: "domain.LimitKey{}"
      - patterns:
          - pattern-either:
              - pattern: "LimitKey{}"
              - pattern: "domain.LimitKey{}"
          - pattern-not-inside: "return LimitKey{}, $ERR"
          - pattern-not-inside: "return domain.LimitKey{}, $ERR"
      - patterns:
          - pattern: "return $KEY, $ERR"
          - metavariable-pattern:
              metavariable: $KEY
              pattern-either:
                - pattern: "LimitKey{}"
                - pattern: "domain.LimitKey{}"
          - pattern-not: "return $KEY, &$TYPE{...}"
          - metavariable-regex:
              metavariable: $ERR
              regex: "^(?!(?:(?:fmt\\.Errorf|errors\\.New|(?:[a-zA-Z_]\\w*\\.)?New\\w*Error)\\s*\\(|(?:[a-zA-Z_]\\w*\\.)?Err[A-Z]\\w*$))"
          - pattern-not-inside: |
              if $ERR != nil {
                ...
                return $KEY, $ERR
                ...
              }
          - pattern-not-inside: |
              if nil != $ERR {
                ...
                return $KEY, $ERR
                ...
              }
          - pattern-not-inside: |
              if $INIT; $ERR != nil {
                ...
                return $KEY, $ERR
                ...
              }
          - pattern-not-inside: |
              if $ERR != nil && $COND {
                ...
                return $KEY, $ERR
                ...
              }
          - pattern-not-inside: |
              if $COND && $ERR != nil {
                ...
                return $KEY, $ERR
                ...
              }
      - patterns:
          - pattern: "return $KEY, $Q.$F"
          - metavariable-pattern:
              metavariable: $KEY
              pattern-either:
                - pattern: "LimitKey{}"
                - pattern: "domain.LimitKey{}"
          - metavariable-regex:
              metavariable: $F
              regex: "^Err[A-Z]"
          - pattern-either:
              - pattern-inside: "func $FN(..., $Q $QUALIFIER_TYPE, ...) $RET { ... }"
              - pattern-inside: "func ($RECEIVER $RECEIVER_TYPE) $FN(..., $Q $QUALIFIER_TYPE, ...) $RET { ... }"
              - pattern-inside: "func(..., $Q $QUALIFIER_TYPE, ...) $RET { ... }"
              - pattern-inside: "func ($Q $QUALIFIER_TYPE) $FN(...) $RET { ... }"
              - pattern-inside: "func $FN(..., $Q $QUALIFIER_TYPE, ...) { ... }"
              - pattern-inside: "func ($RECEIVER $RECEIVER_TYPE) $FN(..., $Q $QUALIFIER_TYPE, ...) { ... }"
              - pattern-inside: "func(..., $Q $QUALIFIER_TYPE, ...) { ... }"
              - pattern-inside: "func ($Q $QUALIFIER_TYPE) $FN(...) { ... }"
          - pattern-not-inside: |
              if $Q.$F != nil {
                ...
                return $KEY, $Q.$F
                ...
              }
          - pattern-not-inside: |
              if nil != $Q.$F {
                ...
                return $KEY, $Q.$F
                ...
              }
          - pattern-not-inside: |
              if $INIT; $Q.$F != nil {
                ...
                return $KEY, $Q.$F
                ...
              }
          - pattern-not-inside: |
              if $Q.$F != nil && $COND {
                ...
                return $KEY, $Q.$F
                ...
              }
          - pattern-not-inside: |
              if $COND && $Q.$F != nil {
                ...
                return $KEY, $Q.$F
                ...
              }
    paths:
      exclude:
        - "**/*_test.go"
        - "/checks/semgrep/testdata/**"
        - "/framework/domain/limit_key.go"

  - id: limit-target-literal
    message: Derive barrier identity through domain.NewLimitKey or Key; LimitTarget is only the DELETE request DTO.
    severity: ERROR
    languages: [go]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: "LimitTarget{...}"
              - pattern: "node.LimitTarget{...}"
          - pattern-not-inside: |
              func $HANDLER($SERVICE backend.ControlPlane) http.HandlerFunc { ... }
      - patterns:
          - pattern-either:
              - pattern: "LimitTarget{...}"
              - pattern: "node.LimitTarget{...}"
          - pattern-inside: |
              func $HANDLER($SERVICE backend.ControlPlane) http.HandlerFunc { ... }
          - pattern-not: |
              node.LimitTarget{
                Policy: $QUERY.Get("policy"),
                Mode: domain.RuleMode($QUERY.Get("mode")),
                Scope: domain.LimitScope($QUERY.Get("scope")),
                Account: domain.AccountID($QUERY.Get("account")),
                AccountGroup: $QUERY.Get("accountGroup"),
                Asset: $QUERY.Get("asset"),
              }
    paths:
      exclude:
        - "**/*_test.go"
        - "/checks/semgrep/testdata/**"

  - id: limit-key-string-join
    message: Use domain.NewLimitKey or Key and map by domain.LimitKey instead of joining barrier axes.
    severity: ERROR
    languages: [go]
    paths:
      exclude:
        - "**/*_test.go"
        - "/checks/semgrep/testdata/**"
    pattern-either:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: "$A + $B"
                      - patterns:
                          - pattern: "fmt.Sprintf($FORMAT, ..., $A, ..., $B, ...)"
                          - metavariable-regex:
                              metavariable: $FORMAT
                              regex: "^\\S+$"
                      - pattern: "strings.Join([]string{..., $A, ..., $B, ...}, ...)"
                      - pattern: "$MAP[$F(..., $A, ..., $B, ...)]"
                  - metavariable-pattern:
                      metavariable: $A
                      pattern-either:
                        - patterns:
                            - pattern: "$OWNER.$FIELD"
                            - metavariable-regex:
                                metavariable: $FIELD
                                regex: "^(Scope|Axis|scope|axis)$"
                        - patterns:
                            - pattern: "$ID"
                            - metavariable-regex:
                                metavariable: $ID
                                regex: "^(scope|axis)$"
                            - pattern-not-inside: "$ID.$FIELD"
                        - patterns:
                            - pattern: "$OWNER.$FIELD"
                            - metavariable-regex:
                                metavariable: $FIELD
                                regex: "^(Scope|Account|AccountID|AccountGroup|Asset|Mode|Axis|scope|account|accountID|accountGroup|account_group|asset|mode|axis|group)$"
                            - metavariable-pattern:
                                metavariable: $OWNER
                                pattern-either:
                                  - pattern: "($VALUE : domain.LimitRate)"
                                  - pattern: "($VALUE : *domain.LimitRate)"
                                  - pattern: "($VALUE : domain.LimitPosition)"
                                  - pattern: "($VALUE : *domain.LimitPosition)"
                                  - pattern: "($VALUE : domain.LimitOrderSize)"
                                  - pattern: "($VALUE : *domain.LimitOrderSize)"
                                  - pattern: "($VALUE : domain.LimitSpotFundsPnlBounds)"
                                  - pattern: "($VALUE : *domain.LimitSpotFundsPnlBounds)"
                                  - pattern: "($VALUE : node.LimitTarget)"
                                  - pattern: "($VALUE : *node.LimitTarget)"
                                  - pattern: "($VALUE : LimitTarget)"
                                  - pattern: "($VALUE : *LimitTarget)"
                                  - pattern: "($VALUE : LimitRate)"
                                  - pattern: "($VALUE : *LimitRate)"
                                  - pattern: "($VALUE : LimitPosition)"
                                  - pattern: "($VALUE : *LimitPosition)"
                                  - pattern: "($VALUE : LimitOrderSize)"
                                  - pattern: "($VALUE : *LimitOrderSize)"
                                  - pattern: "($VALUE : LimitSpotFundsPnlBounds)"
                                  - pattern: "($VALUE : *LimitSpotFundsPnlBounds)"
              - patterns:
                  - pattern-either:
                      - pattern: "$A + $B"
                      - patterns:
                          - pattern: "fmt.Sprintf($FORMAT, ..., $A, ..., $B, ...)"
                          - metavariable-regex:
                              metavariable: $FORMAT
                              regex: "^\\S+$"
                      - pattern: "strings.Join([]string{..., $A, ..., $B, ...}, ...)"
                      - pattern: "$MAP[$F(..., $A, ..., $B, ...)]"
                  - metavariable-pattern:
                      metavariable: $B
                      pattern-either:
                        - patterns:
                            - pattern: "$OWNER.$FIELD"
                            - metavariable-regex:
                                metavariable: $FIELD
                                regex: "^(Scope|Axis|scope|axis)$"
                        - patterns:
                            - pattern: "$ID"
                            - metavariable-regex:
                                metavariable: $ID
                                regex: "^(scope|axis)$"
                            - pattern-not-inside: "$ID.$FIELD"
                        - patterns:
                            - pattern: "$OWNER.$FIELD"
                            - metavariable-regex:
                                metavariable: $FIELD
                                regex: "^(Scope|Account|AccountID|AccountGroup|Asset|Mode|Axis|scope|account|accountID|accountGroup|account_group|asset|mode|axis|group)$"
                            - metavariable-pattern:
                                metavariable: $OWNER
                                pattern-either:
                                  - pattern: "($VALUE : domain.LimitRate)"
                                  - pattern: "($VALUE : *domain.LimitRate)"
                                  - pattern: "($VALUE : domain.LimitPosition)"
                                  - pattern: "($VALUE : *domain.LimitPosition)"
                                  - pattern: "($VALUE : domain.LimitOrderSize)"
                                  - pattern: "($VALUE : *domain.LimitOrderSize)"
                                  - pattern: "($VALUE : domain.LimitSpotFundsPnlBounds)"
                                  - pattern: "($VALUE : *domain.LimitSpotFundsPnlBounds)"
                                  - pattern: "($VALUE : node.LimitTarget)"
                                  - pattern: "($VALUE : *node.LimitTarget)"
                                  - pattern: "($VALUE : LimitTarget)"
                                  - pattern: "($VALUE : *LimitTarget)"
                                  - pattern: "($VALUE : LimitRate)"
                                  - pattern: "($VALUE : *LimitRate)"
                                  - pattern: "($VALUE : LimitPosition)"
                                  - pattern: "($VALUE : *LimitPosition)"
                                  - pattern: "($VALUE : LimitOrderSize)"
                                  - pattern: "($VALUE : *LimitOrderSize)"
                                  - pattern: "($VALUE : LimitSpotFundsPnlBounds)"
                                  - pattern: "($VALUE : *LimitSpotFundsPnlBounds)"
          - metavariable-pattern:
              metavariable: $A
              patterns:
                - pattern: "$VALUE"
                - metavariable-regex:
                    metavariable: $VALUE
                    regex: "^(?:[a-zA-Z_]\\w*\\.)?(?:Scope|Account|AccountID|AccountGroup|Asset|Mode|Axis|scope|account|accountID|accountGroup|account_group|asset|mode|axis|group)(?:\\(.*\\)|\\.String\\(\\))?$"
                - pattern-not-inside: "$VALUE.$FIELD"
          - metavariable-pattern:
              metavariable: $B
              patterns:
                - pattern: "$VALUE"
                - metavariable-regex:
                    metavariable: $VALUE
                    regex: "^(?:[a-zA-Z_]\\w*\\.)?(?:Scope|Account|AccountID|AccountGroup|Asset|Mode|Axis|scope|account|accountID|accountGroup|account_group|asset|mode|axis|group)(?:\\(.*\\)|\\.String\\(\\))?$"
                - pattern-not-inside: "$VALUE.$FIELD"
      - patterns:
          - pattern-either:
              - pattern: "<... $OWNER.$F1 ...> + ... + <... $OWNER.$F2 ...>"
              - patterns:
                  - pattern: "fmt.Sprintf($FORMAT, ..., <... $OWNER.$F1 ...>, ..., <... $OWNER.$F2 ...>, ...)"
                  - metavariable-regex:
                      metavariable: $FORMAT
                      regex: "^\\S+$"
              - pattern: "strings.Join([]string{..., <... $OWNER.$F1 ...>, ..., <... $OWNER.$F2 ...>, ...}, ...)"
              - pattern: "$MAP[$CALL(..., <... $OWNER.$F1 ...>, ..., <... $OWNER.$F2 ...>, ...)]"
          - metavariable-regex:
              metavariable: $F1
              regex: "^(Scope|Account|AccountID|AccountGroup|Asset|Mode|Axis|scope|account|accountID|accountGroup|account_group|asset|mode|axis|group)$"
          - metavariable-regex:
              metavariable: $F2
              regex: "^(Scope|Account|AccountID|AccountGroup|Asset|Mode|Axis|scope|account|accountID|accountGroup|account_group|asset|mode|axis|group)$"
          - metavariable-comparison:
              comparison: "str($F1) != str($F2)"
          - pattern-inside: "for $I, $OWNER := range $LIST { ... }"
          - metavariable-pattern:
              metavariable: $LIST
              pattern-either:
                - pattern: "($VALUE : []domain.LimitRate)"
                - pattern: "($VALUE : []LimitRate)"
                - pattern: "($VALUE : []domain.LimitPosition)"
                - pattern: "($VALUE : []LimitPosition)"
                - pattern: "($VALUE : []domain.LimitOrderSize)"
                - pattern: "($VALUE : []LimitOrderSize)"
                - pattern: "($VALUE : []domain.LimitSpotFundsPnlBounds)"
                - pattern: "($VALUE : []LimitSpotFundsPnlBounds)"
                - pattern: "($VALUE : []node.LimitTarget)"
                - pattern: "($VALUE : []*domain.LimitRate)"
                - pattern: "($VALUE : []*domain.LimitPosition)"
                - pattern: "($VALUE : []*domain.LimitOrderSize)"
                - pattern: "($VALUE : []*domain.LimitSpotFundsPnlBounds)"
                - pattern: "($VALUE : []LimitTarget)"
                - pattern: "($VALUE : []*node.LimitTarget)"
                - pattern: "($VALUE : []*LimitRate)"
                - pattern: "($VALUE : []*LimitPosition)"
                - pattern: "($VALUE : []*LimitOrderSize)"
                - pattern: "($VALUE : []*LimitSpotFundsPnlBounds)"
                - pattern: "($VALUE : []*LimitTarget)"

  - id: limit-key-axis-compare
    message: Compare complete domain.LimitKey values from Key or domain.NewLimitKey.
    severity: ERROR
    languages: [go]
    pattern-either:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: "... && <... $OWNER.$F1 ...> == <... $OTHER.$F1 ...> && ... && <... $OWNER.$F2 ...> == <... $OTHER.$F2 ...> && ..."
                      - pattern: "... || <... $OWNER.$F1 ...> != <... $OTHER.$F1 ...> || ... || <... $OWNER.$F2 ...> != <... $OTHER.$F2 ...> || ..."
                  - metavariable-comparison:
                      comparison: "re.match(\"^(Scope|Axis)$\", str($F1)) or re.match(\"^(Scope|Axis)$\", str($F2))"
              - patterns:
                  - pattern-either:
                      - pattern: "... && <... $OWNER.$F1 ...> == <... $OTHER.$F1 ...> && ... && <... $OWNER.$F2 ...> == <... $OTHER.$F2 ...> && ..."
                      - pattern: "... || <... $OWNER.$F1 ...> != <... $OTHER.$F1 ...> || ... || <... $OWNER.$F2 ...> != <... $OTHER.$F2 ...> || ..."
                  - metavariable-pattern:
                      metavariable: $OWNER
                      pattern-either:
                        - pattern: "($VALUE : domain.LimitRate)"
                        - pattern: "($VALUE : *domain.LimitRate)"
                        - pattern: "($VALUE : domain.LimitPosition)"
                        - pattern: "($VALUE : *domain.LimitPosition)"
                        - pattern: "($VALUE : domain.LimitOrderSize)"
                        - pattern: "($VALUE : *domain.LimitOrderSize)"
                        - pattern: "($VALUE : domain.LimitSpotFundsPnlBounds)"
                        - pattern: "($VALUE : *domain.LimitSpotFundsPnlBounds)"
                        - pattern: "($VALUE : node.LimitTarget)"
                        - pattern: "($VALUE : *node.LimitTarget)"
                        - pattern: "($VALUE : LimitTarget)"
                        - pattern: "($VALUE : *LimitTarget)"
                        - pattern: "($VALUE : LimitRate)"
                        - pattern: "($VALUE : *LimitRate)"
                        - pattern: "($VALUE : LimitPosition)"
                        - pattern: "($VALUE : *LimitPosition)"
                        - pattern: "($VALUE : LimitOrderSize)"
                        - pattern: "($VALUE : *LimitOrderSize)"
                        - pattern: "($VALUE : LimitSpotFundsPnlBounds)"
                        - pattern: "($VALUE : *LimitSpotFundsPnlBounds)"
              - patterns:
                  - pattern-either:
                      - pattern: "... && <... $OWNER.$F1 ...> == <... $OTHER.$F1 ...> && ... && <... $OWNER.$F2 ...> == <... $OTHER.$F2 ...> && ..."
                      - pattern: "... || <... $OWNER.$F1 ...> != <... $OTHER.$F1 ...> || ... || <... $OWNER.$F2 ...> != <... $OTHER.$F2 ...> || ..."
                  - metavariable-pattern:
                      metavariable: $OTHER
                      pattern-either:
                        - pattern: "($VALUE : domain.LimitRate)"
                        - pattern: "($VALUE : *domain.LimitRate)"
                        - pattern: "($VALUE : domain.LimitPosition)"
                        - pattern: "($VALUE : *domain.LimitPosition)"
                        - pattern: "($VALUE : domain.LimitOrderSize)"
                        - pattern: "($VALUE : *domain.LimitOrderSize)"
                        - pattern: "($VALUE : domain.LimitSpotFundsPnlBounds)"
                        - pattern: "($VALUE : *domain.LimitSpotFundsPnlBounds)"
                        - pattern: "($VALUE : node.LimitTarget)"
                        - pattern: "($VALUE : *node.LimitTarget)"
                        - pattern: "($VALUE : LimitTarget)"
                        - pattern: "($VALUE : *LimitTarget)"
                        - pattern: "($VALUE : LimitRate)"
                        - pattern: "($VALUE : *LimitRate)"
                        - pattern: "($VALUE : LimitPosition)"
                        - pattern: "($VALUE : *LimitPosition)"
                        - pattern: "($VALUE : LimitOrderSize)"
                        - pattern: "($VALUE : *LimitOrderSize)"
                        - pattern: "($VALUE : LimitSpotFundsPnlBounds)"
                        - pattern: "($VALUE : *LimitSpotFundsPnlBounds)"
              - patterns:
                  - pattern-either:
                      - pattern: "... && <... $OWNER.$F1 ...> == <... $OTHER.$F1 ...> && ... && <... $OWNER.$F2 ...> == <... $OTHER.$F2 ...> && ..."
                      - pattern: "... || <... $OWNER.$F1 ...> != <... $OTHER.$F1 ...> || ... || <... $OWNER.$F2 ...> != <... $OTHER.$F2 ...> || ..."
                  - pattern-either:
                      - patterns:
                          - pattern-inside: "for $I, $OWNER := range $LIST { ... }"
                      - patterns:
                          - pattern-inside: "for $I, $OTHER := range $LIST { ... }"
                  - metavariable-pattern:
                      metavariable: $LIST
                      pattern-either:
                        - pattern: "($VALUE : []domain.LimitRate)"
                        - pattern: "($VALUE : []LimitRate)"
                        - pattern: "($VALUE : []domain.LimitPosition)"
                        - pattern: "($VALUE : []LimitPosition)"
                        - pattern: "($VALUE : []domain.LimitOrderSize)"
                        - pattern: "($VALUE : []LimitOrderSize)"
                        - pattern: "($VALUE : []domain.LimitSpotFundsPnlBounds)"
                        - pattern: "($VALUE : []LimitSpotFundsPnlBounds)"
                        - pattern: "($VALUE : []node.LimitTarget)"
                        - pattern: "($VALUE : []*domain.LimitRate)"
                        - pattern: "($VALUE : []*domain.LimitPosition)"
                        - pattern: "($VALUE : []*domain.LimitOrderSize)"
                        - pattern: "($VALUE : []*domain.LimitSpotFundsPnlBounds)"
                        - pattern: "($VALUE : []LimitTarget)"
                        - pattern: "($VALUE : []*node.LimitTarget)"
                        - pattern: "($VALUE : []*LimitRate)"
                        - pattern: "($VALUE : []*LimitPosition)"
                        - pattern: "($VALUE : []*LimitOrderSize)"
                        - pattern: "($VALUE : []*LimitSpotFundsPnlBounds)"
                        - pattern: "($VALUE : []*LimitTarget)"
          - metavariable-regex:
              metavariable: $F1
              regex: "^(Scope|Account|AccountGroup|Asset|Mode|Axis)$"
          - metavariable-regex:
              metavariable: $F2
              regex: "^(Scope|Account|AccountGroup|Asset|Mode|Axis)$"
          - metavariable-comparison:
              comparison: "str($F1) != str($F2)"
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: "... && <... $OWNER.$F1 ...> == $S1 && ... && <... $OWNER.$F2 ...> == $S2 && ..."
                      - pattern: "... || <... $OWNER.$F1 ...> != $S1 || ... || <... $OWNER.$F2 ...> != $S2 || ..."
                  - metavariable-comparison:
                      comparison: "re.match(\"^(Scope|Axis)$\", str($F1)) or re.match(\"^(Scope|Axis)$\", str($F2))"
              - patterns:
                  - pattern-either:
                      - pattern: "... && <... $OWNER.$F1 ...> == $S1 && ... && <... $OWNER.$F2 ...> == $S2 && ..."
                      - pattern: "... || <... $OWNER.$F1 ...> != $S1 || ... || <... $OWNER.$F2 ...> != $S2 || ..."
                  - metavariable-pattern:
                      metavariable: $OWNER
                      pattern-either:
                        - pattern: "($VALUE : domain.LimitRate)"
                        - pattern: "($VALUE : *domain.LimitRate)"
                        - pattern: "($VALUE : domain.LimitPosition)"
                        - pattern: "($VALUE : *domain.LimitPosition)"
                        - pattern: "($VALUE : domain.LimitOrderSize)"
                        - pattern: "($VALUE : *domain.LimitOrderSize)"
                        - pattern: "($VALUE : domain.LimitSpotFundsPnlBounds)"
                        - pattern: "($VALUE : *domain.LimitSpotFundsPnlBounds)"
                        - pattern: "($VALUE : node.LimitTarget)"
                        - pattern: "($VALUE : *node.LimitTarget)"
                        - pattern: "($VALUE : LimitTarget)"
                        - pattern: "($VALUE : *LimitTarget)"
                        - pattern: "($VALUE : LimitRate)"
                        - pattern: "($VALUE : *LimitRate)"
                        - pattern: "($VALUE : LimitPosition)"
                        - pattern: "($VALUE : *LimitPosition)"
                        - pattern: "($VALUE : LimitOrderSize)"
                        - pattern: "($VALUE : *LimitOrderSize)"
                        - pattern: "($VALUE : LimitSpotFundsPnlBounds)"
                        - pattern: "($VALUE : *LimitSpotFundsPnlBounds)"
              - patterns:
                  - pattern-either:
                      - pattern: "... && <... $OWNER.$F1 ...> == $S1 && ... && <... $OWNER.$F2 ...> == $S2 && ..."
                      - pattern: "... || <... $OWNER.$F1 ...> != $S1 || ... || <... $OWNER.$F2 ...> != $S2 || ..."
                  - pattern-inside: "for $I, $OWNER := range $LIST { ... }"
                  - metavariable-pattern:
                      metavariable: $LIST
                      pattern-either:
                        - pattern: "($VALUE : []domain.LimitRate)"
                        - pattern: "($VALUE : []LimitRate)"
                        - pattern: "($VALUE : []domain.LimitPosition)"
                        - pattern: "($VALUE : []LimitPosition)"
                        - pattern: "($VALUE : []domain.LimitOrderSize)"
                        - pattern: "($VALUE : []LimitOrderSize)"
                        - pattern: "($VALUE : []domain.LimitSpotFundsPnlBounds)"
                        - pattern: "($VALUE : []LimitSpotFundsPnlBounds)"
                        - pattern: "($VALUE : []node.LimitTarget)"
                        - pattern: "($VALUE : []*domain.LimitRate)"
                        - pattern: "($VALUE : []*domain.LimitPosition)"
                        - pattern: "($VALUE : []*domain.LimitOrderSize)"
                        - pattern: "($VALUE : []*domain.LimitSpotFundsPnlBounds)"
                        - pattern: "($VALUE : []LimitTarget)"
                        - pattern: "($VALUE : []*node.LimitTarget)"
                        - pattern: "($VALUE : []*LimitRate)"
                        - pattern: "($VALUE : []*LimitPosition)"
                        - pattern: "($VALUE : []*LimitOrderSize)"
                        - pattern: "($VALUE : []*LimitSpotFundsPnlBounds)"
                        - pattern: "($VALUE : []*LimitTarget)"
          - metavariable-regex:
              metavariable: $F1
              regex: "^(Scope|Account|AccountGroup|Asset|Mode|Axis)$"
          - metavariable-regex:
              metavariable: $F2
              regex: "^(Scope|Account|AccountGroup|Asset|Mode|Axis)$"
          - metavariable-comparison:
              comparison: "str($F1) != str($F2)"
          - pattern-either:
              - pattern-inside: "func $FN(..., $S1 $T1, ..., $S2 $T2, ...) $RET { ... }"
              - pattern-inside: "func ($RECEIVER $RT) $FN(..., $S1 $T1, ..., $S2 $T2, ...) $RET { ... }"
              - pattern-inside: "func(..., $S1 $T1, ..., $S2 $T2, ...) $RET { ... }"
              - pattern-inside: "func $FN(..., $S1 $T1, ..., $S2 $T2, ...) { ... }"
              - pattern-inside: "func ($RECEIVER $RT) $FN(..., $S1 $T1, ..., $S2 $T2, ...) { ... }"
              - pattern-inside: "func(..., $S1 $T1, ..., $S2 $T2, ...) { ... }"
              - pattern-inside: "func $FN(..., $S2 $T2, ..., $S1 $T1, ...) $RET { ... }"
              - pattern-inside: "func ($RECEIVER $RT) $FN(..., $S2 $T2, ..., $S1 $T1, ...) $RET { ... }"
              - pattern-inside: "func(..., $S2 $T2, ..., $S1 $T1, ...) $RET { ... }"
              - pattern-inside: "func $FN(..., $S2 $T2, ..., $S1 $T1, ...) { ... }"
              - pattern-inside: "func ($RECEIVER $RT) $FN(..., $S2 $T2, ..., $S1 $T1, ...) { ... }"
              - pattern-inside: "func(..., $S2 $T2, ..., $S1 $T1, ...) { ... }"
      - patterns:
          - pattern: "$EXPR"
          - metavariable-pattern:
              metavariable: $EXPR
              pattern-either:
                - pattern: "$A && $B"
                - pattern: "$A || $B"
