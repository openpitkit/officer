# Source and documentation use words rather than emoji so they remain
# searchable and render consistently.

rules:
  - id: no-emoji-in-source
    message: >-
      Emoji do not belong in source or documentation: they are not searchable,
      render unpredictably, and carry no meaning a word cannot.
    severity: ERROR
    languages: [generic]
    pattern-regex: '[\x{1F300}-\x{1FAFF}\x{2700}-\x{27BF}]'
    paths:
      exclude:
        - /web/node_modules
        - /web/dist
        - /web/lib
        - .venv
        - .ruff_cache
        - __pycache__
        - .tmp
        - .wt
        - .serena
        - .git
