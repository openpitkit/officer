# Bind the nil-checked receiver or field to the method, not a request parameter.
# Constructor parameters have no syntactic dependency/input distinction and
# remain with review, as do aliases of receiver fields.
rules:
  - id: nil-dependency-invalid-input
    message: >-
      A missing service receiver or dependency is an internal wiring failure. Internal
      failures must not wrap domain.ErrInvalid; drop the wrap or use
      domain.Internal.
    severity: ERROR
    languages: [go]
    patterns:
      - pattern-not-inside: domain.Internal(...)
      - pattern-inside: |
          func ($RECV *$TYPE) $METHOD(...) $RET { ... }
      - pattern-inside: |
          if $COND { ... }
      - metavariable-pattern:
          metavariable: $COND
          pattern-either:
            - pattern: $RECV == nil
            - pattern: nil == $RECV
            - pattern: $RECV.$FIELD == nil
            - pattern: nil == $RECV.$FIELD
      - pattern-either:
          - pattern: errors.Join(..., domain.ErrInvalid, ...)
          - pattern: fmt.Errorf(..., domain.ErrInvalid, ...)
          - pattern: return domain.ErrInvalid
          - pattern: return ..., domain.ErrInvalid
    paths:
      include:
        - "**/*.go"
      exclude:
        - "**/*_test.go"
        - "/checks/semgrep/testdata/**"
