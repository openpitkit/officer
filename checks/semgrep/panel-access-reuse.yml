# Panel access forms and decoders share these implementations. Keep the
# copies from returning beside their shared homes.
rules:
  - id: shared-panel-error-response
    message: Reuse errorResponse from test/apiClient for error envelopes with headers.
    severity: ERROR
    languages: [typescript]
    patterns:
      - pattern: |
          const $RES = jsonResponse({ error: { code: $CODE, message: $MESSAGE } }, $STATUS);
          ...
          for (const [$NAME, $VALUE] of Object.entries($HEADERS)) {
            $RES.headers.set($NAME, $VALUE);
          }
    paths:
      include: ["/web/src/**"]
      exclude:
        - "/web/src/test/apiClient.tsx"
        - "/checks/semgrep/testdata/**"

  - id: shared-panel-rfc3339
    message: Reuse isRfc3339Time from framework/api/rfc3339 for strict timestamp decoding.
    severity: ERROR
    languages: [typescript]
    pattern: |
      $DATE.getUTCFullYear() === Number($FIELDS.year) &&
      $DATE.getUTCMonth() + 1 === Number($FIELDS.month) &&
      $DATE.getUTCDate() === Number($FIELDS.day) &&
      $DATE.getUTCHours() === Number($FIELDS.hour) &&
      $DATE.getUTCMinutes() === Number($FIELDS.minute) &&
      $DATE.getUTCSeconds() === Number($FIELDS.second)
    paths:
      include: ["/web/src/**"]
      exclude:
        - "/web/src/framework/api/rfc3339.ts"
        - "/checks/semgrep/testdata/**"

  - id: shared-panel-password-pair
    message: Use PasswordPairFields for new passwords; keep validation timing in the form.
    severity: ERROR
    languages: [typescript]
    pattern-either:
      - pattern: <TextField ... autoComplete="new-password" ... />
      - pattern: <SecretInput ... autoComplete="new-password" ... />
    paths:
      include: ["/web/src/**"]
      exclude:
        - "/web/src/components/PasswordPairFields.tsx"
        - "/checks/semgrep/testdata/**"

  - id: shared-panel-reveal-button
    message: Reuse RevealButton for Show/Hide controls on secrets.
    severity: ERROR
    languages: [typescript]
    pattern: |
      $SHOWN ? $T("actions.hide") : $T("actions.show")
    paths:
      include: ["/web/src/**"]
      exclude:
        - "/web/src/components/RevealButton.tsx"
        - "/checks/semgrep/testdata/**"
