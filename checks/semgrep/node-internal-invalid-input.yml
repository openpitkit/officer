# Post-commit scope helpers and fatal reconciliation report internal failures.
# Local error construction is followed when passed to fatalReconciliation.
rules:
  - id: node-internal-invalid-input
    message: >-
      A post-commit or fatal-reconciliation failure is internal. Internal
      failures must not wrap domain.ErrInvalid; drop the wrap or use
      domain.Internal.
    severity: ERROR
    languages: [go]
    patterns:
      - pattern-not-inside: domain.Internal(...)
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      func $FUNC(...) $RET { ... }
                  - pattern-inside: |
                      func ($RECV $TYPE) $FUNC(...) $RET { ... }
              - metavariable-regex:
                  metavariable: $FUNC
                  regex: '^(?:PostCommitNotifications|requirePostCommitScope|deferPostCommit|detachPostCommit)$'
              - pattern-either:
                  - pattern: errors.Join(..., domain.ErrInvalid, ...)
                  - pattern: fmt.Errorf(..., domain.ErrInvalid, ...)
                  - pattern: return domain.ErrInvalid
                  - pattern: return ..., domain.ErrInvalid
          - patterns:
              - pattern: domain.ErrInvalid
              - pattern-inside: $NODE.fatalReconciliation(..., <... domain.ErrInvalid ...>, ...)
          - patterns:
              - pattern-either:
                  - pattern: $ERR := errors.Join(..., domain.ErrInvalid, ...)
                  - pattern: $ERR = errors.Join(..., domain.ErrInvalid, ...)
                  - pattern: $ERR := fmt.Errorf(..., domain.ErrInvalid, ...)
                  - pattern: $ERR = fmt.Errorf(..., domain.ErrInvalid, ...)
              - pattern-inside: |
                  ...
                  $NODE.fatalReconciliation(..., $ERR, ...)
    paths:
      include:
        - "/framework/node/**"
      exclude:
        - "**/*_test.go"
        - "/checks/semgrep/testdata/**"
