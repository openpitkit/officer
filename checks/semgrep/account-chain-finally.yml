# Require Finally before Run on inline chains, local short declarations
# initialized with asyncengine.Chain, and typed ChainBuilder parameters of
# functions and methods. Exempt a CheckOrder chain run inline or run directly
# from its local declaration with no write step called on it before Run.
# Known misses include reassignments, extra aliases, steps added in another
# function, and builders returned by helpers, read from struct fields, or
# received as a function-literal parameter. For
# split CheckOrder chains, a step in an else, for, switch, or closure body
# escapes detection. The rule checks the same block and the then-branch of one
# enclosing if. A Finally that ignores its outcome or fails to escalate a
# post-commit failure passes the check.
# This rule has no approval marker or baseline.
rules:
  - id: account-chain-finally
    message: End the account chain with Finally before calling Run.
    severity: ERROR
    languages: [go]
    patterns:
      - pattern-not: $RECEIVER.Finally(...).Run(...)
      - pattern-either:
          - patterns:
              - pattern: asyncengine.Chain(...). ... .Run(...)
              - pattern-not: asyncengine.Chain(...).CheckOrder(...).Run(...)
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $BUILDER := asyncengine.Chain(...)
                      ...
                  - pattern-inside: |
                      $BUILDER := asyncengine.Chain(...). ... .$TAIL(...)
                      ...
                  - patterns:
                      - pattern-inside: |
                          func $FUNC(..., $BUILDER $TYPE, ...) { ... }
                      - metavariable-regex:
                          metavariable: $TYPE
                          regex: '^\*asyncengine\.ChainBuilder\['
              - pattern-not-inside: |
                  $BUILDER := asyncengine.Chain(...). ... .Finally(...)
                  ...
              - pattern-either:
                  - pattern: $BUILDER. ... .$STEP(...).Run(...)
                  - patterns:
                      - pattern: $BUILDER.Run(...)
                      - pattern-not-inside: |
                          $BUILDER := asyncengine.Chain(...).CheckOrder(...)
                          ...
                  - patterns:
                      - pattern: $RUNNER.Run(...)
                      - pattern-either:
                          - pattern-inside: |
                              $RUNNER := $BUILDER
                              ...
                          - pattern-inside: |
                              $RUNNER := $BUILDER. ... .$STEP(...)
                              ...
                      - pattern-not-inside: |
                          $RUNNER := $RECEIVER.Finally(...)
                          ...
          - patterns:
              - pattern: $BUILDER.Run(...)
              - pattern-inside: |
                  $BUILDER := asyncengine.Chain(...).CheckOrder(...)
                  ...
              - pattern-either:
                  - pattern-inside: |
                      $BUILDER.$STEP(...)
                      ...
                  - pattern-inside: |
                      if $COND {
                        ...
                        $BUILDER.$STEP(...)
                        ...
                      }
                      ...
              - metavariable-regex:
                  metavariable: $STEP
                  regex: '^(?!(Run|CheckOrder|Finally)$)'
    paths:
      include:
        - "/framework/**"
      exclude:
        - "**/*_test.go"
        - "/checks/semgrep/testdata/**"
