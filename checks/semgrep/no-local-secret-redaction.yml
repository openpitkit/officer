# Literal-only loops miss escaped or overlapping credential values.
# Match redaction helpers that replace values with a secret marker in Go
# tests. Ordinary text replacement is outside this rule.

rules:
  - id: no-local-secret-redaction
    message: >-
      Reuse framework/secret.CredentialRedactor instead of replacing raw
      secrets locally in test diagnostics.
    severity: ERROR
    languages: [go]
    patterns:
      - pattern-inside: |
          func $REDACT(...) string {
            ...
          }
      - metavariable-regex:
          metavariable: $REDACT
          regex: '(?i).*(redact|scrub).*'
      - pattern-either:
          - pattern: strings.ReplaceAll($TEXT, $VALUE, "[secret]")
          - pattern: strings.ReplaceAll($TEXT, $VALUE, "[redacted]")
    paths:
      include:
        - "**/*_test.go"
      exclude:
        - "/checks/semgrep/testdata/**"
