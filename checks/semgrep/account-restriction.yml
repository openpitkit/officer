# Typed metavariables cover local values and parameters. Semgrep CE cannot
# infer fields whose struct is declared in another file, so Restriction.Account
# is also matched structurally. Restriction is the list-filter field convention.
rules:
  - id: account-restriction-must-use-restricted
    message: >-
      Account alone does not establish whether account visibility is restricted.
      Use Restricted() and apply the complete restriction before totals and pages.
    severity: ERROR
    languages: [go]
    patterns:
      - pattern-either:
          - pattern: '$R.Account == ""'
          - pattern: '$R.Account != ""'
          - pattern: '"" == $R.Account'
          - pattern: '"" != $R.Account'
      - metavariable-pattern:
          metavariable: $R
          pattern-either:
            - pattern: '($VALUE : domain.AccountRestriction)'
            - pattern: '($VALUE : *domain.AccountRestriction)'
            - pattern: '($VALUE : AccountRestriction)'
            - pattern: '$FILTER.Restriction'
      - pattern-not-inside: |
          func ($R AccountRestriction) Restricted() bool { ... }
    paths:
      exclude:
        - /internal/store/sqlite/list.go
        - /checks/semgrep/testdata/**
