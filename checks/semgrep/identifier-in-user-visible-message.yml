# Operator-facing reject, block, and administration messages keep account and
# group identifiers in structural fields rather than rendered text.

rules:
  - id: identifier-in-user-visible-message
    message: >-
      An account or group identifier is interpolated into a user-visible
      message. Keep identifiers in structural fields; the rendered reason must
      describe what happened, not to whom.
    severity: ERROR
    languages: [go]
    patterns:
      - pattern-either:
          - pattern: fmt.Errorf($FORMAT, ..., $IDENTIFIER, ...)
          - pattern: fmt.Sprintf($FORMAT, ..., $IDENTIFIER, ...)
      - metavariable-regex:
          metavariable: $IDENTIFIER
          regex: (?i)^(account_?id|group_?id)$
    paths:
      # No include list: the formatting calls named in the pattern are what
      # scopes this rule, not a file extension. Tests are deliberately in
      # scope - a message asserted in a test is the message an operator sees.
      exclude:
        - /web/node_modules
        - /web/dist
        - /web/lib
        - .venv
        - .ruff_cache
        - __pycache__
        - .tmp
        - .git
