# A bare return from a worker that has already delivered the error through a
# channel, or from a goroutine stopping on context cancellation, does not drop
# an error. Match only error-returning functions that explicitly turn a caught
# error into nil.

rules:
  - id: error-dropped-on-return
    message: >-
      The error is checked and then dropped: the caller cannot distinguish
      failure from an empty result. Return the error, wrapped with context.
    severity: ERROR
    languages: [go]
    patterns:
      - pattern: |
          if $ERR != nil {
            return nil
          }
      - pattern-inside: |
          func $FUNC(...) error {
            ...
          }
    paths:
      exclude:
        - "**/*_test.go"
