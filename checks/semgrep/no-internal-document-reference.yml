# This public repository uses self-contained documentation. References to
# unpublished internal material disclose information that readers cannot
# inspect, so the relevant contract belongs in this repository instead.

rules:
  - id: no-internal-document-reference
    message: >-
      Public source and documentation must not reference unpublished internal
      material. Such a reference discloses information readers cannot inspect.
      State the relevant contract in this repository instead.
    severity: ERROR
    languages: [generic]
    pattern-regex: 'doc[/]design'
    paths:
      exclude:
        - /web/node_modules
        - /web/dist
        - /web/lib
        - .venv
        - .ruff_cache
        - __pycache__
        - .tmp
        - .git
