# Interactive Brokers deprecated the GitHub Pages copy of the TWS API docs.
# Links go to the current docs under www.interactivebrokers.com/docs/tws-api/.

rules:
  - id: no-deprecated-ib-api-docs
    message: >-
      Link to the current page under
      https://www.interactivebrokers.com/docs/tws-api/ instead.
    severity: ERROR
    languages: [generic]
    pattern-regex: '(?i)interactivebrokers\.github\.io/tws-api'
    paths:
      exclude:
        - /web/node_modules
        - /web/dist
        - /web/lib
        - .venv
        - .ruff_cache
        - __pycache__
        - .tmp
        - .git
