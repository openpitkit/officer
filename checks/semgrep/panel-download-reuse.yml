# Browser downloads share one implementation. Keep the copies from returning
# beside it.
rules:
  - id: shared-panel-download
    message: Reuse downloadBlob from lib/download for browser downloads.
    severity: ERROR
    languages: [typescript]
    pattern-either:
      - pattern: |
          const $A = document.createElement("a");
          ...
          $A.download = $NAME;
      - pattern: |
          let $A = document.createElement("a");
          ...
          $A.download = $NAME;
      - pattern: |
          var $A = document.createElement("a");
          ...
          $A.download = $NAME;
    paths:
      include: ["/web/src/**"]
      exclude:
        - "/web/src/lib/download.ts"
        - "/checks/semgrep/testdata/**"
