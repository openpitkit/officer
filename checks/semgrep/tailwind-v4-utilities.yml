rules:
  - id: tailwind-v4-utilities
    message: Use flex-column gap spacing and outline-hidden to retain Tailwind v3 layout and focus behavior.
    severity: ERROR
    languages: [generic]
    pattern-regex: '(?<![\w-])(?:space-y-(?:[0-9.]+|\[[^\]\r\n]+\])|outline-none)(?![\w-])'
    paths:
      include: ["/web/src/**"]
      exclude: ["/checks/semgrep/testdata/**"]

