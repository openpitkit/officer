# Paths are written relative to the repository or to a documented location.
# An absolute path into one contributor's home directory resolves on no other
# machine and discloses that machine's layout.

rules:
  - id: no-machine-local-path
    message: >-
      An absolute path into a user's home directory does not belong in the
      repository. It resolves on no other machine and discloses the local
      environment. Use a path relative to the repository or a documented
      location.
    severity: ERROR
    languages: [generic]
    pattern-regex: '/Users/[A-Za-z0-9._-]+/|/home/[A-Za-z0-9._-]+/|\b[A-Za-z]:\\Users\\'
    paths:
      exclude:
        - /web/node_modules
        - /web/dist
        - /web/lib
        - .venv
        - .ruff_cache
        - __pycache__
        - .tmp
        - .git
