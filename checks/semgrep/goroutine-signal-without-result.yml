# A goroutine may return before reaching the signal or state a test awaits.
# Read its result during the wait, so an early failure is reported instead of
# hanging until the package timeout. Polling covers direct sleep loops and
# polltest.Until calls; waits hidden behind other helpers require review.

rules:
  - id: goroutine-signal-without-result
    message: >-
      While awaiting a signal or state, check the goroutine's result in a select,
      and fail with that result if it returns before the awaited signal or state.
      Keep checking the actual result after the signal path.
    severity: ERROR
    languages: [go]
    options:
      go_deeper_stmt: false
    pattern-either:
      - patterns:
          - pattern: |
              go func() {
                ...
                $R <- $V
                ...
              }()
              ...
              $WAIT
          # A receive nested in another goroutine or an if initializer is not
          # the subsequent signal-wait statement. Keep the outer statement shape.
          - metavariable-regex:
              metavariable: $WAIT
              regex: '^(?:<-|[A-Za-z_][\w.]*(?:\s*,\s*[A-Za-z_][\w.]*)?\s*(?::=|=)\s*<-|for\b|select\b)'
          - metavariable-pattern:
              metavariable: $WAIT
              pattern-either:
              - patterns:
                  - pattern: <-$S
                  - metavariable-comparison:
                      metavariable: $S
                      comparison: str($S) != str($R)
                  - pattern-not-inside: |
                      select {
                      case <-$R:
                        ...
                      }
                  - pattern-not-inside: |
                      select {
                      case $X := <-$R:
                        ...
                      }
                  - pattern-not-inside: |
                      select {
                      case $X = <-$R:
                        ...
                      }
                  - pattern-not-inside: |
                      select {
                      case $X, $OK := <-$R:
                        ...
                      }
                  - pattern-not-inside: |
                      select {
                      case $X, $OK = <-$R:
                        ...
                      }
                  - pattern-not-inside: |
                      select {
                      default:
                        ...
                      }
                  # A bounded observation window proves absence, not liveness.
                  - pattern-not-inside: |
                      select {
                      case <-time.After(...):
                        ...
                      }
              - patterns:
                  - pattern: |
                      for $COND {
                        ...
                        time.Sleep(...)
                        ...
                      }
                  - pattern-not: |
                      for $COND {
                        ...
                        select {
                        case $ERR := <-$R:
                          ...
                        }
                        ...
                      }
          - focus-metavariable: $WAIT
      - patterns:
          - pattern-either:
              - pattern: |
                  go func() {
                    ...
                    $R <- $V
                    ...
                  }()
                  ...
                  for range $S {
                    ...
                  }
              - pattern: |
                  go func() {
                    ...
                    $R <- $V
                    ...
                  }()
                  ...
                  for $X := range $S {
                    ...
                  }
          # Integer and collection ranges do not block on a signal.
          - pattern: '($S : $CHANNEL)'
          - metavariable-regex:
              metavariable: $CHANNEL
              regex: '^(?:<-\s*)?chan\b'
          - metavariable-comparison:
              metavariable: $S
              comparison: str($S) != str($R)
          - focus-metavariable: $S
      - patterns:
          - pattern: |
              go func() {
                ...
                $R <- $V
                ...
              }()
              ...
              $WAIT
          - metavariable-pattern:
              metavariable: $WAIT
              patterns:
                - pattern: polltest.Until(...)
                - pattern-not-inside: |
                    go func(...) {
                      ...
                    }(...)
                - pattern-not: |
                    polltest.Until(func() bool {
                      ...
                      select {
                      case <-$R:
                        ...
                      }
                      ...
                    })
                - pattern-not: |
                    polltest.Until(func() bool {
                      ...
                      select {
                      case $X := <-$R:
                        ...
                      }
                      ...
                    })
                - pattern-not: |
                    polltest.Until(func() bool {
                      ...
                      select {
                      case $X = <-$R:
                        ...
                      }
                      ...
                    })
                - pattern-not: |
                    polltest.Until(func() bool {
                      ...
                      select {
                      case $X, $OK := <-$R:
                        ...
                      }
                      ...
                    })
                - pattern-not: |
                    polltest.Until(func() bool {
                      ...
                      select {
                      case $X, $OK = <-$R:
                        ...
                      }
                      ...
                    })
          - focus-metavariable: $WAIT
    paths:
      include:
        - "/internal/integration/**/*_test.go"
        - "/internal/store/sqlite/**/*_test.go"
        - "/internal/trading/*e2e_test.go"
