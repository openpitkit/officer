rules:
  - id: store-transaction-helper
    message: >-
      Open store transactions through beginTx to classify context cancellation,
      and pass the transaction context to rollbackTransaction.
    severity: ERROR
    languages: [go]
    patterns:
      - pattern: $X.BeginTx
      - pattern-not-inside: |
          func beginTx(ctx context.Context, db *sql.DB, opts *sql.TxOptions) (*sql.Tx, error) {
            ...
          }
    paths:
      include:
        - "/internal/store/sqlite/**"
      exclude:
        - "**/*_test.go"
        - "/checks/semgrep/testdata/**"
