name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (build / vet / test, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out officer (primary)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Load CI versions
        run: python scripts/just_helpers.py export-ci-env

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.CI_GO }}
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v${{ env.CI_GOLANGCI_LINT }}

      - name: Setup just
        uses: extractions/setup-just@v3

      - name: Check Go
        run: just --justfile pipeline.just ci-go

  frontend:
    name: JS/TypeScript checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out officer
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Load CI versions
        run: python scripts/just_helpers.py export-ci-env

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.CI_NODE }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Setup just
        uses: extractions/setup-just@v3

      - name: Check JS/TypeScript
        run: just --justfile pipeline.just ci-js

  docker:
    name: Docker build (serve mode)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out officer
        uses: actions/checkout@v4

      - name: Setup just
        uses: extractions/setup-just@v3

      - name: Docker build
        run: just --justfile pipeline.just docker-build pit-officer:ci
