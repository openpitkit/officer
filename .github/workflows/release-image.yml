# Publishes the `serve` image to GHCR after CI on `main` (the edge channel),
# from version tags (the stable channel and pre-releases), and from a dry-run
# dispatch on the `release-dry-run` branch.

name: Release image

on:
  workflow_call:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Publish a test image under its own dry-run tag instead of a release
        required: false
        type: boolean
        default: true

permissions:
  contents: read

# Runs go one at a time; `queue: max` keeps every pending image publication
# waiting instead of replacing it with the next one.
concurrency:
  group: release-image
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    name: Publish image (ghcr.io/openpitkit/officer)
    runs-on: ubuntu-latest
    # Version tags wait for approval in the protected `release` environment.
    # Main CI and the dry-run dispatch bind no environment.
    environment: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && 'release' || '' }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/openpitkit/officer
      PLATFORMS: linux/amd64,linux/arm64

    steps:
      # This packages:write job pins actions by SHA; ci.yml uses major tags.
      - name: Check out officer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # A dispatched run is always a dry run: it publishes one test image under
      # a tag of its own and never touches X.Y.Z, X.Y, latest or edge.
      - name: Resolve release mode
        id: mode
        shell: bash
        env:
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            push)
              case "$GITHUB_REF" in
                refs/heads/main)
                  echo "release_mode=main" >> "$GITHUB_OUTPUT"
                  ;;
                refs/tags/v*)
                  echo "release_mode=production" >> "$GITHUB_OUTPUT"
                  ;;
                *)
                  echo "::error::image publication requires main or a version tag"
                  exit 1
                  ;;
              esac
              ;;
            workflow_dispatch)
              if [[ "$GITHUB_REF" != refs/heads/release-dry-run ]]; then
                echo "::error::a dispatched run is only allowed from branch release-dry-run"
                exit 1
              fi
              if [[ "$DRY_RUN_INPUT" != true ]]; then
                echo "::error::a dispatched run must set dry_run=true"
                exit 1
              fi
              # Unique per attempt: pushing an existing tag again would leave the
              # image it replaced untagged, out of reach of the cleanup below.
              {
                echo "release_mode=dry-run"
                echo "dry_run_tag=dry-run-${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
              } >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::unsupported event $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac

      # Guards against accidentally releasing an off-main commit.
      - name: Require the tagged commit on main
        if: steps.mode.outputs.release_mode == 'production'
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main

      - name: Rank stable version
        if: steps.mode.outputs.release_mode == 'production'
        id: rank
        shell: bash
        run: |
          stable_pattern='^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$'
          latest_tag="$(
            git tag --merged refs/remotes/origin/main |
              awk -v pattern="$stable_pattern" '$0 ~ pattern' |
              sort -V |
              tail -n 1
          )"

          latest=false
          minor=false
          if [[ "$GITHUB_REF_NAME" =~ $stable_pattern ]]; then
            minor_tag="$(
              git tag --merged refs/remotes/origin/main --list "${GITHUB_REF_NAME%.*}.*" |
                awk -v pattern="$stable_pattern" '$0 ~ pattern' |
                sort -V |
                tail -n 1
            )"
            if [[ "$GITHUB_REF_NAME" == "$latest_tag" ]]; then
              latest=true
            fi
            if [[ "$GITHUB_REF_NAME" == "$minor_tag" ]]; then
              minor=true
            fi
          fi

          {
            echo "latest=$latest"
            echo "minor=$minor"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Load CI versions
        run: python scripts/just_helpers.py export-ci-env

      # QEMU runs the non-native platform's stages; the SPA stage is pinned to
      # the build platform in the Dockerfile and is built once.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Main CI publishes edge and sha-<short SHA> of the checked commit.
      # Version tags publish X.Y.Z (or the exact pre-release version), and X.Y
      # and latest only as the rank outputs allow; a dry run gets only its own
      # tag.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ steps.mode.outputs.release_mode == 'production' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.rank.outputs.minor == 'true' }}
            type=raw,value=latest,enable=${{ steps.rank.outputs.latest == 'true' }}
            type=edge,branch=main,enable=${{ steps.mode.outputs.release_mode == 'main' }}
            type=sha,enable=${{ steps.mode.outputs.release_mode == 'main' }}
            type=raw,value=${{ steps.mode.outputs.dry_run_tag }},enable=${{ steps.mode.outputs.release_mode == 'dry-run' }}

      - name: Require only the dry-run tag
        if: steps.mode.outputs.release_mode == 'dry-run'
        shell: bash
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DRY_RUN_TAG: ${{ steps.mode.outputs.dry_run_tag }}
        run: |
          if [[ "$TAGS" != "$IMAGE:$DRY_RUN_TAG" ]]; then
            echo "::error::a dry run publishes only $IMAGE:$DRY_RUN_TAG, metadata produced: $TAGS"
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          build-args: GO_VERSION=${{ env.CI_GO }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # A start-time crash passes every build gate, so the dry run pulls each
      # platform back from the registry and requires serve to become healthy
      # and answer 200 on /healthz.
      - name: Start the dry-run image
        if: steps.mode.outputs.release_mode == 'dry-run'
        shell: bash
        env:
          IMAGE_REF: ${{ env.IMAGE }}:${{ steps.mode.outputs.dry_run_tag }}
        run: |
          docker buildx imagetools inspect "$IMAGE_REF"
          for platform in ${PLATFORMS//,/ }; do
            docker pull --platform "$platform" "$IMAGE_REF"
            python scripts/just_helpers.py docker-start-check "$IMAGE_REF" "$platform"
          done

      # The package keeps one dry-run image: older ones go, each with the
      # platform and attestation manifests it lists, which GHCR keeps as
      # untagged versions of their own. This run's image stays until the next
      # dry run, also because GHCR refuses to delete a package's last tagged
      # version. Release manifests never appear in a dry-run index: the version
      # label differs, so every digest differs.
      - name: Delete older dry-run images
        if: steps.mode.outputs.release_mode == 'dry-run'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN_TAG: ${{ steps.mode.outputs.dry_run_tag }}
        run: |
          package="${IMAGE#ghcr.io/}"
          versions_api="orgs/${package%%/*}/packages/container/${package#*/}/versions"
          versions="$(gh api --paginate "$versions_api" \
            --jq '.[] | {id, digest: .name, tags: .metadata.container.tags}')"

          # Stale: tagged, every tag a dry-run tag, none of them this run's.
          stale="$(jq -r --arg current "$DRY_RUN_TAG" '
            select((.tags | length) > 0
              and all(.tags[]; startswith("dry-run-") and . != $current))
            | .digest' <<<"$versions")"
          if [[ -z "$stale" ]]; then
            echo "no older dry-run images"
          fi

          for index_digest in $stale; do
            # Children first: a run that stops halfway leaves the tagged index,
            # and with it the list of what remains, to the next dry run.
            children="$(docker buildx imagetools inspect --raw "$IMAGE@$index_digest" |
              jq -r '.manifests[]?.digest')"
            for digest in $children "$index_digest"; do
              id="$(jq -r --arg digest "$digest" 'select(.digest == $digest) | .id' <<<"$versions")"
              if [[ -z "$id" ]]; then
                echo "$digest was deleted by an earlier run"
                continue
              fi
              gh api --method DELETE "$versions_api/$id"
              echo "deleted $digest"
            done
          done
