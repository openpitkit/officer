# Publishes the `serve` image from version tags on `main` to GHCR.

name: Release image

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish image (ghcr.io/openpitkit/officer)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # This packages:write job pins actions by SHA; ci.yml uses major tags.
      - name: Check out officer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Guards against accidentally releasing an off-main commit.
      - name: Require the tagged commit on main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main

      - name: Rank stable version
        id: rank
        shell: bash
        run: |
          stable_pattern='^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$'
          latest_tag="$(
            git tag --merged refs/remotes/origin/main |
              awk -v pattern="$stable_pattern" '$0 ~ pattern' |
              sort -V |
              tail -n 1
          )"

          latest=false
          minor=false
          if [[ "$GITHUB_REF_NAME" =~ $stable_pattern ]]; then
            minor_tag="$(
              git tag --merged refs/remotes/origin/main --list "${GITHUB_REF_NAME%.*}.*" |
                awk -v pattern="$stable_pattern" '$0 ~ pattern' |
                sort -V |
                tail -n 1
            )"
            if [[ "$GITHUB_REF_NAME" == "$latest_tag" ]]; then
              latest=true
            fi
            if [[ "$GITHUB_REF_NAME" == "$minor_tag" ]]; then
              minor=true
            fi
          fi

          {
            echo "latest=$latest"
            echo "minor=$minor"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Load CI versions
        run: python scripts/just_helpers.py export-ci-env

      # QEMU runs the non-native platform's stages; the SPA stage is pinned to
      # the build platform in the Dockerfile and is built once.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Stable versions always get X.Y.Z; moving tags follow the rank outputs.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/openpitkit/officer
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.rank.outputs.minor == 'true' }}
            type=raw,value=latest,enable=${{ steps.rank.outputs.latest == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: GO_VERSION=${{ env.CI_GO }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
