# Dependabot updates action SHAs, but does not parse action inputs such as
# setup-qemu's image or setup-buildx's driver-opts. Update those image pins
# manually when reviewing Docker action updates: choose a published version at
# https://github.com/tonistiigi/binfmt/releases or
# https://github.com/moby/buildkit/releases, then run
# docker buildx imagetools inspect <image>:<version>
# and copy the top-level multi-platform Digest and version comment into
# workflows/release-image.yml. Validate with the release dry-run workflow.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
