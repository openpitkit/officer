        required: true
        description: URL-encoded market-data instance identifier.
        schema:
          type: string
    post:
      operationId: searchMarketDataSymbols
      summary: Search provider-side market-data symbols
      tags: [market-data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketDataSymbolSearchRequest"
      responses:
        "200":
          description: Symbol search result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDataSymbolSearch"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "500":
          $ref: "#/components/responses/InternalError"

  /market-data/instances/{id}/instruments:
    parameters:
      - name: id
        in: path
        required: true
        description: URL-encoded market-data instance identifier.
        schema:
          type: string
    put:
      operationId: upsertMarketDataInstrument
      summary: Add or replace one market-data instrument mapping
      tags: [market-data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketDataInstrument"
      responses:
        "200":
          description: Instrument persisted; returns the refreshed market-data snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [marketData]
                properties:
                  marketData:
                    $ref: "#/components/schemas/MarketData"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteMarketDataInstrument
      summary: Delete one market-data instrument mapping
      tags: [market-data]
      parameters:
        - name: externalSymbol
          in: query
          required: true
          description: Provider-side symbol to delete.
          schema:
            type: string
      responses:
        "204":
          description: Instrument deleted.
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /market-data/instances/{id}/instruments/enabled:
    parameters:
      - name: id
        in: path
        required: true
        description: URL-encoded market-data instance identifier.
        schema:
          type: string
    put:
      operationId: setMarketDataInstrumentEnabled
      summary: Enable or disable one market-data instrument mapping
      tags: [market-data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalSymbol, enabled]
              properties:
                externalSymbol:
                  type: string
                  description: Provider-side instrument symbol to toggle.
                enabled:
                  type: boolean
                  description: Whether this instrument mapping is enabled.
      responses:
        "200":
          description: Enabled flag persisted.
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled:
                    type: boolean
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Dashboard / service
  # ---------------------------------------------------------------------------

  /overview:
    get:
      operationId: getOverview
      summary: Dashboard overview - headline counts and recent activity
      tags: [dashboard]
      parameters:
        - name: since
          in: query
          required: false
          description: >-
            RFC3339 boundary for the orders-today tally. When absent or
            unparseable the server uses its local start of day.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
        "500":
          $ref: "#/components/responses/InternalError"

  /service:
    get:
      operationId: getService
      summary: Service identity and build information
      tags: [dashboard]
      responses:
        "200":
          description: Service info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "500":
          $ref: "#/components/responses/InternalError"

  /service/logs:
    get:
      operationId: getServiceLogs
      summary: Recent service log lines
      description: >
        The captured tail of the service's structured log, oldest line first.
        The tail is a bounded in-memory ring buffer, so it holds only the most
        recent lines.
      tags: [dashboard]
      responses:
        "200":
          description: Buffered log tail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceLogs"

  /service/logs/download:
    get:
      operationId: downloadServiceLogs
      summary: Download the full service log buffer
      description: >
        The full captured log buffer as a plain-text attachment, lines joined by
        newlines, oldest line first.
      tags: [dashboard]
      responses:
        "200":
          description: Log buffer as a text attachment.
          headers:
            Content-Disposition:
              description: Attachment with filename pit-officer.log.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string

# =============================================================================
# Components
# =============================================================================

components:

  # ---------------------------------------------------------------------------
  # Parameters
  # ---------------------------------------------------------------------------

  parameters:
    AccountID:
      name: id
      in: path
      required: true
      description: URL-encoded account identifier.
      schema:
        type: string

    GroupID:
      name: id
      in: path
      required: true
      description: URL-encoded group identifier.
      schema:
        type: string

    OrderID:
      name: id
      in: path
      required: true
      description: Integer order identifier.
      schema:
        type: integer
        format: int64

    SourceFilter:
      name: source
      in: query
      description: "Filter by originating surface: `panel`, `api`, `mcp`, or `system`."
      schema:
        type: string
        enum: [panel, api, mcp, system]

    LimitParam:
      name: limit
      in: query
      description: Maximum rows to return (default 100, capped at 1000).
      schema:
        type: integer
        default: 100
        maximum: 1000

  # ---------------------------------------------------------------------------
  # Responses
  # ---------------------------------------------------------------------------

  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFoundError:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ConflictError:
      description: Resource already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    UpstreamError:
      description: Upstream provider request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotImplementedError:
      description: Engine capability not yet available.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    EngineRestartingError:
      description: Engine is being rebuilt; mutating requests are rejected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------

  schemas:

    # Error envelope

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: >
                Machine-readable code: `validation`, `not_found`, `conflict`,
                `terminal_order`, `precondition`, `engine_restarting`,
                `not_implemented`, or `internal`.
              example: not_found
            message:
              type: string
              example: account not found

    # Backup / restore

    BackupSection:
      type: string
      enum:
        - accounts_groups
        - positions
        - risk_limits
        - market_data_settings
        - market_data_quotes
        - general_settings
        - activity_history
        - audit_log

    BackupRestoreMode:
      type: string
      enum: [replace_all, overwrite, insert_missing]

    BackupEntitySelector:
      type: object
      properties:
        all:
          type: boolean
          description: Select every entity in the selector's category.
        accounts:
          type: array
          description: Account identifiers to include.
          items:
            type: string
        groups:
          type: array
          description: Group identifiers to include.
          items:
            type: string

    BackupScope:
      type: object
      properties:
        all:
          type: boolean
          description: Include every section when true.
        sections:
          type: array
          description: Backup sections to include when `all` is false.
          items:
            $ref: "#/components/schemas/BackupSection"
        accounts:
          description: Account and group selector for account-owned data.
          $ref: "#/components/schemas/BackupEntitySelector"
        positions:
          description: Account and group selector for position-related data.
          $ref: "#/components/schemas/BackupEntitySelector"

    BackupArchive:
      type: object
      required: [manifest, data]
      properties:
        manifest:
          description: Archive metadata used to validate and route restore.
          $ref: "#/components/schemas/BackupManifest"
        data:
          description: Serialized backup payload grouped by table family.
          $ref: "#/components/schemas/BackupData"

    BackupManifest:
      type: object
      required: [format, formatVersion, schemaVersion, createdAt, sections]
      properties:
        format:
          type: string
          description: Backup archive format identifier.
          enum: [openpit.officer.backup]
        formatVersion:
          type: integer
          description: Archive format version used by restore migrations.
        schemaVersion:
          type: integer
          description: Source database schema version.
        createdAt:
          type: string
          format: date-time
          description: Time the backup archive was created.
        source:
          type: string
          description: Source service or deployment that produced the archive.
        sections:
          type: array
          description: Backup sections present in the archive data.
          items:
            $ref: "#/components/schemas/BackupSection"

    BackupData:
      type: object
      additionalProperties: false
      properties:
        mcpAccess:
          type: object
          description: Persisted MCP command enablement overrides.
          additionalProperties:
            type: boolean
        accounts:
          type: array
          description: Serialized account rows.
          items:
            type: object
        groups:
          type: array
          description: Serialized account group rows.
          items:
            type: object
        limits:
          type: array
          description: Serialized risk limit rows.
          items:
            type: object
        balances:
          type: array
          description: Serialized balance snapshot rows.
          items:
            type: object
        adjustments:
          type: array
          description: Serialized balance adjustment rows.
          items:
            type: object
        orders:
          type: array
          description: Serialized order rows.
          items:
            type: object
        orderEvents:
          type: array
          description: Serialized order event rows.
          items:
            type: object
        trades:
          type: array
          description: Serialized trade rows.
          items:
            type: object
        audit:
          type: array
          description: Serialized audit log rows.
          items:
            type: object
        marketDataInstances:
          type: array
          description: Serialized market-data source instance rows.
          items:
            type: object
        marketDataInstruments:
          type: array
          description: Serialized market-data instrument mapping rows.
          items:
            type: object
        marketDataQuotes:
          type: array
          description: Serialized latest market-data quote rows.
          items:
            type: object

    BackupRestoreSummary:
      type: object
      required: [applied, skipped, restartRequired]
      properties:
        applied:
          type: object
          additionalProperties:
            type: integer
        skipped:
          type: object
          additionalProperties:
            type: integer
        restartRequired:
          type: boolean

    # Health / status

    Health:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    Status:
      type: object
      required: [healthy, nodes]
      properties:
        healthy:
          type: boolean
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/NodeHealth"

    NodeHealth:
      type: object
      required: [engine, store]
      properties:
        engine:
          $ref: "#/components/schemas/EngineHealth"
        store:
          $ref: "#/components/schemas/StoreHealth"

    EngineHealth:
      type: object
      required: [version, buildProfile, running]
      properties:
        version:
          type: string
        buildProfile:
          type: string
        running:
          type: boolean

    StoreHealth:
      type: object
      required: [path, schemaVersion, reachable]
      properties:
        path:
          type: string
        schemaVersion:
          type: integer
        reachable:
          type: boolean

    # Account

    Account:
      type: object
      required: [id, group, notes, blocked, blockReason]
      properties:
        id:
          type: string
        group:
          type: string
          description: Group identifier, or empty string when not in a group.
        notes:
          type: string
        blocked:
          type: boolean
        blockReason:
          type: string
          description: Non-empty when `blocked` is true.

    # Group

    Group:
      type: object
      required: [id, notes, blocked, blockReason]
      properties:
        id:
          type: string
        notes:
          type: string
        blocked:
          type: boolean
        blockReason:
          type: string

    # Balance

    Balance:
      type: object
      required: [account, asset, available, held, incoming, averageEntryPrice, updatedAt]
      properties:
        account:
          type: string
        asset:
          type: string
          description: Balance asset symbol.
        available:
          type: string
          description: Exact decimal string.
        held:
          type: string
          description: Exact decimal string.
        incoming:
          type: string
          description: Exact decimal string.
        averageEntryPrice:
          type: string
          description: Exact decimal string.
        updatedAt:
          type: string
          format: date-time

    # Adjustment

    AdjustmentAmount:
      type: object
      required: [mode, value]
      properties:
        mode:
          type: string
          description: Adjustment mode (e.g. `set`, `delta`).
        value:
          type: string
          description: Exact decimal string.

    AdjustmentBounds:
      type: object
      properties:
        lower:
          type: string
          description: Inclusive lower bound - exact decimal string.
        upper:
          type: string
          description: Inclusive upper bound - exact decimal string.

    AdjustmentRequest:
      type: object
      required: [asset]
      properties:
        asset:
          type: string
          description: Asset whose spot-funds balances are adjusted.
        averageEntryPrice:
          type: string
          description: Exact decimal string.
        balance:
          description: Requested available-balance change or target.
          $ref: "#/components/schemas/AdjustmentAmount"
        balanceBounds:
          description: Optional guardrail for the resulting available balance.
          $ref: "#/components/schemas/AdjustmentBounds"
        held:
          description: Requested held-balance change or target.
          $ref: "#/components/schemas/AdjustmentAmount"
        heldBounds:
          description: Optional guardrail for the resulting held balance.
          $ref: "#/components/schemas/AdjustmentBounds"
        incoming:
          description: Requested incoming-balance change or target.
          $ref: "#/components/schemas/AdjustmentAmount"
        incomingBounds:
          description: Optional guardrail for the resulting incoming balance.
          $ref: "#/components/schemas/AdjustmentBounds"

    AdjustmentAccepted:
      type: object
      required: [balanceDelta, balanceResult, heldDelta, heldResult, incomingDelta, incomingResult]
      properties:
        balanceDelta:
          type: string
          description: Exact decimal string.
        balanceResult:
          type: string
          description: Exact decimal string.
        heldDelta:
          type: string
          description: Exact decimal string.
        heldResult:
          type: string
          description: Exact decimal string.
        incomingDelta:
          type: string
          description: Exact decimal string.
        incomingResult:
          type: string
          description: Exact decimal string.

    ExecutionOutcome:
      type: object
      required: [asset, balanceDelta, balanceResult, heldDelta, heldResult, incomingDelta, incomingResult]
      properties:
        asset:
          type: string
          description: Asset this balance effect applies to (base or quote leg).
        balanceDelta:
          type: string
          description: Exact decimal string.
        balanceResult:
          type: string
          description: Exact decimal string.
        heldDelta:
          type: string
          description: Exact decimal string.
        heldResult:
          type: string
          description: Exact decimal string.
        incomingDelta:
          type: string
          description: Exact decimal string.
        incomingResult:
          type: string
          description: Exact decimal string.

    AdjustmentRejected:
      type: object
      required: [code, reason]
      properties:
        code:
          type: string
        scope:
          type: string
        policy:
          type: string
        reason:
          type: string
        details:
          type: string

    AdjustmentOutcome:
      type: object
      description: Exactly one of `accepted` or `rejected` is present.
      properties:
        accepted:
          $ref: "#/components/schemas/AdjustmentAccepted"
        rejected:
          $ref: "#/components/schemas/AdjustmentRejected"

    Adjustment:
      type: object
      required: [id, at, account, source, status, request, outcome]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        account:
          type: string
        source:
          type: string
          description: "Originating surface: `panel`, `api`, `mcp`, or `system`."
          enum: [panel, api, mcp, system]
        status:
          type: string
          description: "`accepted` or `rejected`."
          enum: [accepted, rejected]
        request:
          $ref: "#/components/schemas/AdjustmentRequest"
        outcome:
          $ref: "#/components/schemas/AdjustmentOutcome"

    # Order

    Order:
      type: object
      required: [id, at, account, baseAsset, quoteAsset, side, amountKind, amountValue, price, status, source, lockPrices]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        account:
          type: string
        baseAsset:
          type: string
        quoteAsset:
          type: string
        side:
          type: string
        amountKind:
          type: string
        amountValue:
          type: string
          description: Exact decimal string.
        price:
          type: string
          description: Exact decimal string.
        status:
          type: string
        source:
          type: string
          description: "Originating surface: `panel`, `api`, `mcp`, or `system`."
          enum: [panel, api, mcp, system]
        lockPrices:
          type: array
          items:
            type: string
          description: Lock prices used for fund reservation - exact decimal strings.

    # Order event

    OrderEvent:
      type: object
      required: [id, orderId, at, type, source]
      properties:
        id:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        type:
          type: string
        source:
          type: string
          enum: [panel, api, mcp, system]
        rejectCode:
          type: string
          description: Present on rejected events and account-blocking fill events.
        rejectScope:
          type: string
          description: Present on rejected events and account-blocking fill events.
        rejectPolicy:
          type: string
          description: Present on rejected events.
        rejectReason:
          type: string
          description: Present on rejected events and account-blocking fill events.
        rejectDetails:
          type: string
          description: Present on rejected events and account-blocking fill events.
        fillQuantity:
          type: string
          description: Exact decimal string; present on fill events.
        fillPrice:
          type: string
          description: Exact decimal string; present on fill events.
        fillLockPrice:
          type: string
          description: Exact decimal string; present on fill events.

    # Trade

    Trade:
      type: object
      required: [id, orderId, at, account, baseAsset, quoteAsset, side, quantity, price, lockPrice, source]
      properties:
        id:
          type: integer
          format: int64
        orderId:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        account:
          type: string
        baseAsset:
          type: string
        quoteAsset:
          type: string
        side:
          type: string
        quantity:
          type: string
          description: Exact decimal string.
        price:
          type: string
          description: Exact decimal string.
        lockPrice:
          type: string
          description: Exact decimal string.
        source:
          type: string
          enum: [panel, api, mcp, system]

    # Order check (pre-trade dry-run)

    OrderReject:
      type: object
      required: [code, scope, policy, reason, details]
      properties:
        code:
          type: string
        scope:
          type: string
        policy:
          type: string
        reason:
          type: string
        details:
          type: string

    CheckResult:
      type: object
      required: [passed, rejects, wouldLockPrices, wouldBlock]
      properties:
        passed:
          type: boolean
          description: Whether the order would pass pre-trade.
        rejects:
          type: array
          items:
            $ref: "#/components/schemas/OrderReject"
          description: Engine pre-trade rejects; empty when the check passed.
        wouldLockPrices:
          type: array
          items:
            type: string
          description: Reservation lock prices the order would lock - exact decimal strings.
        wouldBlock:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ExecutionBlock"
          description: Account block the engine would record; null when none.

    # Execution report result

    ExecutionBlock:
      type: object
      required: [account, code, reason, details]
      properties:
        account:
          type: string
        code:
          type: string
        reason:
          type: string
        details:
          type: string

    ExecutionResult:
      type: object
      required: [blocks, outcomes]
      properties:
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/ExecutionBlock"
          description: Account blocks the engine recorded during this report.
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/ExecutionOutcome"
          description: >
            Per-asset balance effects of the fill. A spot fill settles both
            legs, so each outcome is tagged with its own asset (the base asset
            bought and the quote asset spent).

    # Limit

    Limit:
      type: object
      required: [policy, scope, account, asset, values]
      properties:
        policy:
          type: string
          description: Risk policy name (e.g. `rate_limit`, `order_size_limit`).
        scope:
          type: string
          description: Policy scope discriminator.
        account:
          type: string
          description: Account this limit applies to, or empty for a global limit.
        asset:
          type: string
          description: Asset this limit applies to, or empty when not asset-scoped.
        values:
          type: object
          additionalProperties:
            type: string
          description: Policy-specific key/value pairs with exact decimal strings.

    # Audit

    AuditEntry:
      type: object
      required: [id, at, actor, action, account, detail, source]
      properties:
        id:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        actor:
          type: string
          description: Principal that performed the action.
        action:
          type: string
        account:
          type: string
          description: Account the action applied to, or empty for global actions.
        detail:
          type: string
        source:
          type: string
          description: "Originating surface: `panel`, `api`, `mcp`, or `system`."
          enum: [panel, api, mcp, system]

    AuditActionGroup:
      type: object
      required: [category, actions]
      properties:
        category:
          type: string
          description: Audit action category.
          enum: [control, trading]
        actions:
          type: array
          description: Action names in the category, in canonical order.
          items:
            type: string

    # Overview

    Counts:
      type: object
      required: [accounts, accountsActive, groups, groupsActive, limits, ordersToday, ordersTotal]
      properties:
        accounts:
          type: integer
          description: Total accounts.
        accountsActive:
          type: integer
          description: Accounts that are not blocked.
        groups:
          type: integer
          description: Total account groups.
        groupsActive:
          type: integer
          description: Account groups that are not blocked.
        limits:
          type: integer
        ordersToday:
          type: integer
          description: >-
            Orders recorded since the today boundary (the optional `since`
            query parameter, else server-local start of day).
        ordersTotal:
          type: integer
          description: Total orders recorded.

    Activity:
      type: object
      required: [at, source, kind, ref, summary]
      properties:
        at:
          type: string
          format: date-time
        source:
          type: string
          enum: [panel, api, mcp, system]
        kind:
          type: string
        ref:
          type: string
        summary:
          type: string

    Overview:
      type: object
      required: [counts, activity]
      properties:
        counts:
          $ref: "#/components/schemas/Counts"
        activity:
          type: array
          items:
            $ref: "#/components/schemas/Activity"

    # Service

    ServiceDatabase:
      type: object
      required: [path, reachable]
      properties:
        path:
          type: string
        reachable:
          type: boolean

    Service:
      type: object
      required: [name, engineBuildProfile, release, database]
      properties:
        name:
          type: string
        engineBuildProfile:
          type: string
        release:
          type: boolean
        database:
          $ref: "#/components/schemas/ServiceDatabase"

    ServiceLogs:
      type: object
      required: [lines, count]
      properties:
        lines:
          type: array
          description: Buffered log lines, oldest first.
          items:
            type: string
        count:
          type: integer
          description: Number of lines returned.

    # User settings

    UserSettings:
      type: object
      required: [welcomeSeen]
      properties:
        welcomeSeen:
          type: boolean
          description: Whether the operator dismissed the first-run welcome dialog.

    # Market data

    MarketData:
      type: object
      required: [providers, instances, freshnessSeconds, restartRequired]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/MarketDataProvider"
        instances:
          type: array
          items:
            $ref: "#/components/schemas/MarketDataInstance"
        freshnessSeconds:
          type: integer
          description: >
            Quote freshness window in seconds. An instrument is stale only when
            both its source and the instrument are enabled and no quote has been
            received or the latest quote is older.
        restartRequired:
          type: boolean
          description: >
            True when stored market-data configuration no longer matches the
            feed runtime and the operator must restart feeds to apply it.

    MarketDataProvider:
      type: object
      required: [type, title]
      properties:
        type:
          type: string
          description: Provider type identifier.
          enum: [ib, binance, kraken, coinbase, alpaca, okx, bybit, oanda, finnhub, byo, mock]
        title:
          type: string

    MarketDataInstanceCreate:
      type: object
      required: [type, enabled]
      properties:
        type:
          type: string
          description: Provider type identifier. The service assigns the internal instance id.
          enum: [ib, binance, kraken, coinbase, alpaca, okx, bybit, oanda, finnhub, byo, mock]
        label:
          type: string
          description: Unique human-readable label shown in the operator panel.
        credentials:
          type: string
          description: Opaque provider-specific connection settings JSON.
        enabled:
          type: boolean
          description: Whether the source instance should start enabled.

    MarketDataInstanceSettingsUpdate:
      type: object
      properties:
        label:
          type: string
          description: Unique human-readable label shown in the operator panel.
        credentials:
          type: string
          description: >
            Opaque provider-specific connection settings JSON. During update,
            blank string fields preserve existing stored values so secret
            placeholders can be submitted without exposing stored secrets.

    MarketDataInstance:
      type: object
      required:
        [
          id,
          type,
          label,
          credentials,
          state,
          enabled,
          verifiesSymbols,
          searchesSymbols,
        ]
      properties:
        id:
          type: string
          description: Market-data source instance identifier.
        type:
          type: string
          description: Provider type identifier.
          enum:
            - ib
            - binance
            - kraken
            - coinbase
            - alpaca
            - okx
            - bybit
            - oanda
            - finnhub
            - byo
            - mock
        label:
          type: string
          description: Human-readable label shown in the operator panel.
        credentials:
          type: string
          description: Always redacted to an empty string in responses.
        settings:
          type: object
          additionalProperties: true
          description: Non-secret provider settings safe to display in edit forms.
        secrets:
          type: object
          additionalProperties:
            type: boolean
          description: Stored-secret presence flags; never contains secret values.
        state:
          type: string
          description: >
            Current subscription state: `disabled` (instance disabled),
            `pending` (enabled in the store but not yet applied; restart to
            apply), `ok` (subscribed), or `error` (subscription failed). Empty
            when no connector runtime is wired.
          enum: ["", disabled, pending, ok, error]
        error:
          type: string
          description: Short operator-facing message present only when `state` is `error`.
        enabled:
          type: boolean
        verifiesSymbols:
          type: boolean
          description: Whether this provider can verify configured symbols.
        searchesSymbols:
          type: boolean
          description: Whether this provider can search provider-side symbols.
        instruments:
          type: array
          items:
            $ref: "#/components/schemas/MarketDataInstrument"

    MarketDataInstrument:
      type: object
      required: [externalSymbol, baseAsset, quoteAsset, manualPrice, enabled]
      properties:
        instanceId:
          type: string
          description: Present on read responses; the path id is authoritative on writes.
        externalSymbol:
          type: string
          description: Provider-side instrument symbol.
        baseAsset:
          type: string
          description: Asset being bought or sold for this mapping.
        quoteAsset:
          type: string
          description: Asset used for pricing and settlement for this mapping.
        manualPrice:
          type: string
          description: >
            Exact decimal manual mark used by BYO/manual providers. On write,
            use an empty string "" for instruments or providers without a manual mark.
        enabled:
          type: boolean
          description: Whether this instrument mapping is enabled.
        updateIntervalMs:
          type: integer
          description: >
            Elapsed milliseconds between the two most recent quote updates,
            present on read responses when available.
        stale:
          type: boolean
          description: >
            Whether the latest quote is missing or older than `freshnessSeconds`.
            False when the source or instrument is disabled.
        quote:
          description: Latest quote for this mapping on read responses.
          $ref: "#/components/schemas/MarketDataQuote"

    MarketDataSymbolVerificationRequest:
      type: object
      required: [externalSymbol]
      properties:
        externalSymbol:
          type: string
          description: Provider-side symbol to verify.

    MarketDataSymbolVerification:
      type: object
      required: [supported, exists]
      properties:
        supported:
          type: boolean
          description: Whether the provider supports symbol verification.
        exists:
          type: boolean
          description: Whether the symbol exists as typed.
        suggestion:
          type: string
          description: Case-folded provider symbol variant when available.
        details:
          type: string
          description: Provider metadata for the matched symbol.

    MarketDataSymbolSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: Symbol text to search for on the provider.
        secType:
          type: string
          description: Optional provider security type filter, such as `STK` or `CASH`.
        exchange:
          type: string
          description: Optional exchange or venue filter.
        currency:
          type: string
          description: Optional settlement currency filter.
        lastTradeDateOrContractMonth:
          type: string
          description: Optional futures or options expiry in provider format.
        right:
          type: string
          description: Optional option right filter, such as `C` or `P`.
        strike:
          type: string
          description: Exact decimal string.

    MarketDataSymbolSearch:
      type: object
      required: [supported, matches]
      properties:
        supported:
          type: boolean
          description: Whether the provider supports symbol search.
        matches:
          type: array
          items:
            $ref: "#/components/schemas/MarketDataSymbolMatch"

    MarketDataSymbolMatch:
      type: object
      required: [symbol, secType]
      properties:
        symbol:
          type: string
        name:
          type: string
        secType:
          type: string
        exchange:
          type: string
        primaryExchange:
          type: string
        currency:
          type: string
        conId:
          type: string
        lastTradeDateOrContractMonth:
          type: string
        strike:
          type: string
          description: Exact decimal string.
        right:
          type: string
        multiplier:
          type: string
        localSymbol:
          type: string
        tradingClass:
          type: string

    MarketDataQuote:
      type: object
      required: [asOf, receivedAt, mark, bid, ask]
      properties:
        asOf:
          type: string
          format: date-time
          description: Provider quote timestamp.
        receivedAt:
          type: string
          format: date-time
          description: Time the Officer connector manager received the quote.
        mark:
          type: string
          description: Exact decimal string.
        bid:
          type: string
          description: Exact decimal string.
        ask:
          type: string
          description: Exact decimal string.

    # MCP access control

    McpCommand:
      type: object
      required:
        [name, title, agentDescription, mutating, protective, implemented, enabled]
      properties:
        name:
          type: string
          description: Wire name of the MCP tool.
        title:
          type: string
          description: Human-readable label for the operator panel.
        agentDescription:
          type: string
          description: One-line description of what an AI agent does with the command.
        mutating:
          type: boolean
          description: Whether the command changes control-plane or engine state.
        protective:
          type: boolean
          description: >
            Whether the command guards capital or risk posture, so the panel can
            require confirmation before enabling it.
        implemented:
          type: boolean
          description: Whether a handler backs the command yet.
        enabled:
          type: boolean
          description: >
            Effective enabled state: the stored override when present, otherwise
            the catalogue default.
