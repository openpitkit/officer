openapi: "3.1.0"

info:
  title: Pit Officer REST API
  version: "1"
  description: >
    Control-plane REST API for the Pit Officer service. The public surface is
    mounted at `/api/v1`; an identical mirror at `/app/api/v1` is reserved for
    the operator dashboard. All responses are `application/json`. Errors use the
    envelope `{"error":{"code":"...","message":"..."}}`. Money and size values
    are exact decimal strings - never IEEE 754 floats.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: /api/v1
    description: Public REST API

tags:
  - name: health
    description: Liveness and deployment status
  - name: accounts
    description: Account lifecycle and admin
  - name: groups
    description: Account group lifecycle and admin
  - name: balances
    description: Spot-funds balance snapshots
  - name: adjustments
    description: Balance adjustments (apply and list)
  - name: orders
    description: Order submission and retrieval
  - name: trades
    description: Trade records
  - name: limits
    description: Risk limit barriers
  - name: signing
    description: Signing keys and the order approval-token flow
  - name: audit
    description: Append-only audit trail
  - name: mcp-access
    description: MCP command access control
  - name: user-settings
    description: Operator UI preferences
  - name: market-data
    description: Market-data source configuration and latest quote snapshots
  - name: backup
    description: Portable database backup and restore
  - name: business-csv
    description: Business-entity CSV import and export
  - name: dashboard
    description: Overview and service information

paths:

  # ---------------------------------------------------------------------------
  # Health / status
  # ---------------------------------------------------------------------------

  /health:
    get:
      operationId: getHealth
      summary: JSON liveness probe
      tags: [health]
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /status:
    get:
      operationId: getStatus
      summary: Engine and store health across all nodes
      tags: [health]
      responses:
        "200":
          description: Status retrieved (even when unhealthy the body is returned with 200).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          description: Status unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Backup / restore
  # ---------------------------------------------------------------------------

  /backup/export:
    post:
      operationId: exportBackup
      summary: Export a portable database backup
      tags: [backup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope:
                  description: Backup scope that selects sections and entities to export.
                  $ref: "#/components/schemas/BackupScope"
                zip:
                  type: boolean
                  description: Return a ZIP archive containing the JSON backup.
      responses:
        "200":
          description: Portable backup archive, as JSON or ZIP.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Timestamped backup filename.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupArchive"
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /backup/restore:
    post:
      operationId: restoreBackup
      summary: Restore a portable database backup
      tags: [backup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, mode]
              properties:
                archive:
                  description: Inline JSON backup archive to restore.
                  $ref: "#/components/schemas/BackupArchive"
                archiveFile:
                  type: string
                  format: byte
                  description: Base64-encoded JSON backup or ZIP containing one JSON backup.
                archiveFilename:
                  type: string
                  description: Original uploaded filename for diagnostics.
                scope:
                  description: Restore scope that selects sections and entities to apply.
                  $ref: "#/components/schemas/BackupScope"
                mode:
                  description: Restore conflict handling mode.
                  $ref: "#/components/schemas/BackupRestoreMode"
      responses:
        "200":
          description: Restore completed.
          content:
            application/json:
              schema:
                type: object
                required: [summary]
                properties:
                  summary:
                    $ref: "#/components/schemas/BackupRestoreSummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /business-csv/export:
    post:
      operationId: exportBusinessCSV
      summary: Export business entities as CSV or ZIP
      tags: [business-csv]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessCSVExportRequest"
      responses:
        "200":
          description: CSV file or ZIP containing one CSV file.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Timestamped export filename.
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /business-csv/import/preview:
    post:
      operationId: previewBusinessCSVImport
      summary: Decode business CSV and report import conflicts
      tags: [business-csv]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessCSVImportPreviewRequest"
      responses:
        "200":
          description: Parsed file metadata and conflict summary.
          content:
            application/json:
              schema:
                type: object
                required: [preview]
                properties:
                  preview:
                    $ref: "#/components/schemas/BusinessCSVImportPreview"
        "400":
          $ref: "#/components/responses/ValidationError"
        "413":
          $ref: "#/components/responses/TooLargeError"
        "500":
          $ref: "#/components/responses/InternalError"

  /business-csv/import:
    post:
      operationId: importBusinessCSV
      summary: Import business entities from CSV or ZIP
      description: >
        Applies validated business CSV rows atomically. Any row error rolls
        back the entire import, so no entity rows or per-row audit rows are
        persisted. The stop conflict policy deliberately commits rows applied
        before the first conflict and returns 200 with counts.stopped=true and
        the conflict list; it is not reported as HTTP 409. A 409 response is
        only reachable through a concurrent-create race while the import is
        applying.
      tags: [business-csv]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessCSVImportRequest"
      responses:
        "200":
          description: Import applied.
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/BusinessCSVImportResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "413":
          $ref: "#/components/responses/TooLargeError"
        "500":
          $ref: "#/components/responses/InternalError"

  /database/reset:
    post:
      operationId: resetDatabase
      summary: Delete all data and recreate the database
      tags: [backup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: boolean
                  description: Must be true to confirm the destructive reset.
      responses:
        "200":
          description: Database recreated from scratch.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Accounts
  # ---------------------------------------------------------------------------

  /accounts:
    get:
      operationId: listAccounts
      summary: List all accounts
      tags: [accounts]
      responses:
        "200":
          description: Account list.
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createAccount
      summary: Create an account
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Account public code (its immutable handle).
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account:
                    $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"

  /accounts/{code}:
    parameters:
      - $ref: "#/components/parameters/AccountCode"
    get:
      operationId: getAccount
      summary: Get account detail and its typed limit barriers
      tags: [accounts]
      responses:
        "200":
          description: Account and its limits.
          content:
            application/json:
              schema:
                type: object
                required: [account, limits]
                properties:
                  account:
                    $ref: "#/components/schemas/Account"
                  limits:
                    $ref: "#/components/schemas/AccountLimits"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteAccount
      summary: Delete an account
      tags: [accounts]
      parameters:
        - $ref: "#/components/parameters/ForceCascade"
      responses:
        "204":
          description: Account deleted.
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/HasDependentsError"
        "500":
          $ref: "#/components/responses/InternalError"

  /accounts/{code}/block:
    parameters:
      - $ref: "#/components/parameters/AccountCode"
    post:
      operationId: blockAccount
      summary: Block an account
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: Human-readable reason for the block.
      responses:
        "200":
          description: Account after blocking.
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account:
                    $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /accounts/{code}/unblock:
    parameters:
      - $ref: "#/components/parameters/AccountCode"
    post:
      operationId: unblockAccount
      summary: Unblock an account
      tags: [accounts]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Account after unblocking.
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account:
                    $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /accounts/{code}/group:
    parameters:
      - $ref: "#/components/parameters/AccountCode"
    put:
      operationId: setAccountGroup
      summary: Set (or clear) account group membership
      description: >
        Assigns the account to a group. Pass an empty string to clear group
        membership.
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group]
              properties:
                group:
                  type: string
                  description: Group code. Empty string clears membership.
      responses:
        "200":
          description: Account after update.
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account:
                    $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /accounts/{code}/notes:
    parameters:
      - $ref: "#/components/parameters/AccountCode"
    put:
      operationId: setAccountNotes
      summary: Set operator notes on an account
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notes]
              properties:
                notes:
                  type: string
                  description: Free-form operator notes stored on the account.
      responses:
        "200":
          description: Account after update.
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account:
                    $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /accounts/{code}/adjustments:
    parameters:
      - $ref: "#/components/parameters/AccountCode"
    get:
      operationId: listAccountAdjustments
      summary: List adjustments for an account
      tags: [adjustments]
      parameters:
        - $ref: "#/components/parameters/SourceFilter"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Adjustment list.
          content:
            application/json:
              schema:
                type: object
                required: [adjustments]
                properties:
                  adjustments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Adjustment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: applyAdjustment
      summary: Apply a balance adjustment to an account
      description: >
        Runs the adjustment through the engine. A policy reject is a successful
        call: the rejected record is returned in the body with `status` =
        `"rejected"`. HTTP errors indicate only system-level failures. The request
        may carry an optional `externalId`: when supplied it is used as-is and a
        duplicate is rejected with 409; when omitted the server generates one and
        returns it on the record.
      tags: [adjustments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentRequest"
      responses:
        "201":
          description: Adjustment record created (accepted or rejected).
          content:
            application/json:
              schema:
                type: object
                required: [adjustment]
                properties:
                  adjustment:
                    $ref: "#/components/schemas/Adjustment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Groups
  # ---------------------------------------------------------------------------

  /groups:
    get:
      operationId: listGroups
      summary: List all account groups
      tags: [groups]
      responses:
        "200":
          description: Group list.
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: "#/components/schemas/Group"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createGroup
      summary: Create an account group
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Group public code (its immutable handle).
                title:
                  type: string
                  maxLength: 256
                  description: Mutable display title for the group.
                notes:
                  type: string
                  maxLength: 4096
                  description: Free-form operator notes stored on the group.
      responses:
        "201":
          description: Group created.
          content:
            application/json:
              schema:
                type: object
                required: [group]
                properties:
                  group:
                    $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"

  /groups/{code}:
    parameters:
      - $ref: "#/components/parameters/GroupCode"
    get:
      operationId: getGroup
      summary: Get group detail and its member accounts
      tags: [groups]
      responses:
        "200":
          description: Group and its member accounts.
          content:
            application/json:
              schema:
                type: object
                required: [group, accounts]
                properties:
                  group:
                    $ref: "#/components/schemas/Group"
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteGroup
      summary: Delete a group
      tags: [groups]
      responses:
        "204":
          description: Group deleted.
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /groups/{code}/notes:
    parameters:
      - $ref: "#/components/parameters/GroupCode"
    put:
      operationId: setGroupNotes
      summary: Set operator notes on a group
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notes]
              properties:
                notes:
                  type: string
                  description: Free-form operator notes stored on the group.
      responses:
        "200":
          description: Group after update.
          content:
            application/json:
              schema:
                type: object
                required: [group]
                properties:
                  group:
                    $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /groups/{code}/block:
    parameters:
      - $ref: "#/components/parameters/GroupCode"
    post:
      operationId: blockGroup
      summary: Block all accounts in a group
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: Human-readable reason for the block.
      responses:
        "200":
          description: Group after blocking.
          content:
            application/json:
              schema:
                type: object
                required: [group]
                properties:
                  group:
                    $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /groups/{code}/unblock:
    parameters:
      - $ref: "#/components/parameters/GroupCode"
    post:
      operationId: unblockGroup
      summary: Unblock all accounts in a group
      tags: [groups]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Group after unblocking.
          content:
            application/json:
              schema:
                type: object
                required: [group]
                properties:
                  group:
                    $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Balances
  # ---------------------------------------------------------------------------

  /balances:
    get:
      operationId: listBalances
      summary: List spot-funds balance snapshots
      tags: [balances]
      parameters:
        - name: account
          in: query
          description: Filter by account code.
          schema:
            type: string
        - name: asset
          in: query
          description: Filter by asset symbol.
          schema:
            type: string
      responses:
        "200":
          description: Balance list.
          content:
            application/json:
              schema:
                type: object
                required: [balances]
                properties:
                  balances:
                    type: array
                    items:
                      $ref: "#/components/schemas/Balance"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Global adjustments list
  # ---------------------------------------------------------------------------

  /adjustments:
    get:
      operationId: listAdjustments
      summary: List adjustments across all accounts
      tags: [adjustments]
      parameters:
        - name: account
          in: query
          description: Filter by account code.
          schema:
            type: string
        - $ref: "#/components/parameters/SourceFilter"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Adjustment list.
          content:
            application/json:
              schema:
                type: object
                required: [adjustments]
                properties:
                  adjustments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Adjustment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Orders
  # ---------------------------------------------------------------------------

  /orders:
    get:
      operationId: listOrders
      summary: List orders
      tags: [orders]
      parameters:
        - name: account
          in: query
          description: Filter by account code.
          schema:
            type: string
        - $ref: "#/components/parameters/SourceFilter"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Order list.
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: submitOrder
      summary: Submit an order through pre-trade risk evaluation
      description: >
        Runs the order through the engine pre-trade checks and records the result.
        An engine reject is a successful call: the returned order carries
        `status` = `"rejected"`. HTTP errors indicate only system-level failures.
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, baseAsset, quoteAsset, side, amountKind, amountValue]
              properties:
                account:
                  type: string
                  description: Account code that owns the order.
                baseAsset:
                  type: string
                  description: Asset being bought or sold.
                quoteAsset:
                  type: string
                  description: Asset used for pricing and settlement.
                side:
                  type: string
                  description: "`buy` or `sell`."
                amountKind:
                  type: string
                  description: "Kind of amount - e.g. `base` or `quote`."
                amountValue:
                  type: string
                  description: Exact decimal string.
                price:
                  type: string
                  description: Exact decimal string. Omit for market orders.
      responses:
        "201":
          description: Order record created (accepted or rejected by the engine).
          content:
            application/json:
              schema:
                type: object
                required: [order]
                properties:
                  order:
                    $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /orders/check:
    post:
      operationId: checkOrder
      summary: Check an order against pre-trade risk evaluation (non-mutating)
      description: >
        Runs the order through the engine pre-trade checks as a dry-run and
        reports whether it would pass. Nothing is recorded and no state changes:
        no order is placed and no funds are reserved. An engine reject is a
        successful call returning `passed` = `false` with the reasons; HTTP
        errors indicate only system-level failures. The request body is
        identical to `POST /orders`.
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, baseAsset, quoteAsset, side, amountKind, amountValue]
              properties:
                account:
                  type: string
                  description: Account code to evaluate without mutation.
                baseAsset:
                  type: string
                  description: Asset being bought or sold.
                quoteAsset:
                  type: string
                  description: Asset used for pricing and settlement.
                side:
                  type: string
                  description: "`buy` or `sell`."
                amountKind:
                  type: string
                  description: "Kind of amount - e.g. `base` or `quote`."
                amountValue:
                  type: string
                  description: Exact decimal string.
                price:
                  type: string
                  description: Exact decimal string. Omit for market orders.
      responses:
        "200":
          description: Dry-run outcome (would-pass or would-reject).
          content:
            application/json:
              schema:
                type: object
                required: [check]
                properties:
                  check:
                    $ref: "#/components/schemas/CheckResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /orders/{externalId}:
    parameters:
      - $ref: "#/components/parameters/OrderExternalId"
    get:
      operationId: getOrder
      summary: Get an order with its approval, lifecycle events, and trades
      tags: [orders]
      responses:
        "200":
          description: >
            Order, its events and trades, and its approval envelope. The
            `approval` field is present only when the order has been signed and
            is omitted entirely when the order is unsigned.
          content:
            application/json:
              schema:
                type: object
                required: [order, events, trades]
                properties:
                  order:
                    $ref: "#/components/schemas/Order"
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrderEvent"
                  trades:
                    type: array
                    items:
                      $ref: "#/components/schemas/Trade"
                  approval:
                    description: >
                      Signed approval envelope. Present only when the order is
                      signed; omitted entirely when unsigned.
                    $ref: "#/components/schemas/OrderApproval"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /orders/{externalId}/execution-reports:
    parameters:
      - $ref: "#/components/parameters/OrderExternalId"
    post:
      operationId: applyExecutionReport
      summary: Apply an execution report (fill) to an order
      description: >
        Records a fill against the parent order. The instrument, account, and
        side are taken from the parent order; only the fill fields are required
        in the body. Returns account blocks the engine recorded plus per-asset
        adjustment outcomes.
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity, price, final]
              properties:
                quantity:
                  type: string
                  description: Fill quantity - exact decimal string.
                price:
                  type: string
                  description: Fill price - exact decimal string.
                lockPrice:
                  type: string
                  description: Lock price used for fund reservation - exact decimal string.
                force:
                  type: boolean
                  description: >
                    Bypass Officer's safety checks and route straight to the
                    engine. When omitted or false, a terminal order returns 409
                    terminal_order.
                final:
                  type: boolean
                  description: Whether this is the last fill for the order.
      responses:
        "201":
          description: Execution result; the fill (trade) record was created.
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/ExecutionResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Trades
  # ---------------------------------------------------------------------------

  /trades:
    get:
      operationId: listTrades
      summary: List trade records
      tags: [trades]
      parameters:
        - name: account
          in: query
          description: Filter by account code.
          schema:
            type: string
        - $ref: "#/components/parameters/SourceFilter"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Trade list.
          content:
            application/json:
              schema:
                type: object
                required: [trades]
                properties:
                  trades:
                    type: array
                    items:
                      $ref: "#/components/schemas/Trade"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Limits
  # ---------------------------------------------------------------------------

  /limits:
    get:
      operationId: listLimits
      summary: List typed risk limit barriers
      description: >
        Returns the typed limit barriers grouped by policy (rate, order-size,
        and P&L-bounds). Barriers reference accounts by code; no surrogate or
        engine id is involved.
      tags: [limits]
      parameters:
        - name: account
          in: query
          description: Filter by account code.
          schema:
            type: string
      responses:
        "200":
          description: Typed limit barriers grouped by policy.
          content:
            application/json:
              schema:
                type: object
                required: [limits]
                properties:
                  limits:
                    $ref: "#/components/schemas/AccountLimits"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteLimit
      summary: Delete a risk limit barrier
      tags: [limits]
      parameters:
        - name: policy
          in: query
          required: true
          description: Risk policy whose barrier should be deleted.
          schema:
            type: string
            enum: [rate_limit, order_size_limit, pnl_bounds_kill_switch]
        - name: scope
          in: query
          required: true
          description: Policy scope discriminator of the barrier to delete.
          schema:
            $ref: "#/components/schemas/LimitScope"
        - name: account
          in: query
          description: Account-scoped barrier owner code, or omit for a global barrier.
          schema:
            type: string
        - name: asset
          in: query
          description: Asset-scoped barrier asset, or omit when not asset-scoped.
          schema:
            type: string
      responses:
        "204":
          description: Limit deleted.
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "503":
          $ref: "#/components/responses/EngineRestartingError"
        "500":
          $ref: "#/components/responses/InternalError"

  /limits/rate:
    put:
      operationId: putRateLimit
      summary: Upsert a rate-limit barrier
      tags: [limits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateLimit"
      responses:
        "200":
          description: Normalized form of the stored rate-limit barrier.
          content:
            application/json:
              schema:
                type: object
                required: [rateLimit]
                properties:
                  rateLimit:
                    $ref: "#/components/schemas/RateLimit"
        "400":
          $ref: "#/components/responses/ValidationError"
        "501":
          $ref: "#/components/responses/NotImplementedError"
        "503":
          $ref: "#/components/responses/EngineRestartingError"
        "500":
          $ref: "#/components/responses/InternalError"

  /limits/order-size:
    put:
      operationId: putOrderSizeLimit
      summary: Upsert an order-size barrier
      tags: [limits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderSizeLimit"
      responses:
        "200":
          description: Normalized form of the stored order-size barrier.
          content:
            application/json:
              schema:
                type: object
                required: [orderSizeLimit]
                properties:
                  orderSizeLimit:
                    $ref: "#/components/schemas/OrderSizeLimit"
        "400":
          $ref: "#/components/responses/ValidationError"
        "501":
          $ref: "#/components/responses/NotImplementedError"
        "503":
          $ref: "#/components/responses/EngineRestartingError"
        "500":
          $ref: "#/components/responses/InternalError"

  /limits/pnl-bounds:
    put:
      operationId: putPnlBoundsLimit
      summary: Upsert a P&L-bounds kill-switch barrier
      tags: [limits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PnlBoundsLimit"
      responses:
        "200":
          description: Normalized form of the stored P&L-bounds barrier.
          content:
            application/json:
              schema:
                type: object
                required: [pnlBoundsLimit]
                properties:
                  pnlBoundsLimit:
                    $ref: "#/components/schemas/PnlBoundsLimit"
        "400":
          $ref: "#/components/responses/ValidationError"
        "501":
          $ref: "#/components/responses/NotImplementedError"
        "503":
          $ref: "#/components/responses/EngineRestartingError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Audit
  # ---------------------------------------------------------------------------

  /audit:
    get:
      operationId: listAudit
      summary: List audit trail entries
      description: >
        Returns audit rows in reverse chronological order. Optional `account`
        and `source` filters narrow the trail. `source` values: `panel`, `api`,
        `mcp`, `system`. The action filter resolves from an explicit
        `actions` include-list when present, otherwise from `category`; it
        defaults to `control`, so the high-volume trading stream (`submit_order`,
        `execution_report`) is hidden unless requested. The action filter is
        applied before the limit, so control rows are never crowded out by
        trading volume.
      tags: [audit]
      parameters:
        - name: account
          in: query
          description: Filter by account code.
          schema:
            type: string
        - name: source
          in: query
          description: "Filter by originating surface: `panel`, `api`, `mcp`, or `system`."
          schema:
            type: string
            enum: [panel, api, mcp, system]
        - name: category
          in: query
          description: >
            Action category shortcut, used when `actions` is absent: `control`
            (default) hides trading, `trading` shows only the order/execution
            stream, `all` disables the action filter.
          schema:
            type: string
            enum: [control, trading, all]
        - name: actions
          in: query
          description: >
            Comma-separated list of audit action types to include (for example
            `block,set_limit`). Overrides `category` when present. Unknown action
            names are rejected with 400.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum rows to return (default 100, capped at 1000).
          schema:
            type: integer
            default: 100
            maximum: 1000
      responses:
        "200":
          description: Audit entries.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /audit/actions:
    get:
      operationId: listAuditActions
      summary: List the audit-action catalogue grouped by category
      description: >
        Returns every audit action grouped by category, control first, in the
        domain canonical order. It is the single source the web uses to build the
        audit type filter, so the classification is never hardcoded client-side.
      tags: [audit]
      responses:
        "200":
          description: Audit-action catalogue grouped by category.
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditActionGroup"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # MCP access control
  # ---------------------------------------------------------------------------

  /mcp-access:
    get:
      operationId: listMcpAccess
      summary: List the MCP command catalogue and per-command enabled state
      description: >
        Returns every MCP command Pit Officer exposes - both the implemented
        read-only tools and the designed-but-not-yet-built mutating ones - with
        its metadata and current effective enabled state. A command with no
        stored override resolves to its catalogue default (read-only commands
        on, protective commands off).
      tags: [mcp-access]
      responses:
        "200":
          description: MCP command catalogue with effective enabled state.
          content:
            application/json:
              schema:
                type: object
                required: [commands]
                properties:
                  commands:
                    type: array
                    items:
                      $ref: "#/components/schemas/McpCommand"
        "500":
          $ref: "#/components/responses/InternalError"

  /mcp-access/{command}:
    parameters:
      - name: command
        in: path
        required: true
        description: MCP command name (must be in the catalogue).
        schema:
          type: string
    put:
      operationId: setMcpAccess
      summary: Enable or disable one MCP command
      description: >
        Persists the enabled state for one catalogue command. A disabled command
        stays callable over MCP but returns a non-error "disabled in panel"
        notice instead of running. Confirmation-on-enable for protective commands
        is a UI concern; the backend just persists.
      tags: [mcp-access]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                  description: Whether the command is enabled.
      responses:
        "200":
          description: The updated command with its persisted enabled state.
          content:
            application/json:
              schema:
                type: object
                required: [command]
                properties:
                  command:
                    $ref: "#/components/schemas/McpCommand"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # User settings
  # ---------------------------------------------------------------------------

  /user-settings:
    get:
      operationId: getUserSettings
      summary: Read the current operator's UI preferences
      tags: [user-settings]
      responses:
        "200":
          description: Current operator UI preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: setUserSettings
      summary: Persist the current operator's UI preferences
      tags: [user-settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettings"
      responses:
        "200":
          description: Preferences persisted; returns the stored state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Signing keys and approval token flow
  # ---------------------------------------------------------------------------

  /signing/keys/generate:
    post:
      operationId: generateSigningKey
      summary: Generate a fresh Ed25519 signing key and make it active
      description: >
        Generates a fresh Ed25519 keypair, makes it the sole active signing key,
        and returns it without private material.
      tags: [signing]
      responses:
        "201":
          description: The generated signing key (no private material).
          content:
            application/json:
              schema:
                type: object
                required: [key]
                properties:
                  key:
                    $ref: "#/components/schemas/SigningKey"
        "500":
          $ref: "#/components/responses/InternalError"

  /signing/keys/import:
    post:
      operationId: importSigningKey
      summary: Import an Ed25519 signing key and make it active
      tags: [signing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, format]
              properties:
                key:
                  type: string
                  description: Raw key material in the given format. Write-only.
                format:
                  type: string
                  description: Key material format.
                  enum: [pem-pkcs8, openssh, raw-base64]
      responses:
        "201":
          description: The imported signing key (no private material).
          content:
            application/json:
              schema:
                type: object
                required: [key]
                properties:
                  key:
                    $ref: "#/components/schemas/SigningKey"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /signing/keys:
    get:
      operationId: listSigningKeys
      summary: List all signing keys, including inactive ones
      description: >
        Returns every signing key, including inactive ones, so connectors can
        verify in-flight tokens. Private material is never returned.
      tags: [signing]
      responses:
        "200":
          description: Signing key list.
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/SigningKey"
        "500":
          $ref: "#/components/responses/InternalError"

  /signing/keys/active/public:
    get:
      operationId: getActivePublicKey
      summary: Export the active signing key's public key
      tags: [signing]
      parameters:
        - name: format
          in: query
          required: false
          description: Export format. Defaults to `pem-pkcs8`.
          schema:
            type: string
            enum: [pem-pkcs8, openssh, raw-base64]
            default: pem-pkcs8
      responses:
        "200":
          description: The active public key in the requested format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicKey"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /signing/config:
    get:
      operationId: getSigningConfig
      summary: Read the signing configuration
      tags: [signing]
      responses:
        "200":
          description: Current signing configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigningConfig"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: setSigningConfig
      summary: Update the signing configuration
      tags: [signing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SigningConfig"
      responses:
        "200":
          description: Configuration persisted; returns the stored state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SigningConfig"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /orders/submit:
    post:
      operationId: submitOrderToken
      summary: Create and submit an order for approval, issuing a signed token
      description: >
        Submit CREATES the order exactly once from the request body: there is no
        separate persisting create beforehand. It runs the engine pre-trade in
        the given mode and records the order, then issues a signed approval token
        on accept. `externalId` is optional: when supplied it is used as-is and a
        duplicate is rejected with 409; when omitted the server generates one. The
        returned `orderExternalId` is the id actually used, so confirm/cancel
        resolve the same order.
      tags: [signing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, baseAsset, quoteAsset, side, amountKind, amountValue]
              properties:
                externalId:
                  $ref: "#/components/schemas/ExternalId"
                  description: >
                    Optional caller-supplied opaque external id (22-char
                    base64url, no padding). When omitted the server generates and
                    returns one. A malformed value is a 400; a duplicate is a 409.
                    Never a surrogate or engine id.
                account:
                  type: string
                  description: Account code that owns the order.
                baseAsset:
                  type: string
                  description: Asset being bought or sold.
                quoteAsset:
                  type: string
                  description: Asset used for pricing and settlement.
                side:
                  type: string
                  description: "`buy` or `sell`."
                amountKind:
                  type: string
                  description: "Kind of amount - e.g. `base` or `quote`."
                amountValue:
                  type: string
                  description: Exact decimal string.
                price:
                  type: string
                  description: Exact decimal string. Omit for market orders.
                mode:
                  type: string
                  description: Submit mode. Defaults to `immediate`.
                  enum: [immediate, hold]
      responses:
        "201":
          description: Order created and approval token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalToken"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"

  /orders/{externalId}/confirm:
    parameters:
      - $ref: "#/components/parameters/OrderExternalId"
    post:
      operationId: confirmExecution
      summary: Confirm a held order with its approval token
      description: >
        Verifies the approval token and commits the held reservation.
      tags: [signing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Approval token issued by submit.
                force:
                  type: boolean
                  description: Bypass Officer's safety checks and route straight to the engine.
      responses:
        "200":
          description: Order after confirmation.
          content:
            application/json:
              schema:
                type: object
                required: [order]
                properties:
                  order:
                    $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"

  /orders/{externalId}/cancel:
    parameters:
      - $ref: "#/components/parameters/OrderExternalId"
    post:
      operationId: cancelOrder
      summary: Cancel a held order with its approval token
      description: >
        Verifies the approval token and rolls back the held reservation.
      tags: [signing]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  description: Approval token issued by submit.
                reason:
                  type: string
                  description: Optional human-readable cancellation reason.
                force:
                  type: boolean
                  description: Bypass Officer's safety checks and route straight to the engine.
      responses:
        "200":
          description: Order after cancellation.
          content:
            application/json:
              schema:
                type: object
                required: [order]
                properties:
                  order:
                    $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Market data
  # ---------------------------------------------------------------------------

  /market-data:
    get:
      operationId: listMarketData
      summary: List market-data providers, source instances, instruments, and latest quotes
      tags: [market-data]
      responses:
        "200":
          description: Market-data control-plane snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [marketData]
                properties:
                  marketData:
                    $ref: "#/components/schemas/MarketData"
        "500":
          $ref: "#/components/responses/InternalError"

  /market-data/restart:
    post:
      operationId: restartMarketData
      summary: Re-apply market-data configuration by restarting the connectors
      description: >-
        Stops the running connectors and starts them again from the current
        store configuration, so config changes take effect without a process
        restart. Returns the refreshed market-data snapshot.
      tags: [market-data]
      responses:
        "200":
          description: Connectors restarted; returns the refreshed market-data snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [marketData]
                properties:
                  marketData:
                    $ref: "#/components/schemas/MarketData"
        "500":
          $ref: "#/components/responses/InternalError"

  /market-data/instances:
    post:
      operationId: createMarketDataInstance
      summary: Create a market-data source instance
      tags: [market-data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketDataInstanceCreate"
      responses:
        "201":
          description: Instance created; returns the persisted instance.
          content:
            application/json:
              schema:
                type: object
                required: [instance]
                properties:
                  instance:
                    $ref: "#/components/schemas/MarketDataInstance"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"

  /market-data/instances/{id}/enabled:
    parameters:
      - $ref: "#/components/parameters/MarketDataInstanceId"
    put:
      operationId: setMarketDataInstanceEnabled
      summary: Enable or disable a market-data source instance
      tags: [market-data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                  description: Whether this market-data source instance is enabled.
      responses:
        "200":
          description: Enabled flag persisted.
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled:
                    type: boolean
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /market-data/instances/{id}/settings:
    parameters:
      - $ref: "#/components/parameters/MarketDataInstanceId"
    put:
      operationId: updateMarketDataInstanceSettings
      summary: Update market-data source connection settings
      tags: [market-data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketDataInstanceSettingsUpdate"
      responses:
        "200":
          description: Settings persisted; returns the refreshed market-data snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [marketData]
                properties:
                  marketData:
                    $ref: "#/components/schemas/MarketData"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"

  /market-data/instances/{id}:
    parameters:
      - $ref: "#/components/parameters/MarketDataInstanceId"
    delete:
      operationId: deleteMarketDataInstance
      summary: Delete a market-data source instance
      tags: [market-data]
      parameters:
        - $ref: "#/components/parameters/ForceCascade"
      responses:
        "204":
          description: Instance deleted.
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/HasDependentsError"
        "500":
          $ref: "#/components/responses/InternalError"

  /market-data/instances/{id}/verify-symbol:
    parameters:
      - $ref: "#/components/parameters/MarketDataInstanceId"
    post:
      operationId: verifyMarketDataSymbol
      summary: Verify one provider-side market-data symbol
      tags: [market-data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketDataSymbolVerificationRequest"
      responses:
        "200":
          description: Symbol verification result.
          content:
            application/json:
              schema:
                type: object
                required: [verification]
                properties:
                  verification:
                    $ref: "#/components/schemas/MarketDataSymbolVerification"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "500":
          $ref: "#/components/responses/InternalError"

  /market-data/instances/{id}/search-symbols:
    parameters:
      - $ref: "#/components/parameters/MarketDataInstanceId"
    post:
      operationId: searchMarketDataSymbols
      summary: Search provider-side market-data symbols
      tags: [market-data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketDataSymbolSearchRequest"
      responses:
        "200":
          description: Symbol search result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketDataSymbolSearch"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "500":
          $ref: "#/components/responses/InternalError"

  /market-data/instances/{id}/instruments:
    parameters:
      - $ref: "#/components/parameters/MarketDataInstanceId"
    put:
      operationId: upsertMarketDataInstrument
      summary: Add or replace one market-data instrument mapping
      tags: [market-data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketDataInstrument"
      responses:
        "200":
          description: Instrument persisted; returns the refreshed market-data snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [marketData]
                properties:
                  marketData:
                    $ref: "#/components/schemas/MarketData"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteMarketDataInstrument
      summary: Delete one market-data instrument mapping
      tags: [market-data]
      parameters:
        - name: externalSymbol
          in: query
          required: true
          description: Provider-side symbol to delete.
          schema:
            type: string
      responses:
        "204":
          description: Instrument deleted.
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /market-data/instances/{id}/instruments/enabled:
    parameters:
      - $ref: "#/components/parameters/MarketDataInstanceId"
    put:
      operationId: setMarketDataInstrumentEnabled
      summary: Enable or disable one market-data instrument mapping
      tags: [market-data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [externalSymbol, enabled]
              properties:
                externalSymbol:
                  type: string
                  description: Provider-side instrument symbol to toggle.
                enabled:
                  type: boolean
                  description: Whether this instrument mapping is enabled.
      responses:
        "200":
          description: Enabled flag persisted.
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled:
                    type: boolean
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Dashboard / service
  # ---------------------------------------------------------------------------

  /overview:
    get:
      operationId: getOverview
      summary: Dashboard overview - headline counts and recent activity
      tags: [dashboard]
      parameters:
        - name: since
          in: query
          required: false
          description: >-
            RFC3339 boundary for the orders-today tally. When absent or
            unparseable the server uses its local start of day.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Overview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Overview"
        "500":
          $ref: "#/components/responses/InternalError"

  /service:
    get:
      operationId: getService
      summary: Service identity and build information
      tags: [dashboard]
      responses:
        "200":
          description: Service info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
        "500":
          $ref: "#/components/responses/InternalError"

  /service/logs:
    get:
      operationId: getServiceLogs
      summary: Recent service log lines
      description: >
        The captured tail of the service's structured log, oldest line first.
        The tail is a bounded in-memory ring buffer, so it holds only the most
        recent lines.
      tags: [dashboard]
      responses:
        "200":
          description: Buffered log tail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceLogs"

  /service/logs/download:
    get:
      operationId: downloadServiceLogs
      summary: Download the full service log buffer
      description: >
        The full captured log buffer as a plain-text attachment, lines joined by
        newlines, oldest line first.
      tags: [dashboard]
      responses:
        "200":
          description: Log buffer as a text attachment.
          headers:
            Content-Disposition:
              description: Attachment with filename pit-officer.log.
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string

# =============================================================================
# Components
# =============================================================================

components:

  # ---------------------------------------------------------------------------
  # Parameters
  # ---------------------------------------------------------------------------

  parameters:
    AccountCode:
      name: code
      in: path
      required: true
      description: URL-encoded account public code.
      schema:
        type: string

    GroupCode:
      name: code
      in: path
      required: true
      description: URL-encoded group public code.
      schema:
        type: string

    OrderExternalId:
      name: externalId
      in: path
      required: true
      description: The order's opaque 22-char base64url public handle (its external id).
      schema:
        $ref: "#/components/schemas/ExternalId"

    MarketDataInstanceId:
      name: id
      in: path
      required: true
      description: >
        URL-encoded market-data instance external id - the instance's opaque
        22-char base64url public handle, never a surrogate or engine id.
      schema:
        $ref: "#/components/schemas/ExternalId"

    SourceFilter:
      name: source
      in: query
      description: "Filter by originating surface: `panel`, `api`, `mcp`, or `system`."
      schema:
        type: string
        enum: [panel, api, mcp, system]

    ForceCascade:
      name: force
      in: query
      description: Allow application-approved cascade deletion of dependent rows.
      schema:
        type: boolean
        default: false

    LimitParam:
      name: limit
      in: query
      description: Maximum rows to return (default 100, capped at 1000).
      schema:
        type: integer
        default: 100
        maximum: 1000

  # ---------------------------------------------------------------------------
  # Responses
  # ---------------------------------------------------------------------------

  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotFoundError:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    ConflictError:
      description: Resource already exists.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    HasDependentsError:
      description: Delete would remove dependent rows without force.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HasDependentsError"

    UpstreamError:
      description: Upstream provider request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    NotImplementedError:
      description: Engine capability not yet available.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    EngineRestartingError:
      description: Engine is being rebuilt; mutating requests are rejected.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    TooLargeError:
      description: Import payload exceeds the server-side size limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------

  schemas:

    # Shared identity

    ExternalId:
      type: string
      minLength: 22
      maxLength: 22
      pattern: "^[A-Za-z0-9_-]{22}$"
      description: >
        Opaque 22-char base64url public handle. No surrogate or engine id is
        ever exposed.

    # Error envelope

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: >
                Machine-readable code: `validation`, `not_found`, `conflict`,
                `has_dependents`, `terminal_order`, `precondition`, `too_large`,
                `engine_restarting`, `not_implemented`, or `internal`.
              example: not_found
            message:
              type: string
              example: account not found

    DependentCount:
      type: object
      required: [kind, count]
      properties:
        kind:
          type: string
          description: Dependent row category.
        count:
          type: integer
          minimum: 0
          description: Number of dependent rows in this category.

    HasDependentsError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, dependents]
          properties:
            code:
              type: string
              enum: [has_dependents]
            message:
              type: string
              example: has dependents
            dependents:
              type: array
              items:
                $ref: "#/components/schemas/DependentCount"

    # Business CSV

    BusinessCSVEntity:
      type: string
      enum: [account_groups, accounts, positions, orders, trades]

    BusinessCSVImportEntity:
      type: string
      enum: [account_groups, accounts, positions]

    BusinessCSVDelimiter:
      type: string
      enum: [comma, semicolon, tab, pipe]

    BusinessCSVConflictPolicy:
      type: string
      enum: [skip, replace, stop]

    BusinessCSVExportFilters:
      type: object
      properties:
        groupCode:
          type: [string, "null"]
          description: >
            Accounts export group filter. Omit or use null to export all
            accounts; use "" to export the default/no-group bucket; use a
            non-empty group code to export that group.
        account:
          type: string
          description: Accounts, positions, orders, and trades account filter.
        asset:
          type: string
          description: Positions asset filter.
        source:
          type: string
          enum: [panel, api, mcp, system]
          description: Orders and trades source filter.

    BusinessCSVExportRequest:
      type: object
      required: [entity, delimiter]
      properties:
        entity:
          $ref: "#/components/schemas/BusinessCSVEntity"
        delimiter:
          $ref: "#/components/schemas/BusinessCSVDelimiter"
        zip:
          type: boolean
          description: Return a ZIP with one CSV entry, using best compression.
        filters:
          $ref: "#/components/schemas/BusinessCSVExportFilters"

    BusinessCSVImportPreviewRequest:
      type: object
      required: [entity, delimiter, filename, payloadBase64]
      properties:
        entity:
          $ref: "#/components/schemas/BusinessCSVImportEntity"
        delimiter:
          $ref: "#/components/schemas/BusinessCSVDelimiter"
        filename:
          type: string
          description: Original uploaded filename; `.zip` triggers ZIP decoding.
        payloadBase64:
          type: string
          format: byte
          description: Base64-encoded CSV or ZIP payload.

    BusinessCSVImportRequest:
      allOf:
        - $ref: "#/components/schemas/BusinessCSVImportPreviewRequest"
        - type: object
          required: [conflictPolicy]
          properties:
            conflictPolicy:
              $ref: "#/components/schemas/BusinessCSVConflictPolicy"

    BusinessCSVImportFile:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          description: Plain filename or selected ZIP entry name.
        type:
          type: string
          enum: [csv, zip]

    BusinessCSVConflict:
      type: object
      required: [row, key]
      properties:
        row:
          type: integer
          description: One-based CSV row number including the header row.
        key:
          type: string
          description: Conflicting business key.

    BusinessCSVImportCounts:
      type: object
      required: [rows, applied, skipped, conflicts, stopped]
      properties:
        rows:
          type: integer
        applied:
          type: integer
        skipped:
          type: integer
        conflicts:
          type: integer
        stopped:
          type: boolean

    BusinessCSVImportPreview:
      type: object
      required: [file, counts, conflicts]
      properties:
        file:
          $ref: "#/components/schemas/BusinessCSVImportFile"
        counts:
          $ref: "#/components/schemas/BusinessCSVImportCounts"
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/BusinessCSVConflict"

    BusinessCSVImportResult:
      allOf:
        - $ref: "#/components/schemas/BusinessCSVImportPreview"

    # Backup / restore

    BackupSection:
      type: string
      enum:
        - accounts_groups
        - positions
        - risk_limits
        - market_data_settings
        - market_data_quotes
        - general_settings
        - activity_history
        - audit_log

    BackupRestoreMode:
      type: string
      enum: [replace_all, overwrite, insert_missing]

    BackupEntitySelector:
      type: object
      properties:
        all:
          type: boolean
          description: Select every entity in the selector's category.
        accounts:
          type: array
          description: Account codes to include.
          items:
            type: string
        groups:
          type: array
          description: Group codes to include.
          items:
            type: string

    BackupScope:
      type: object
      properties:
        all:
          type: boolean
          description: Include every section when true.
        sections:
          type: array
          description: Backup sections to include when `all` is false.
          items:
            $ref: "#/components/schemas/BackupSection"
        accounts:
          description: Account and group selector for account-owned data.
          $ref: "#/components/schemas/BackupEntitySelector"
        positions:
          description: Account and group selector for position-related data.
          $ref: "#/components/schemas/BackupEntitySelector"

    BackupArchive:
      type: object
      required: [manifest, data]
      properties:
        manifest:
          description: Archive metadata used to validate and route restore.
          $ref: "#/components/schemas/BackupManifest"
        data:
          description: Serialized backup payload grouped by table family.
          $ref: "#/components/schemas/BackupData"

    RealmLabel:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Realm public code.
        title:
          type: string
          description: Optional human-readable realm title.

    BackupManifest:
      type: object
      required: [formatVersion, createdAt, realm, sections]
      properties:
        formatVersion:
          type: integer
          description: Backup archive format version required for restore.
        createdAt:
          type: string
          format: date-time
          description: Time the backup archive was created.
        source:
          type: string
          description: Source service or deployment that produced the archive.
        realm:
          description: Realm the archive was produced for.
          $ref: "#/components/schemas/RealmLabel"
        sections:
          type: array
          description: Backup sections present in the archive data.
          items:
            $ref: "#/components/schemas/BackupSection"

    BackupData:
      type: object
      additionalProperties: false
      properties:
        mcpAccess:
          type: object
          description: Persisted MCP command enablement overrides.
          additionalProperties:
            type: boolean
        accounts:
          type: array
          description: Serialized account rows.
          items:
            type: object
        groups:
          type: array
          description: Serialized account group rows.
          items:
            type: object
        limits:
          type: array
          description: Serialized risk limit rows.
          items:
            type: object
        balances:
          type: array
          description: Serialized balance snapshot rows.
          items:
            type: object
        adjustments:
          type: array
          description: Serialized balance adjustment rows.
          items:
            type: object
        orders:
          type: array
          description: Serialized order rows.
          items:
            type: object
        orderEvents:
          type: array
          description: Serialized order event rows.
          items:
            type: object
        trades:
          type: array
          description: Serialized trade rows.
          items:
            type: object
        audit:
          type: array
          description: Serialized audit log rows.
          items:
            type: object
        marketDataInstances:
          type: array
          description: Serialized market-data source instance rows.
          items:
            type: object
        marketDataInstruments:
          type: array
          description: Serialized market-data instrument mapping rows.
          items:
            type: object
        marketDataQuotes:
          type: array
          description: Serialized latest market-data quote rows.
          items:
            type: object

    BackupRestoreSummary:
      type: object
      required: [applied, skipped, restartRequired]
      properties:
        applied:
          type: object
          additionalProperties:
            type: integer
        skipped:
          type: object
          additionalProperties:
            type: integer
        restartRequired:
          type: boolean

    # Health / status

    Health:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    Status:
      type: object
      required: [healthy, nodes]
      properties:
        healthy:
          type: boolean
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/NodeHealth"

    NodeHealth:
      type: object
      required: [engine, store]
      properties:
        engine:
          $ref: "#/components/schemas/EngineHealth"
        store:
          $ref: "#/components/schemas/StoreHealth"

    EngineHealth:
      type: object
      required: [version, buildProfile, running]
      properties:
        version:
          type: string
        buildProfile:
          type: string
        running:
          type: boolean

    StoreHealth:
      type: object
      required: [path, schemaVersion, reachable]
      properties:
        path:
          type: string
        schemaVersion:
          type: integer
        reachable:
          type: boolean

    # Account

    Account:
      type: object
      required: [code, title, group, notes, blocked, blockReason]
      properties:
        code:
          type: string
          description: Account public code (its immutable handle).
        title:
          type: string
          description: Mutable display name.
        group:
          type: string
          description: Group code, or empty string when not in a group.
        notes:
          type: string
        blocked:
          type: boolean
        blockReason:
          type: string
          description: Non-empty when `blocked` is true.

    # Group

    Group:
      type: object
      required: [code, title, notes, blocked, blockReason]
      properties:
        code:
          type: string
          description: Group public code (its immutable handle).
        title:
          type: string
          description: Mutable display title.
        notes:
          type: string
        blocked:
          type: boolean
        blockReason:
          type: string

    # Balance

    Balance:
      type: object
      required: [account, asset, available, held, incoming, realizedPnl, averageEntryPrice, updatedAt]
      properties:
        account:
          type: string
        asset:
          type: string
          description: Balance asset symbol.
        available:
          type: string
          description: Exact decimal string.
        held:
          type: string
          description: Exact decimal string.
        incoming:
          type: string
          description: Exact decimal string.
        realizedPnl:
          type: string
          description: Exact decimal string.
        averageEntryPrice:
          type: string
          description: Exact decimal string.
        updatedAt:
          type: string
          format: date-time

    # Adjustment

    AdjustmentAmount:
      type: object
      required: [mode, value]
      properties:
        mode:
          type: string
          description: Adjustment mode (e.g. `set`, `delta`).
        value:
          type: string
          description: Exact decimal string.

    AdjustmentBounds:
      type: object
      properties:
        lower:
          type: string
          description: Inclusive lower bound - exact decimal string.
        upper:
          type: string
          description: Inclusive upper bound - exact decimal string.

    AdjustmentRequest:
      type: object
      required: [asset]
      properties:
        externalId:
          $ref: "#/components/schemas/ExternalId"
          description: >
            Optional caller-supplied opaque external id for the adjustment record
            (22-char base64url, no padding). Write-only on create: when omitted the
            server generates one and returns it under the record's `externalId`. A
            malformed value is a 400; a duplicate is a 409. Never a surrogate id.
        asset:
          type: string
          description: Asset whose spot-funds balances are adjusted.
        averageEntryPrice:
          type: string
          description: Exact decimal string.
        balance:
          description: Requested available-balance change or target.
          $ref: "#/components/schemas/AdjustmentAmount"
        balanceBounds:
          description: Optional guardrail for the resulting available balance.
          $ref: "#/components/schemas/AdjustmentBounds"
        held:
          description: Requested held-balance change or target.
          $ref: "#/components/schemas/AdjustmentAmount"
        heldBounds:
          description: Optional guardrail for the resulting held balance.
          $ref: "#/components/schemas/AdjustmentBounds"
        incoming:
          description: Requested incoming-balance change or target.
          $ref: "#/components/schemas/AdjustmentAmount"
        incomingBounds:
          description: Optional guardrail for the resulting incoming balance.
          $ref: "#/components/schemas/AdjustmentBounds"

    AdjustmentAccepted:
      type: object
      required: [balanceDelta, balanceResult, heldDelta, heldResult, incomingDelta, incomingResult]
      properties:
        balanceDelta:
          type: string
          description: Exact decimal string.
        balanceResult:
          type: string
          description: Exact decimal string.
        heldDelta:
          type: string
          description: Exact decimal string.
        heldResult:
          type: string
          description: Exact decimal string.
        incomingDelta:
          type: string
          description: Exact decimal string.
        incomingResult:
          type: string
          description: Exact decimal string.

    ExecutionOutcome:
      type: object
      required: [asset, balanceDelta, balanceResult, heldDelta, heldResult, incomingDelta, incomingResult]
      properties:
        asset:
          type: string
          description: Asset this balance effect applies to (base or quote leg).
        balanceDelta:
          type: string
          description: Exact decimal string.
        balanceResult:
          type: string
          description: Exact decimal string.
        heldDelta:
          type: string
          description: Exact decimal string.
        heldResult:
          type: string
          description: Exact decimal string.
        incomingDelta:
          type: string
          description: Exact decimal string.
        incomingResult:
          type: string
          description: Exact decimal string.

    AdjustmentRejected:
      type: object
      required: [code, reason]
      properties:
        code:
          type: string
        scope:
          type: string
        policy:
          type: string
        reason:
          type: string
        details:
          type: string

    AdjustmentOutcome:
      type: object
      description: Exactly one of `accepted` or `rejected` is present.
      properties:
        accepted:
          $ref: "#/components/schemas/AdjustmentAccepted"
        rejected:
          $ref: "#/components/schemas/AdjustmentRejected"

    Adjustment:
      type: object
      required: [externalId, at, account, source, status, request, outcome]
      properties:
        externalId:
          description: The adjustment's opaque public handle.
          $ref: "#/components/schemas/ExternalId"
        at:
          type: string
          format: date-time
        account:
          type: string
          description: Account code the adjustment applied to.
        principal:
          type: string
          description: Principal that performed the adjustment; omitted when absent.
        source:
          type: string
          description: "Originating surface: `panel`, `api`, `mcp`, or `system`."
          enum: [panel, api, mcp, system]
        status:
          type: string
          description: "`accepted` or `rejected`."
          enum: [accepted, rejected]
        request:
          $ref: "#/components/schemas/AdjustmentRequest"
        outcome:
          $ref: "#/components/schemas/AdjustmentOutcome"

    # Order

    Order:
      type: object
      required: [externalId, at, account, baseAsset, quoteAsset, side, amountKind, amountValue, price, status, source, displayPrices]
      properties:
        externalId:
          description: The order's opaque public handle.
          $ref: "#/components/schemas/ExternalId"
        at:
          type: string
          format: date-time
        account:
          type: string
          description: Account code that owns the order.
        principal:
          type: string
          description: Principal that placed the order; omitted when absent.
        baseAsset:
          type: string
        quoteAsset:
          type: string
        side:
          type: string
        amountKind:
          type: string
        amountValue:
          type: string
          description: Exact decimal string.
        price:
          type: string
          description: Exact decimal string.
        status:
          type: string
        source:
          type: string
          description: "Originating surface: `panel`, `api`, `mcp`, or `system`."
          enum: [panel, api, mcp, system]
        displayPrices:
          type: array
          items:
            type: string
          description: >
            Human-readable reservation lock prices derived from the opaque lock
            (settlement leg last) - exact decimal strings. The raw lock blob is
            never exposed.

    # Order approval

    OrderApproval:
      type: object
      required: [token, keyId, alg, mode, issuedAt, expiresAt, signed]
      description: >
        An order's persisted signed approval envelope. No surrogate or engine id
        is present.
      properties:
        token:
          type: string
          description: The exact base64url approval envelope bytes.
        keyId:
          type: string
          description: Identifier of the signing key that produced the envelope.
        alg:
          type: string
          description: >
            Envelope algorithm: `ed25519` for a signed approval, `none` for an
            eSign-off envelope.
          enum: [ed25519, none]
        mode:
          type: string
          description: Submit mode the approval was issued for.
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        signed:
          type: boolean
          description: Whether the envelope carries an Ed25519 signature (alg `ed25519`).

    # Order event

    OrderEvent:
      type: object
      required: [externalId, order, at, type, source]
      properties:
        externalId:
          description: The event's opaque public handle.
          $ref: "#/components/schemas/ExternalId"
        order:
          description: The parent order's opaque public handle.
          $ref: "#/components/schemas/ExternalId"
        at:
          type: string
          format: date-time
        type:
          type: string
        source:
          type: string
          enum: [panel, api, mcp, system]
        principal:
          type: string
          description: Principal that caused the event; omitted when absent.
        rejectCode:
          type: string
          description: Present on rejected events and account-blocking fill events.
        rejectScope:
          type: string
          description: Present on rejected events and account-blocking fill events.
        rejectPolicy:
          type: string
          description: Present on rejected events.
        rejectReason:
          type: string
          description: Present on rejected events and account-blocking fill events.
        rejectDetails:
          type: string
          description: Present on rejected events and account-blocking fill events.
        fillQuantity:
          type: string
          description: Exact decimal string; present on fill events.
        fillPrice:
          type: string
          description: Exact decimal string; present on fill events.
        fillLockPrice:
          type: string
          description: Exact decimal string; present on fill events.

    # Trade

    Trade:
      type: object
      required: [externalId, order, at, account, baseAsset, quoteAsset, side, quantity, price, lockPrice, source]
      properties:
        externalId:
          description: The trade's opaque public handle.
          $ref: "#/components/schemas/ExternalId"
        order:
          description: The originating order's opaque public handle.
          $ref: "#/components/schemas/ExternalId"
        at:
          type: string
          format: date-time
        account:
          type: string
          description: Account code that owns the trade.
        principal:
          type: string
          description: Principal that caused the trade; omitted when absent.
        baseAsset:
          type: string
        quoteAsset:
          type: string
        side:
          type: string
        quantity:
          type: string
          description: Exact decimal string.
        price:
          type: string
          description: Exact decimal string.
        lockPrice:
          type: string
          description: Exact decimal string.
        source:
          type: string
          enum: [panel, api, mcp, system]

    # Order check (pre-trade dry-run)

    OrderReject:
      type: object
      required: [code, scope, policy, reason, details]
      properties:
        code:
          type: string
        scope:
          type: string
        policy:
          type: string
        reason:
          type: string
        details:
          type: string

    CheckResult:
      type: object
      required: [passed, rejects, wouldDisplayPrices, wouldBlock]
      properties:
        passed:
          type: boolean
          description: Whether the order would pass pre-trade.
        rejects:
          type: array
          items:
            $ref: "#/components/schemas/OrderReject"
          description: Engine pre-trade rejects; empty when the check passed.
        wouldDisplayPrices:
          type: array
          items:
            type: string
          description: >
            Human-readable reservation lock prices the order would lock - exact
            decimal strings, never the opaque lock blob.
        wouldBlock:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ExecutionBlock"
          description: Account block the engine would record; null when none.

    # Execution report result

    ExecutionBlock:
      type: object
      required: [account, code, reason, details]
      properties:
        account:
          type: string
        code:
          type: string
        reason:
          type: string
        details:
          type: string

    ExecutionResult:
      type: object
      required: [blocks, outcomes]
      properties:
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/ExecutionBlock"
          description: Account blocks the engine recorded during this report.
        outcomes:
          type: array
          items:
            $ref: "#/components/schemas/ExecutionOutcome"
          description: >
            Per-asset balance effects of the fill. A spot fill settles both
            legs, so each outcome is tagged with its own asset (the base asset
            bought and the quote asset spent).

    # Limits (typed barriers)

    LimitScope:
      type: string
      description: >
        Policy scope discriminator: `broker` (global), `asset`, `account`, or
        `account_asset`.
      enum: [broker, asset, account, account_asset]

    RateLimit:
      type: object
      required: [scope, account, asset, windowMs, maxOrders]
      properties:
        scope:
          $ref: "#/components/schemas/LimitScope"
        account:
          type: string
          description: Account code this barrier applies to, or empty for a global barrier.
        asset:
          type: string
          description: Asset this barrier applies to, or empty when not asset-scoped.
        windowMs:
          type: integer
          format: int64
          description: Rolling rate-limit window in milliseconds.
        maxOrders:
          type: integer
          minimum: 1
          maximum: 1000000000
          description: Maximum orders permitted within the window.

    OrderSizeLimit:
      type: object
      required: [scope, account, asset, maxQuantity, maxNotional]
      properties:
        scope:
          $ref: "#/components/schemas/LimitScope"
        account:
          type: string
          description: Account code this barrier applies to, or empty for a global barrier.
        asset:
          type: string
          description: Asset this barrier applies to, or empty when not asset-scoped.
        maxQuantity:
          type: string
          description: Maximum order quantity - exact decimal string; empty when unset.
        maxNotional:
          type: string
          description: Maximum order notional - exact decimal string; empty when unset.

    PnlBoundsLimit:
      type: object
      required: [scope, account, asset, lowerBound, upperBound, initialPnl]
      properties:
        scope:
          $ref: "#/components/schemas/LimitScope"
        account:
          type: string
          description: Account code this barrier applies to, or empty for a global barrier.
        asset:
          type: string
          description: Asset this barrier applies to, or empty when not asset-scoped.
        lowerBound:
          type: string
          description: Lower P&L bound - exact decimal string; empty when unset.
        upperBound:
          type: string
          description: Upper P&L bound - exact decimal string; empty when unset.
        initialPnl:
          type: string
          description: Seed P&L value - exact decimal string; empty when unset.

    AccountLimits:
      type: object
      required: [rateLimits, orderSizeLimits, pnlBoundsLimits]
      properties:
        rateLimits:
          type: array
          description: Rate-limit barriers (always a non-null array).
          items:
            $ref: "#/components/schemas/RateLimit"
        orderSizeLimits:
          type: array
          description: Order-size barriers (always a non-null array).
          items:
            $ref: "#/components/schemas/OrderSizeLimit"
        pnlBoundsLimits:
          type: array
          description: P&L-bounds kill-switch barriers (always a non-null array).
          items:
            $ref: "#/components/schemas/PnlBoundsLimit"

    # Audit

    AuditEntry:
      type: object
      required: [externalId, at, actor, actorTitle, action, account, accountTitle, detail, source]
      properties:
        externalId:
          description: The audit row's opaque public handle.
          $ref: "#/components/schemas/ExternalId"
        at:
          type: string
          format: date-time
        actor:
          type: string
          description: Principal that performed the action.
        actorTitle:
          type: string
          description: Principal title captured when the audit row was written.
        action:
          type: string
        account:
          type: string
          description: Account the action applied to, or empty for global actions.
        accountTitle:
          type: string
          description: Account title captured when the audit row was written.
        detail:
          type: string
        source:
          type: string
          description: "Originating surface: `panel`, `api`, `mcp`, or `system`."
          enum: [panel, api, mcp, system]

    AuditActionGroup:
      type: object
      required: [category, actions]
      properties:
        category:
          type: string
          description: Audit action category.
          enum: [control, trading]
        actions:
          type: array
          description: Action names in the category, in canonical order.
          items:
            type: string

    # Overview

    Counts:
      type: object
      required: [accounts, accountsActive, groups, groupsActive, limits, ordersToday, ordersTotal]
      properties:
        accounts:
          type: integer
          description: Total accounts.
        accountsActive:
          type: integer
          description: Accounts that are not blocked.
        groups:
          type: integer
          description: Total account groups.
        groupsActive:
          type: integer
          description: Account groups that are not blocked.
        limits:
          type: integer
        ordersToday:
          type: integer
          description: >-
            Orders recorded since the today boundary (the optional `since`
            query parameter, else server-local start of day).
        ordersTotal:
          type: integer
          description: Total orders recorded.

    Activity:
      type: object
      required: [at, source, kind, ref, summary]
      properties:
        at:
          type: string
          format: date-time
        source:
          type: string
          enum: [panel, api, mcp, system]
        kind:
          type: string
        ref:
          type: string
        summary:
          type: string

    Overview:
      type: object
      required: [counts, activity]
      properties:
        counts:
          $ref: "#/components/schemas/Counts"
        activity:
          type: array
          items:
            $ref: "#/components/schemas/Activity"

    # Service

    ServiceDatabase:
      type: object
      required: [path, reachable]
      properties:
        path:
          type: string
        reachable:
          type: boolean

    Service:
      type: object
      required: [name, engineVersion, engineBuildProfile, release, database]
      properties:
        name:
          type: string
        engineVersion:
          type: string
          description: Engine library version string.
        engineBuildProfile:
          type: string
        release:
          type: boolean
        database:
          $ref: "#/components/schemas/ServiceDatabase"

    ServiceLogs:
      type: object
      required: [lines, count]
      properties:
        lines:
          type: array
          description: Buffered log lines, oldest first.
          items:
            type: string
        count:
          type: integer
          description: Number of lines returned.

    # User settings

    UserSettings:
      type: object
      required: [welcomeSeen]
      properties:
        welcomeSeen:
          type: boolean
          description: Whether the operator dismissed the first-run welcome dialog.

    # Market data

    MarketData:
      type: object
      required: [providers, instances, freshnessSeconds, restartRequired]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/MarketDataProvider"
        instances:
          type: array
          items:
            $ref: "#/components/schemas/MarketDataInstance"
        freshnessSeconds:
          type: integer
          description: >
            Quote freshness window in seconds. An instrument is stale only when
            both its source and the instrument are enabled and no quote has been
            received or the latest quote is older.
        restartRequired:
          type: boolean
          description: >
            True when stored market-data configuration no longer matches the
            feed runtime and the operator must restart feeds to apply it.

    MarketDataProvider:
      type: object
      required: [type, title]
      properties:
        type:
          type: string
          description: Provider type identifier.
          enum: [ib, binance, kraken, coinbase, alpaca, okx, bybit, oanda, finnhub, byo, mock]
        title:
          type: string

    MarketDataInstanceCreate:
      type: object
      required: [provider, enabled]
      properties:
        externalId:
          $ref: "#/components/schemas/ExternalId"
          description: >
            Optional caller-supplied opaque external id for the instance (22-char
            base64url, no padding). When omitted the server generates one and
            returns it in the instance's `externalId`. A malformed value is a 400;
            a duplicate is a 409. Never a surrogate id.
        provider:
          type: string
          description: Provider discriminator.
          enum: [ib, binance, kraken, coinbase, alpaca, okx, bybit, oanda, finnhub, byo, mock]
        label:
          type: string
          description: Unique human-readable label shown in the operator panel.
        credentials:
          type: string
          description: Opaque provider-specific connection settings JSON.
        enabled:
          type: boolean
          description: Whether the source instance should start enabled.

    MarketDataInstanceSettingsUpdate:
      type: object
      properties:
        label:
          type: string
          description: Unique human-readable label shown in the operator panel.
        credentials:
          type: string
          description: >
            Opaque provider-specific connection settings JSON. During update,
            blank string fields preserve existing stored values so secret
            placeholders can be submitted without exposing stored secrets.

    MarketDataInstance:
      type: object
      required:
        [
          externalId,
          provider,
          label,
          credentials,
          state,
          enabled,
          verifiesSymbols,
          searchesSymbols,
        ]
      properties:
        externalId:
          description: The instance's opaque public handle.
          $ref: "#/components/schemas/ExternalId"
        provider:
          type: string
          description: Provider discriminator.
          enum:
            - ib
            - binance
            - kraken
            - coinbase
            - alpaca
            - okx
            - bybit
            - oanda
            - finnhub
            - byo
            - mock
        label:
          type: string
          description: Human-readable label shown in the operator panel.
        credentials:
          type: string
          description: Always redacted to an empty string in responses.
        settings:
          type: object
          additionalProperties: true
          description: Non-secret provider settings safe to display in edit forms.
        secrets:
          type: object
          additionalProperties:
            type: boolean
          description: Stored-secret presence flags; never contains secret values.
        state:
          type: string
          description: >
            Current subscription state: `disabled` (instance disabled),
            `pending` (enabled in the store but not yet applied; restart to
            apply), `ok` (subscribed), or `error` (subscription failed). Empty
            when no connector runtime is wired.
          enum: ["", disabled, pending, ok, error]
        error:
          type: string
          description: Short operator-facing message present only when `state` is `error`.
        enabled:
          type: boolean
        verifiesSymbols:
          type: boolean
          description: Whether this provider can verify configured symbols.
        searchesSymbols:
          type: boolean
          description: Whether this provider can search provider-side symbols.
        instruments:
          type: array
          items:
            $ref: "#/components/schemas/MarketDataInstrument"
        references:
          description: Provider documentation and symbol catalogue links.
          $ref: "#/components/schemas/MarketDataReferences"
        diagnostics:
          type: array
          description: Operator-facing diagnostics for this instance.
          items:
            $ref: "#/components/schemas/MarketDataDiagnostic"

    MarketDataReferences:
      type: object
      properties:
        docsUrl:
          type: string
          description: URL to provider documentation.
        symbolsUrl:
          type: string
          description: URL to a provider symbol catalogue.

    MarketDataDiagnostic:
      type: object
      required: [level, code, kind, title, detail, at]
      properties:
        level:
          type: string
          description: Severity level (e.g. `info`, `warn`, `error`).
        code:
          type: string
          description: Machine-readable diagnostic code.
        kind:
          type: string
          description: Diagnostic category.
        title:
          type: string
          description: Short operator-facing summary.
        detail:
          type: string
          description: Full operator-facing description.
        remediation:
          type: string
          description: Suggested remediation steps.
        instrument:
          type: string
          description: Affected instrument symbol, if applicable.
        actions:
          type: array
          description: Suggested operator actions.
          items:
            $ref: "#/components/schemas/MarketDataDiagnosticAction"
        at:
          type: string
          format: date-time
          description: When the diagnostic was recorded.

    MarketDataDiagnosticAction:
      type: object
      required: [type]
      properties:
        type:
          type: string
          description: Action discriminator.
        target:
          type: string
          description: Action target identifier.

    MarketDataInstrument:
      type: object
      required: [externalSymbol, baseAsset, quoteAsset, manualPrice, enabled]
      properties:
        instanceExternalId:
          description: >
            The owning instance's opaque public handle. Present on read
            responses; omitted in request bodies (the path id is authoritative).
          $ref: "#/components/schemas/ExternalId"
        externalSymbol:
          type: string
          description: Provider-side instrument symbol.
        baseAsset:
          type: string
          description: Asset being bought or sold for this mapping.
        quoteAsset:
          type: string
          description: Asset used for pricing and settlement for this mapping.
        manualPrice:
          type: string
          description: >
            Exact decimal manual mark used by BYO/manual providers. On write,
            use an empty string "" for instruments or providers without a manual mark.
        enabled:
          type: boolean
          description: Whether this instrument mapping is enabled.
        updateIntervalMs:
          type: integer
          description: >
            Elapsed milliseconds between the two most recent quote updates,
            present on read responses when available.
        stale:
          type: boolean
          description: >
            Whether the latest quote is missing or older than `freshnessSeconds`.
            False when the source or instrument is disabled.
        quote:
          description: Latest quote for this mapping on read responses.
          $ref: "#/components/schemas/MarketDataQuote"

    MarketDataSymbolVerificationRequest:
      type: object
      required: [externalSymbol]
      properties:
        externalSymbol:
          type: string
          description: Provider-side symbol to verify.

    MarketDataSymbolVerification:
      type: object
      required: [supported, exists]
      properties:
        supported:
          type: boolean
          description: Whether the provider supports symbol verification.
        exists:
          type: boolean
          description: Whether the symbol exists as typed.
        suggestion:
          type: string
          description: Case-folded provider symbol variant when available.
        details:
          type: string
          description: Provider metadata for the matched symbol.

    MarketDataSymbolSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: Symbol text to search for on the provider.
        secType:
          type: string
          description: Optional provider security type filter, such as `STK` or `CASH`.
        exchange:
          type: string
          description: Optional exchange or venue filter.
        currency:
          type: string
          description: Optional settlement currency filter.
        lastTradeDateOrContractMonth:
          type: string
          description: Optional futures or options expiry in provider format.
        right:
          type: string
          description: Optional option right filter, such as `C` or `P`.
        strike:
          type: string
          description: Exact decimal string.

    MarketDataSymbolSearch:
      type: object
      required: [supported, matches]
      properties:
        supported:
          type: boolean
          description: Whether the provider supports symbol search.
        matches:
          type: array
          items:
            $ref: "#/components/schemas/MarketDataSymbolMatch"

    MarketDataSymbolMatch:
      type: object
      required: [symbol, secType]
      properties:
        symbol:
          type: string
        name:
          type: string
        secType:
          type: string
        exchange:
          type: string
        primaryExchange:
          type: string
        currency:
          type: string
        conId:
          type: string
        lastTradeDateOrContractMonth:
          type: string
        strike:
          type: string
          description: Exact decimal string.
        right:
          type: string
        multiplier:
          type: string
        localSymbol:
          type: string
        tradingClass:
          type: string

    MarketDataQuote:
      type: object
      required: [asOf, receivedAt, mark, bid, ask]
      properties:
        asOf:
          type: string
          format: date-time
          description: Provider quote timestamp.
        receivedAt:
          type: string
          format: date-time
          description: Time the Officer connector manager received the quote.
        mark:
          type: string
          description: Exact decimal string.
        bid:
          type: string
          description: Exact decimal string.
        ask:
          type: string
          description: Exact decimal string.

    # MCP access control

    McpCommand:
      type: object
      required:
        [name, title, agentDescription, mutating, protective, implemented, enabled]
      properties:
        name:
          type: string
          description: Wire name of the MCP tool.
        title:
          type: string
          description: Human-readable label for the operator panel.
        agentDescription:
          type: string
          description: One-line description of what an AI agent does with the command.
        mutating:
          type: boolean
          description: Whether the command changes control-plane or engine state.
        protective:
          type: boolean
          description: >
            Whether the command guards capital or risk posture, so the panel can
            require confirmation before enabling it.
        implemented:
          type: boolean
          description: Whether a handler backs the command yet.
        enabled:
          type: boolean
          description: >
            Effective enabled state: the stored override when present, otherwise
            the catalogue default.

    # Signing keys and approval token

    SigningKey:
      type: object
      required: [keyId, alg, createdAt, fingerprint, active]
      description: One Ed25519 signing key entry. Private material is never present.
      properties:
        keyId:
          type: string
          description: Identifier of the signing key.
        alg:
          type: string
          description: Key algorithm.
        createdAt:
          type: string
          format: date-time
        fingerprint:
          type: string
          description: First 8 bytes of the SHA-256 of the public key, hex-encoded.
        active:
          type: boolean
          description: Whether this is the active signing key.

    SigningConfig:
      type: object
      required: [noESign]
      properties:
        noESign:
          type: boolean
          description: Whether the global eSign-off flag is set.

    PublicKey:
      type: object
      required: [publicKey]
      properties:
        publicKey:
          type: string
          description: The active signing key's public key in the requested format.

    ApprovalToken:
      type: object
      required: [token, keyId, expiresAt, orderExternalId]
      description: >
        The approval token issued for an order submit. The authorised order is
        referenced by its opaque external id, never a surrogate id.
      properties:
        token:
          type: string
          description: The base64url approval token.
        keyId:
          type: string
          description: Identifier of the signing key that produced the token.
        expiresAt:
          type: string
          format: date-time
        orderExternalId:
          description: The authorised order's opaque public handle.
          $ref: "#/components/schemas/ExternalId"
