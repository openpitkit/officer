openapi: "3.1.0"

info:
  title: Pit Officer REST API
  version: "1"
  description: >
    Control-plane REST API for the Pit Officer service. The public surface is
    mounted at `/api/v1`; an identical mirror at `/app/api/v1` is reserved for
    the operator dashboard. All responses are `application/json`. Errors use the
    envelope `{"error":{"code":"...","message":"..."}}`. Money and size values
    are exact decimal strings - never IEEE 754 floats.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: /api/v1
    description: Public REST API

tags:
  - name: health
    description: Liveness and deployment status
  - name: accounts
    description: Account lifecycle and admin
  - name: groups
    description: Account group lifecycle and admin
  - name: balances
    description: Spot-funds balance snapshots
  - name: adjustments
    description: Balance adjustments (apply and list)
  - name: orders
    description: Order submission and retrieval
  - name: trades
    description: Trade records
  - name: limits
    description: Risk limit barriers
  - name: audit
    description: Append-only audit trail
  - name: mcp-access
    description: MCP command access control
  - name: user-settings
    description: Operator UI preferences
  - name: market-data
    description: Market-data source configuration and latest quote snapshots
  - name: backup
    description: Portable database backup and restore
  - name: dashboard
    description: Overview and service information

paths:

  # ---------------------------------------------------------------------------
  # Health / status
  # ---------------------------------------------------------------------------

  /health:
    get:
      operationId: getHealth
      summary: JSON liveness probe
      tags: [health]
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /status:
    get:
      operationId: getStatus
      summary: Engine and store health across all nodes
      tags: [health]
      responses:
        "200":
          description: Status retrieved (even when unhealthy the body is returned with 200).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          description: Status unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------------------
  # Backup / restore
  # ---------------------------------------------------------------------------

  /backup/export:
    post:
      operationId: exportBackup
      summary: Export a portable database backup
      tags: [backup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope:
                  description: Backup scope that selects sections and entities to export.
                  $ref: "#/components/schemas/BackupScope"
                zip:
                  type: boolean
                  description: Return a ZIP archive containing the JSON backup.
      responses:
        "200":
          description: Portable backup archive, as JSON or ZIP.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Timestamped backup filename.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupArchive"
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /backup/restore:
    post:
      operationId: restoreBackup
      summary: Restore a portable database backup
      tags: [backup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, mode]
              properties:
                archive:
                  description: Inline JSON backup archive to restore.
                  $ref: "#/components/schemas/BackupArchive"
                archiveFile:
                  type: string
                  format: byte
                  description: Base64-encoded JSON backup or ZIP containing one JSON backup.
                archiveFilename:
                  type: string
                  description: Original uploaded filename for diagnostics.
                scope:
                  description: Restore scope that selects sections and entities to apply.
                  $ref: "#/components/schemas/BackupScope"
                mode:
                  description: Restore conflict handling mode.
                  $ref: "#/components/schemas/BackupRestoreMode"
      responses:
        "200":
          description: Restore completed.
          content:
            application/json:
              schema:
                type: object
                required: [summary]
                properties:
                  summary:
                    $ref: "#/components/schemas/BackupRestoreSummary"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /database/reset:
    post:
      operationId: resetDatabase
      summary: Delete all data and recreate the database
      tags: [backup]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: boolean
                  description: Must be true to confirm the destructive reset.
      responses:
        "200":
          description: Database recreated from scratch.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Accounts
  # ---------------------------------------------------------------------------

  /accounts:
    get:
      operationId: listAccounts
      summary: List all accounts
      tags: [accounts]
      responses:
        "200":
          description: Account list.
          content:
            application/json:
              schema:
                type: object
                required: [accounts]
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createAccount
      summary: Create an account
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  description: Account identifier.
      responses:
        "201":
          description: Account created.
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account:
                    $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"

  /accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    get:
      operationId: getAccount
      summary: Get account detail and its relational limits
      tags: [accounts]
      responses:
        "200":
          description: Account and its limits.
          content:
            application/json:
              schema:
                type: object
                required: [account, limits]
                properties:
                  account:
                    $ref: "#/components/schemas/Account"
                  limits:
                    type: array
                    items:
                      $ref: "#/components/schemas/Limit"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /accounts/{id}/block:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    post:
      operationId: blockAccount
      summary: Block an account
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: Human-readable reason for the block.
      responses:
        "200":
          description: Account after blocking.
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account:
                    $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /accounts/{id}/unblock:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    post:
      operationId: unblockAccount
      summary: Unblock an account
      tags: [accounts]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Account after unblocking.
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account:
                    $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /accounts/{id}/group:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    put:
      operationId: setAccountGroup
      summary: Set (or clear) account group membership
      description: >
        Assigns the account to a group. Pass an empty string to clear group
        membership.
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [group]
              properties:
                group:
                  type: string
                  description: Group identifier. Empty string clears membership.
      responses:
        "200":
          description: Account after update.
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account:
                    $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /accounts/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    put:
      operationId: setAccountNotes
      summary: Set operator notes on an account
      tags: [accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notes]
              properties:
                notes:
                  type: string
                  description: Free-form operator notes stored on the account.
      responses:
        "200":
          description: Account after update.
          content:
            application/json:
              schema:
                type: object
                required: [account]
                properties:
                  account:
                    $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /accounts/{id}/adjustments:
    parameters:
      - $ref: "#/components/parameters/AccountID"
    get:
      operationId: listAccountAdjustments
      summary: List adjustments for an account
      tags: [adjustments]
      parameters:
        - $ref: "#/components/parameters/SourceFilter"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Adjustment list.
          content:
            application/json:
              schema:
                type: object
                required: [adjustments]
                properties:
                  adjustments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Adjustment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: applyAdjustment
      summary: Apply a balance adjustment to an account
      description: >
        Runs the adjustment through the engine. A policy reject is a successful
        call: the rejected record is returned in the body with `status` =
        `"rejected"`. HTTP errors indicate only system-level failures.
      tags: [adjustments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustmentRequest"
      responses:
        "201":
          description: Adjustment record created (accepted or rejected).
          content:
            application/json:
              schema:
                type: object
                required: [adjustment]
                properties:
                  adjustment:
                    $ref: "#/components/schemas/Adjustment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Groups
  # ---------------------------------------------------------------------------

  /groups:
    get:
      operationId: listGroups
      summary: List all account groups
      tags: [groups]
      responses:
        "200":
          description: Group list.
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: "#/components/schemas/Group"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: createGroup
      summary: Create an account group
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:
                  type: string
                  description: Group identifier.
                notes:
                  type: string
                  description: Free-form operator notes stored on the group.
      responses:
        "201":
          description: Group created.
          content:
            application/json:
              schema:
                type: object
                required: [group]
                properties:
                  group:
                    $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"

  /groups/{id}:
    parameters:
      - $ref: "#/components/parameters/GroupID"
    get:
      operationId: getGroup
      summary: Get group detail and its member accounts
      tags: [groups]
      responses:
        "200":
          description: Group and its member accounts.
          content:
            application/json:
              schema:
                type: object
                required: [group, accounts]
                properties:
                  group:
                    $ref: "#/components/schemas/Group"
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteGroup
      summary: Delete a group
      tags: [groups]
      responses:
        "204":
          description: Group deleted.
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /groups/{id}/notes:
    parameters:
      - $ref: "#/components/parameters/GroupID"
    put:
      operationId: setGroupNotes
      summary: Set operator notes on a group
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [notes]
              properties:
                notes:
                  type: string
                  description: Free-form operator notes stored on the group.
      responses:
        "200":
          description: Group after update.
          content:
            application/json:
              schema:
                type: object
                required: [group]
                properties:
                  group:
                    $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /groups/{id}/block:
    parameters:
      - $ref: "#/components/parameters/GroupID"
    post:
      operationId: blockGroup
      summary: Block all accounts in a group
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  description: Human-readable reason for the block.
      responses:
        "200":
          description: Group after blocking.
          content:
            application/json:
              schema:
                type: object
                required: [group]
                properties:
                  group:
                    $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /groups/{id}/unblock:
    parameters:
      - $ref: "#/components/parameters/GroupID"
    post:
      operationId: unblockGroup
      summary: Unblock all accounts in a group
      tags: [groups]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Group after unblocking.
          content:
            application/json:
              schema:
                type: object
                required: [group]
                properties:
                  group:
                    $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Balances
  # ---------------------------------------------------------------------------

  /balances:
    get:
      operationId: listBalances
      summary: List spot-funds balance snapshots
      tags: [balances]
      parameters:
        - name: account
          in: query
          description: Filter by account identifier.
          schema:
            type: string
        - name: asset
          in: query
          description: Filter by asset symbol.
          schema:
            type: string
      responses:
        "200":
          description: Balance list.
          content:
            application/json:
              schema:
                type: object
                required: [balances]
                properties:
                  balances:
                    type: array
                    items:
                      $ref: "#/components/schemas/Balance"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Global adjustments list
  # ---------------------------------------------------------------------------

  /adjustments:
    get:
      operationId: listAdjustments
      summary: List adjustments across all accounts
      tags: [adjustments]
      parameters:
        - name: account
          in: query
          description: Filter by account identifier.
          schema:
            type: string
        - $ref: "#/components/parameters/SourceFilter"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Adjustment list.
          content:
            application/json:
              schema:
                type: object
                required: [adjustments]
                properties:
                  adjustments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Adjustment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Orders
  # ---------------------------------------------------------------------------

  /orders:
    get:
      operationId: listOrders
      summary: List orders
      tags: [orders]
      parameters:
        - name: account
          in: query
          description: Filter by account identifier.
          schema:
            type: string
        - $ref: "#/components/parameters/SourceFilter"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Order list.
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items:
                      $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      operationId: submitOrder
      summary: Submit an order through pre-trade risk evaluation
      description: >
        Runs the order through the engine pre-trade checks and records the result.
        An engine reject is a successful call: the returned order carries
        `status` = `"rejected"`. HTTP errors indicate only system-level failures.
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, baseAsset, quoteAsset, side, amountKind, amountValue]
              properties:
                account:
                  type: string
                  description: Account identifier that owns the order.
                baseAsset:
                  type: string
                  description: Asset being bought or sold.
                quoteAsset:
                  type: string
                  description: Asset used for pricing and settlement.
                side:
                  type: string
                  description: "`buy` or `sell`."
                amountKind:
                  type: string
                  description: "Kind of amount - e.g. `base` or `quote`."
                amountValue:
                  type: string
                  description: Exact decimal string.
                price:
                  type: string
                  description: Exact decimal string. Omit for market orders.
      responses:
        "201":
          description: Order record created (accepted or rejected by the engine).
          content:
            application/json:
              schema:
                type: object
                required: [order]
                properties:
                  order:
                    $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /orders/check:
    post:
      operationId: checkOrder
      summary: Check an order against pre-trade risk evaluation (non-mutating)
      description: >
        Runs the order through the engine pre-trade checks as a dry-run and
        reports whether it would pass. Nothing is recorded and no state changes:
        no order is placed and no funds are reserved. An engine reject is a
        successful call returning `passed` = `false` with the reasons; HTTP
        errors indicate only system-level failures. The request body is
        identical to `POST /orders`.
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account, baseAsset, quoteAsset, side, amountKind, amountValue]
              properties:
                account:
                  type: string
                  description: Account identifier to evaluate without mutation.
                baseAsset:
                  type: string
                  description: Asset being bought or sold.
                quoteAsset:
                  type: string
                  description: Asset used for pricing and settlement.
                side:
                  type: string
                  description: "`buy` or `sell`."
                amountKind:
                  type: string
                  description: "Kind of amount - e.g. `base` or `quote`."
                amountValue:
                  type: string
                  description: Exact decimal string.
                price:
                  type: string
                  description: Exact decimal string. Omit for market orders.
      responses:
        "200":
          description: Dry-run outcome (would-pass or would-reject).
          content:
            application/json:
              schema:
                type: object
                required: [check]
                properties:
                  check:
                    $ref: "#/components/schemas/CheckResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /orders/{id}:
    parameters:
      - $ref: "#/components/parameters/OrderID"
    get:
      operationId: getOrder
      summary: Get an order with its lifecycle events and trades
      tags: [orders]
      responses:
        "200":
          description: Order, events, and trades.
          content:
            application/json:
              schema:
                type: object
                required: [order, events, trades]
                properties:
                  order:
                    $ref: "#/components/schemas/Order"
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/OrderEvent"
                  trades:
                    type: array
                    items:
                      $ref: "#/components/schemas/Trade"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /orders/{id}/execution-reports:
    parameters:
      - $ref: "#/components/parameters/OrderID"
    post:
      operationId: applyExecutionReport
      summary: Apply an execution report (fill) to an order
      description: >
        Records a fill against the parent order. The instrument, account, and
        side are taken from the parent order; only the fill fields are required
        in the body. Returns account blocks the engine recorded plus per-asset
        adjustment outcomes.
      tags: [orders]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity, price, final]
              properties:
                quantity:
                  type: string
                  description: Fill quantity - exact decimal string.
                price:
                  type: string
                  description: Fill price - exact decimal string.
                lockPrice:
                  type: string
                  description: Lock price used for fund reservation - exact decimal string.
                force:
                  type: boolean
                  description: >
                    Bypass Officer's safety checks and route straight to the
                    engine. When omitted or false, a terminal order returns 409
                    terminal_order.
                final:
                  type: boolean
                  description: Whether this is the last fill for the order.
      responses:
        "201":
          description: Execution result; the fill (trade) record was created.
          content:
            application/json:
              schema:
                type: object
                required: [result]
                properties:
                  result:
                    $ref: "#/components/schemas/ExecutionResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Trades
  # ---------------------------------------------------------------------------

  /trades:
    get:
      operationId: listTrades
      summary: List trade records
      tags: [trades]
      parameters:
        - name: account
          in: query
          description: Filter by account identifier.
          schema:
            type: string
        - $ref: "#/components/parameters/SourceFilter"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Trade list.
          content:
            application/json:
              schema:
                type: object
                required: [trades]
                properties:
                  trades:
                    type: array
                    items:
                      $ref: "#/components/schemas/Trade"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Limits
  # ---------------------------------------------------------------------------

  /limits:
    get:
      operationId: listLimits
      summary: List risk limit barriers
      tags: [limits]
      parameters:
        - name: account
          in: query
          description: Filter by account identifier.
          schema:
            type: string
      responses:
        "200":
          description: Limit list.
          content:
            application/json:
              schema:
                type: object
                required: [limits]
                properties:
                  limits:
                    type: array
                    items:
                      $ref: "#/components/schemas/Limit"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      operationId: putLimit
      summary: Upsert a risk limit barrier
      tags: [limits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Limit"
      responses:
        "200":
          description: Normalized form of the stored limit.
          content:
            application/json:
              schema:
                type: object
                required: [limit]
                properties:
                  limit:
                    $ref: "#/components/schemas/Limit"
        "400":
          $ref: "#/components/responses/ValidationError"
        "501":
          $ref: "#/components/responses/NotImplementedError"
        "503":
          $ref: "#/components/responses/EngineRestartingError"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      operationId: deleteLimit
      summary: Delete a risk limit barrier
      tags: [limits]
      parameters:
        - name: policy
          in: query
          required: true
          description: Risk policy name whose barrier should be deleted.
          schema:
            type: string
        - name: scope
          in: query
          required: true
          description: Policy scope discriminator of the barrier to delete.
          schema:
            type: string
        - name: account
          in: query
          description: Account-scoped barrier owner, or omit for a global barrier.
          schema:
            type: string
        - name: asset
          in: query
          description: Asset-scoped barrier asset, or omit when not asset-scoped.
          schema:
            type: string
      responses:
        "204":
          description: Limit deleted.
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "503":
          $ref: "#/components/responses/EngineRestartingError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Audit
  # ---------------------------------------------------------------------------

  /audit:
    get:
      operationId: listAudit
      summary: List audit trail entries
      description: >
        Returns audit rows in reverse chronological order. Optional `account`
        and `source` filters narrow the trail. `source` values: `panel`, `api`,
        `mcp`, `system`. The action filter resolves from an explicit
        `actions` include-list when present, otherwise from `category`; it
        defaults to `control`, so the high-volume trading stream (`submit_order`,
        `execution_report`) is hidden unless requested. The action filter is
        applied before the limit, so control rows are never crowded out by
        trading volume.
      tags: [audit]
      parameters:
        - name: account
          in: query
          description: Filter by account identifier.
          schema:
            type: string
        - name: source
          in: query
          description: "Filter by originating surface: `panel`, `api`, `mcp`, or `system`."
          schema:
            type: string
            enum: [panel, api, mcp, system]
        - name: category
          in: query
          description: >
            Action category shortcut, used when `actions` is absent: `control`
            (default) hides trading, `trading` shows only the order/execution
            stream, `all` disables the action filter.
          schema:
            type: string
            enum: [control, trading, all]
        - name: actions
          in: query
          description: >
            Comma-separated list of audit action types to include (for example
            `block,set_limit`). Overrides `category` when present. Unknown action
            names are rejected with 400.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum rows to return (default 100, capped at 1000).
          schema:
            type: integer
            default: 100
            maximum: 1000
      responses:
        "200":
          description: Audit entries.
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /audit/actions:
    get:
      operationId: listAuditActions
      summary: List the audit-action catalogue grouped by category
      description: >
        Returns every audit action grouped by category, control first, in the
        domain canonical order. It is the single source the web uses to build the
        audit type filter, so the classification is never hardcoded client-side.
      tags: [audit]
      responses:
        "200":
          description: Audit-action catalogue grouped by category.
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditActionGroup"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # MCP access control
  # ---------------------------------------------------------------------------

  /mcp-access:
    get:
      operationId: listMcpAccess
      summary: List the MCP command catalogue and per-command enabled state
      description: >
        Returns every MCP command Pit Officer exposes - both the implemented
        read-only tools and the designed-but-not-yet-built mutating ones - with
        its metadata and current effective enabled state. A command with no
        stored override resolves to its catalogue default (read-only commands
        on, protective commands off).
      tags: [mcp-access]
      responses:
        "200":
          description: MCP command catalogue with effective enabled state.
          content:
            application/json:
              schema:
                type: object
                required: [commands]
                properties:
                  commands:
                    type: array
                    items:
                      $ref: "#/components/schemas/McpCommand"
        "500":
          $ref: "#/components/responses/InternalError"

  /mcp-access/{command}:
    parameters:
      - name: command
        in: path
        required: true
        description: MCP command name (must be in the catalogue).
        schema:
          type: string
    put:
      operationId: setMcpAccess
      summary: Enable or disable one MCP command
      description: >
        Persists the enabled state for one catalogue command. A disabled command
        stays callable over MCP but returns a non-error "disabled in panel"
        notice instead of running. Confirmation-on-enable for protective commands
        is a UI concern; the backend just persists.
      tags: [mcp-access]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                  description: Whether the command is enabled.
      responses:
        "200":
          description: The updated command with its persisted enabled state.
          content:
            application/json:
              schema:
                type: object
                required: [command]
                properties:
                  command:
                    $ref: "#/components/schemas/McpCommand"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # User settings
  # ---------------------------------------------------------------------------

  /user-settings:
    get:
      operationId: getUserSettings
      summary: Read the current operator's UI preferences
      tags: [user-settings]
      responses:
        "200":
          description: Current operator UI preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: setUserSettings
      summary: Persist the current operator's UI preferences
      tags: [user-settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettings"
      responses:
        "200":
          description: Preferences persisted; returns the stored state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  # ---------------------------------------------------------------------------
  # Market data
  # ---------------------------------------------------------------------------

  /market-data:
    get:
      operationId: listMarketData
      summary: List market-data providers, source instances, instruments, and latest quotes
      tags: [market-data]
      responses:
        "200":
          description: Market-data control-plane snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [marketData]
                properties:
                  marketData:
                    $ref: "#/components/schemas/MarketData"
        "500":
          $ref: "#/components/responses/InternalError"

  /market-data/restart:
    post:
      operationId: restartMarketData
      summary: Re-apply market-data configuration by restarting the connectors
      description: >-
        Stops the running connectors and starts them again from the current
        store configuration, so config changes take effect without a process
        restart. Returns the refreshed market-data snapshot.
      tags: [market-data]
      responses:
        "200":
          description: Connectors restarted; returns the refreshed market-data snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [marketData]
                properties:
                  marketData:
                    $ref: "#/components/schemas/MarketData"
        "500":
          $ref: "#/components/responses/InternalError"

  /market-data/instances:
    post:
      operationId: createMarketDataInstance
      summary: Create a market-data source instance
      tags: [market-data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketDataInstanceCreate"
      responses:
        "201":
          description: Instance created; returns the refreshed market-data snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [marketData]
                properties:
                  marketData:
                    $ref: "#/components/schemas/MarketData"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"

  /market-data/instances/{id}/enabled:
    parameters:
      - name: id
        in: path
        required: true
        description: URL-encoded market-data instance identifier.
        schema:
          type: string
    put:
      operationId: setMarketDataInstanceEnabled
      summary: Enable or disable a market-data source instance
      tags: [market-data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                  description: Whether this market-data source instance is enabled.
      responses:
        "200":
          description: Enabled flag persisted.
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled:
                    type: boolean
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /market-data/instances/{id}/settings:
    parameters:
      - name: id
        in: path
        required: true
        description: URL-encoded market-data instance identifier.
        schema:
          type: string
    put:
      operationId: updateMarketDataInstanceSettings
      summary: Update market-data source connection settings
      tags: [market-data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketDataInstanceSettingsUpdate"
      responses:
        "200":
          description: Settings persisted; returns the refreshed market-data snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [marketData]
                properties:
                  marketData:
                    $ref: "#/components/schemas/MarketData"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "500":
          $ref: "#/components/responses/InternalError"

  /market-data/instances/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: URL-encoded market-data instance identifier.
        schema:
          type: string
    delete:
      operationId: deleteMarketDataInstance
      summary: Delete a market-data source instance
      tags: [market-data]
      responses:
        "204":
          description: Instance deleted.
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/InternalError"

  /market-data/instances/{id}/verify-symbol:
    parameters:
      - name: id
        in: path
        required: true
        description: URL-encoded market-data instance identifier.
        schema:
          type: string
    post:
      operationId: verifyMarketDataSymbol
      summary: Verify one provider-side market-data symbol
      tags: [market-data]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketDataSymbolVerificationRequest"
      responses:
        "200":
          description: Symbol verification result.
          content:
            application/json:
              schema:
                type: object
                required: [verification]
                properties:
                  verification:
                    $ref: "#/components/schemas/MarketDataSymbolVerification"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "500":
          $ref: "#/components/responses/InternalError"

  /market-data/instances/{id}/search-symbols:
    parameters:
      - name: id
