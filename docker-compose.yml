# docker-compose for pit-officer in `serve` mode.
#
# Build the image from the officer module root before `docker compose up`:
#
#   just docker-build

services:
  officer:
    image: pit-officer:local
    # Uncomment to build directly from source:
    # build:
    #   context: .
    #   dockerfile: Dockerfile

    command: ["serve"]

    ports:
      # Expose the dashboard + MCP-over-HTTP port.
      # Bind to 127.0.0.1 on the host so the service is not reachable from
      # outside the host without an explicit override.
      - "127.0.0.1:8787:8787"

    environment:
      # Bind to all container-network interfaces (see Dockerfile note).
      PIT_OFFICER_HTTP_ADDR: "0.0.0.0:8787"
      # SQLite database inside the persistent volume.
      PIT_OFFICER_SQLITE_PATH: "/data/pit-officer.db"
      # Headless container: never attempt to launch a browser on serve start.
      PIT_OFFICER_OPEN_BROWSER: "false"
      # Passed through only when set on the host; an empty value is configured
      # but invalid, not absent.
      PIT_OFFICER_MASTER_KEY:
      PIT_OFFICER_MASTER_KEY_FILE:
      # PIT_OFFICER_MASTER_KEY_FILE requires the key file to be bind-mounted
      # into the container.
      # The root filesystem is read-only, so mount that file read-only at the
      # operator's chosen path.
      # Optional: pin a pre-extracted OpenPit runtime library via a bind mount.
      # OPENPIT_RUNTIME_LIBRARY_PATH: /app/lib/libopenpit_ffi.so

    volumes:
      # Named volume for the SQLite database. The database persists across
      # container restarts and image upgrades.
      - officer_data:/data

    restart: unless-stopped

    # Drop all Linux capabilities; the service does not need any.
    cap_drop:
      - ALL

    # Read-only root filesystem; /data and /tmp are writable via tmpfs/volume.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

    healthcheck:
      # Use the binary's own healthcheck subcommand: it probes /healthz and
      # exits 0 on HTTP 200. wget is not present in debian:bookworm-slim.
      test: ["CMD", "/app/pit-officer", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # Persistent storage for the Officer SQLite database.
  officer_data:
    driver: local
